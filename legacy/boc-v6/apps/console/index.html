<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOC Console — ECOREAN</title>
  <style>
    body { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; background: #0a0a0a; color: #d4af37; }
    .header { padding: 24px 40px; border-bottom: 1px solid #d4af37; display: flex; align-items: baseline; gap: 16px; }
    .title { font-size: 28px; letter-spacing: 4px; }
    .subtitle { font-size: 12px; opacity: 0.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; padding: 40px; }
    .module { border: 1px solid #d4af37; padding: 24px; cursor: pointer; transition: all 0.3s; }
    .module:hover { background: rgba(212,175,55,0.1); transform: translateY(-2px); }
    .module-name { font-size: 18px; margin-bottom: 8px; }
    .module-version { font-size: 11px; opacity: 0.5; }
    .module-desc { font-size: 13px; margin-top: 12px; opacity: 0.8; line-height: 1.5; }
    iframe { width: 100%; height: calc(100vh - 100px); border: 0; background: #fff; }
    .back { padding: 12px 24px; cursor: pointer; color: #d4af37; font-size: 14px; border-bottom: 1px solid #333; }
    .back:hover { background: rgba(212,175,55,0.1); }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">BOC Console</div>
    <div class="subtitle">ECOREAN — Build Operation Center / OS v7.0-alpha</div>
  </div>
  <div id="app"></div>
  <script>
    const MODULES = [
      { id: 'minicad', path: '../minicad/index.html' },
      { id: 'estimator', path: '../estimator/index.html' }
    ];

    async function loadManifests() {
      const enriched = [];
      for (const m of MODULES) {
        try {
          const res = await fetch(m.id + '/manifest.json');
          const meta = await res.json();
          enriched.push({ ...m, ...meta });
        } catch (e) {
          enriched.push({ ...m, name: m.id, version: '?', description: '(manifest missing)' });
        }
      }
      return enriched;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderHome(modules) {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="grid">' + modules.map(m =>
        '<div class="module" data-id="' + esc(m.id) + '">' +
          '<div class="module-name">' + esc(m.name) + '</div>' +
          '<div class="module-version">v' + esc(m.version) + '</div>' +
          '<div class="module-desc">' + esc(m.description || '') + '</div>' +
        '</div>'
      ).join('') + '</div>';
      app.querySelectorAll('.module').forEach(el => {
        el.onclick = () => openModule(modules.find(m => m.id === el.dataset.id));
      });
    }

    function openModule(m) {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="back">← 표지로</div>' +
        '<iframe src="' + esc(m.path) + '" sandbox="allow-scripts allow-same-origin"></iframe>';
      app.querySelector('.back').onclick = () => init();
    }

    async function init() {
      const modules = await loadManifests();
      renderHome(modules);
    }

    init();
  </script>
</body>
</html>
