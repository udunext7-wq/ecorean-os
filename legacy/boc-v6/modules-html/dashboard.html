<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>대시보드 (CEO) — ECOREAN BOC</title>
<link rel="stylesheet" href="../shared/boc-design.css">
<style>

#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;flex-shrink:0;background:var(--deep);border-bottom:1px solid var(--border);min-height:44px}
#main{flex:1;overflow-y:auto;padding:14px 18px 20px}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.g::before{background:var(--green)}
.kpi.r::before{background:var(--red)}
.kpi.b::before{background:var(--blue)}
.kpi.gold::before{background:var(--gold)}
.kpi.dim::before{background:var(--dim)}
.kpi-v{font-family:var(--fm);font-size:20px;font-weight:700;color:var(--platinum);margin-bottom:2px}
.kpi-l{font-size:10px;color:var(--dim)}
.kpi-sub{font-size:10px;color:var(--text2);margin-top:4px;font-family:var(--fm)}

/* Sections */
.sec{margin-bottom:14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-t{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em}

/* Alert cards */
.alert-row{display:flex;flex-direction:column;gap:6px}
.alert-card{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:12px}
.alert-card.warn{background:rgba(255,140,0,0.08);border:1px solid rgba(255,140,0,0.25);color:var(--orange)}
.alert-card.err{background:rgba(255,51,85,0.08);border:1px solid rgba(255,51,85,0.25);color:var(--red)}
.alert-card.ok{background:rgba(0,255,178,0.05);border:1px solid rgba(0,255,178,0.15);color:var(--green)}

/* Project cards */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pj{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px;position:relative;overflow:hidden}
.pj::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.pj.risk-hi::before{background:var(--red)}
.pj.risk-md::before{background:var(--orange)}
.pj.risk-lo::before{background:var(--green)}
.pj-nm{font-weight:700;font-size:13px;color:var(--platinum);margin-bottom:6px}
.pj-row{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11px}
.pj-k{color:var(--text2)}
.pj-v{font-family:var(--fm);color:var(--text)}
.prog-bg{height:5px;background:rgba(201,168,76,0.1);border-radius:2px;margin:6px 0}
.prog-fill{height:100%;border-radius:2px}

/* Receivable table */
.dt{width:100%;border-collapse:collapse}
.dt th,.dt td{padding:6px 9px;border:1px solid var(--border);font-size:12px}
.dt th{background:var(--deep);color:var(--text2);font-weight:500}
.dt tr:hover td{background:rgba(201,168,76,0.02)}

/* Trend chart */
#trend-chart{width:100%;height:120px;display:block}

</style>
</head>
<body>
<div id="app">

<div id="topbar">
  <div>
    <div style="font-family:var(--font-head);font-size:18px;font-weight:600;color:var(--gold);letter-spacing:0.04em">대시보드</div>
    <div id="last-update" style="font-size:10px;color:var(--dim)"></div>
  </div>
  <button class="btn btn-g" onclick="DSH.refresh()" style="padding:5px 12px;font-size:12px">↻ 갱신</button>
</div>

<div id="main">

  <!-- TODAY -->
  <div class="sec">
    <div class="sec-hd">
      <div class="sec-t">오늘의 현금흐름</div>
      <div id="today-date" style="font-size:10px;color:var(--dim)"></div>
    </div>
    <div class="kpi-row" id="today-kpi"></div>
  </div>

  <!-- THIS MONTH -->
  <div class="sec">
    <div class="sec-hd"><div class="sec-t">이번달 실적</div></div>
    <div class="kpi-row" id="month-kpi"></div>
  </div>

  <!-- RED ALERT -->
  <div class="sec" id="alert-sec">
    <div class="sec-hd"><div class="sec-t">🚨 RED ALERT</div></div>
    <div class="alert-row" id="alert-list"></div>
  </div>

  <!-- ACTIVE PROJECTS -->
  <div class="sec">
    <div class="sec-hd">
      <div class="sec-t">진행 현장</div>
      <div id="proj-cnt" style="font-size:11px;color:var(--dim)"></div>
    </div>
    <div class="proj-grid" id="proj-grid"></div>
    <div id="proj-empty" style="display:none;padding:20px;text-align:center;color:var(--dim);font-size:12px">진행 중인 현장 없음</div>
  </div>

  <!-- RECEIVABLES -->
  <div class="sec">
    <div class="sec-hd"><div class="sec-t">미수금 현황</div></div>
    <div id="recv-wrap"><div style="color:var(--dim);font-size:12px;padding:8px">데이터 로딩 중...</div></div>
  </div>

  <!-- MONTHLY TREND -->
  <div class="sec">
    <div class="sec-hd"><div class="sec-t">최근 6개월 수익 추이</div></div>
    <canvas id="trend-chart"></canvas>
    <div style="font-size:10px;color:var(--dim);margin-top:4px">출납부 데이터 기반 · 음수 = 손실</div>
  </div>

</div>
</div>

<script src="../shared/engine/boc-engine.js"></script>
<script src="../shared/store/boc-state.js"></script>
<script>
'use strict'
;(function(){

function $id(id){return document.getElementById(id)}
function jp(s,fb){try{return typeof s==='string'?JSON.parse(s):(s||fb)}catch(e){return fb}}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(n){if(n===null||n===undefined)return '—';if(n<0)return '-'+fmt(-n);if(n>=100000000)return (n/100000000).toFixed(1)+'억';if(n>=10000)return Math.round(n/10000)+'만';return n.toLocaleString()}
function fmtW(n){return fmt(n)+'원'}
function dday(ds){if(!ds)return '—';var d=Math.ceil((new Date(ds)-new Date())/(1000*86400));return d>=0?'D-'+d:'D+'+Math.abs(d)}

var S={projects:[],ledger:{}}

// ── Load ─────────────────────────────────────────────
async function refresh(){
  var upd=$id('last-update');if(upd)upd.textContent='업데이트: '+new Date().toLocaleTimeString()
  var td=$id('today-date');if(td)td.textContent=today()
  await loadAll()
  render()
}

async function loadAll(){
  // Projects
  var projs=[]
  if(window.ecoreanAPI?.db?.listProjects){
    projs=await window.ecoreanAPI.db.listProjects()||[]
  } else if(typeof AppState!=='undefined'){
    projs=(AppState.get().projects||[])
  }
  S.projects=projs.map(function(p){
    var parse=function(f){try{if(typeof p[f]==='string')p[f]=JSON.parse(p[f])}catch(e){}}
    parse('result');parse('grades');parse('spaces')
    return p
  })

  // Ledger per project
  S.ledger={}
  if(window.ecoreanAPI?.db?.query){
    for(var i=0;i<S.projects.length;i++){
      var p=S.projects[i]
      try{
        var rows=await window.ecoreanAPI.db.query("SELECT * FROM cash_ledger WHERE projectId=? AND status='active'",[p.id])
        S.ledger[p.id]=rows
      }catch(e){S.ledger[p.id]=[]}
    }
  }
}

// ── Render ────────────────────────────────────────────
function render(){
  renderTodayKPI()
  renderMonthKPI()
  renderAlerts()
  renderProjects()
  renderReceivables()
  renderTrend()
}

function getLedger(projId){
  var rows=S.ledger[projId]||[]
  var inc=rows.filter(function(r){return r.type==='income'})
  var exp=rows.filter(function(r){return r.type==='expense'})
  try{return FinanceEngine.calcProjectFinance(
    inc.map(function(r){return{amount:+r.amount,paid:r.paid===1||r.paid===true}}),
    exp.map(function(r){return{amount:+r.amount,paid:r.paid===1||r.paid===true}})
  )}catch(e){return{totalRevenue:0,totalCost:0,profit:0,profitRate:0,received:0,pending:0,paid:0,unpaid:0,cashBalance:0}}
}

function renderTodayKPI(){
  var el=$id('today-kpi'); if(!el)return
  var todayStr=today()
  var allLedger=[]
  S.projects.forEach(function(p){(S.ledger[p.id]||[]).forEach(function(r){allLedger.push(r)})})
  var todayInc=allLedger.filter(function(r){return r.type==='income'&&r.date===todayStr}).reduce(function(a,r){return a+(+r.amount||0)},0)
  var todayExp=allLedger.filter(function(r){return r.type==='expense'&&r.date===todayStr}).reduce(function(a,r){return a+(+r.amount||0)},0)
  var netCash=todayInc-todayExp
  var totalPending=0
  S.projects.forEach(function(p){var fin=getLedger(p.id);totalPending+=fin.pending||0})
  el.innerHTML=
    kpiCard('입금 예정',fmtW(totalPending),'미수금 중 오늘 이후','b')+
    kpiCard('오늘 입금',fmtW(todayInc),today(),'g')+
    kpiCard('오늘 지출',fmtW(todayExp),today(),'r')+
    kpiCard('순현금흐름',fmtW(netCash),'입금-지출',netCash>=0?'g':'r')
}

function renderMonthKPI(){
  var el=$id('month-kpi'); if(!el)return
  var mo=today().slice(0,7)
  var allLedger=[]
  S.projects.forEach(function(p){(S.ledger[p.id]||[]).forEach(function(r){allLedger.push(r)})})
  var moInc=allLedger.filter(function(r){return r.type==='income'&&r.date&&r.date.startsWith(mo)}).reduce(function(a,r){return a+(+r.amount||0)},0)
  var moExp=allLedger.filter(function(r){return r.type==='expense'&&r.date&&r.date.startsWith(mo)}).reduce(function(a,r){return a+(+r.amount||0)},0)
  var moProfit=moInc-moExp
  var moRate=moInc>0?Math.round(moProfit/moInc*100):0
  el.innerHTML=
    kpiCard('이번달 매출',fmtW(moInc),mo,'g')+
    kpiCard('이번달 원가',fmtW(moExp),mo,'r')+
    kpiCard('영업이익',fmtW(moProfit),moRate+'% 이익률',moProfit>=0?'gold':'r')+
    kpiCard('누적 계약',fmtW(S.projects.filter(function(p){return p.status==='contracted'||p.status==='in_progress'}).reduce(function(a,p){return a+(p.result?.finalAmount||p.contractAmount||0)},0)),'계약+시공 현장','b')
}

function kpiCard(label,val,sub,type){
  return '<div class="kpi '+type+'">'+
    '<div class="kpi-v">'+val+'</div>'+
    '<div class="kpi-l">'+label+'</div>'+
    '<div class="kpi-sub">'+sub+'</div>'+
  '</div>'
}

function renderAlerts(){
  var el=$id('alert-list'),sec=$id('alert-sec'); if(!el)return
  var alerts=[]
  S.projects.filter(function(p){return p.status==='in_progress'}).forEach(function(p){
    var fin=getLedger(p.id); var r=p.result||{}
    var contractAmt=r.finalAmount||p.contractAmount||0
    // Risk: low profit
    var pr=fin.totalRevenue>0?Math.round(fin.profit/fin.totalRevenue*100):0
    if(fin.totalRevenue>0&&pr<5)alerts.push({lvl:'err',msg:'['+p.name+'] 이익률 '+pr+'% — 원가 재검토 필요'})
    // Risk: high receivable
    if(contractAmt>0&&fin.pending>contractAmt*0.7)alerts.push({lvl:'warn',msg:'['+p.name+'] 미수금 '+fmt(fin.pending)+'원 (계약액의 '+(Math.round(fin.pending/contractAmt*100))+'%)'})
    // Risk: overdue
    if(p.endDate){var dd=Math.ceil((new Date(p.endDate)-new Date())/(1000*86400));if(dd<0)alerts.push({lvl:'err',msg:'['+p.name+'] 완공일 '+Math.abs(dd)+'일 초과'})}
    if(p.endDate){var ddr=Math.ceil((new Date(p.endDate)-new Date())/(1000*86400));if(ddr>=0&&ddr<=7&&(p.progressRate||0)<80)alerts.push({lvl:'warn',msg:'['+p.name+'] 완공 '+ddr+'일 남음, 진행률 '+(p.progressRate||0)+'%'})}
  })
  if(!alerts.length){
    el.innerHTML='<div class="alert-card ok"><span>✅</span>현재 리스크 항목 없음 — 모든 현장 정상</div>'
    return
  }
  el.innerHTML=alerts.map(function(a){
    return '<div class="alert-card '+(a.lvl==='err'?'err':'warn')+'">'+
      '<span>'+(a.lvl==='err'?'🚨':'⚠')+'</span><span>'+a.msg+'</span></div>'
  }).join('')
}

function renderProjects(){
  var grid=$id('proj-grid'),empty=$id('proj-empty'),cnt=$id('proj-cnt'); if(!grid)return
  var active=S.projects.filter(function(p){return p.status==='in_progress'||p.status==='contracted'})
  if(cnt)cnt.textContent=active.length+'개 진행 중'
  if(!active.length){grid.innerHTML='';if(empty)empty.style.display='block';return}
  if(empty)empty.style.display='none'
  grid.innerHTML=''
  active.forEach(function(p){
    var fin=getLedger(p.id); var r=p.result||{}
    var contractAmt=r.finalAmount||p.contractAmount||0
    var pr=fin.totalRevenue>0?Math.round(fin.profit/fin.totalRevenue*100):0
    var prog=p.progressRate||0
    var risk=pr<5?'hi':pr<10?'md':'lo'
    var riskColor=risk==='hi'?'var(--red)':risk==='md'?'var(--orange)':'var(--green)'
    var progColor=prog<50?'var(--orange)':prog<80?'var(--gold)':'var(--green)'
    var endDd=p.endDate?dday(p.endDate):'—'
    var d=document.createElement('div'); d.className='pj risk-'+risk
    d.innerHTML=
      '<div class="pj-nm">'+p.name+'</div>'+
      '<div class="pj-row"><span class="pj-k">계약금액</span><span class="pj-v" style="color:var(--gold)">'+fmt(contractAmt)+'</span></div>'+
      '<div class="pj-row"><span class="pj-k">수입합계</span><span class="pj-v" style="color:var(--green)">'+fmt(fin.totalRevenue)+'</span></div>'+
      '<div class="pj-row"><span class="pj-k">이익률</span><span class="pj-v" style="color:'+riskColor+'">'+pr+'%</span></div>'+
      '<div class="pj-row"><span class="pj-k">미수금</span><span class="pj-v" style="color:'+(fin.pending>0?'var(--orange)':'var(--dim)')+'">'+fmt(fin.pending)+'</span></div>'+
      '<div class="pj-row"><span class="pj-k">완공예정</span><span class="pj-v">'+endDd+'</span></div>'+
      '<div class="prog-bg"><div class="prog-fill" style="width:'+prog+'%;background:'+progColor+'"></div></div>'+
      '<div style="font-size:10px;color:var(--dim)">공정률 '+prog+'%</div>'
    grid.appendChild(d)
  })
}

function renderReceivables(){
  var el=$id('recv-wrap'); if(!el)return
  var rows=[]
  S.projects.forEach(function(p){
    var fin=getLedger(p.id)
    if(fin.pending>0){
      var contractAmt=(p.result?.finalAmount||p.contractAmount||0)
      var ratio=contractAmt>0?Math.round(fin.pending/contractAmt*100):0
      var endDd=p.endDate?dday(p.endDate):'—'
      rows.push({name:p.name,pending:fin.pending,ratio:ratio,endDd:endDd,status:p.status,id:p.id})
    }
  })
  if(!rows.length){el.innerHTML='<div style="color:var(--dim);font-size:12px;padding:8px">미수금 없음</div>';return}
  rows.sort(function(a,b){return b.pending-a.pending})
  var totalPending=rows.reduce(function(a,r){return a+r.pending},0)
  el.innerHTML=
    '<table class="dt"><thead><tr>'+
      '<th>현장명</th><th>상태</th><th>미수금</th><th>비율</th><th>완공예정</th><th>독촉</th>'+
    '</tr></thead><tbody>'+
    rows.map(function(r){
      var risky=r.ratio>70||r.endDd.startsWith('D+')
      return '<tr>'+
        '<td>'+r.name+'</td>'+
        '<td style="font-size:10px;color:var(--text2)">'+r.status+'</td>'+
        '<td style="font-family:var(--fm);color:'+(risky?'var(--red)':'var(--orange)')+'">'+fmtW(r.pending)+'</td>'+
        '<td style="font-family:var(--fm);font-size:11px;color:'+(r.ratio>70?'var(--red)':'var(--text2)')+'">'+r.ratio+'%</td>'+
        '<td style="font-family:var(--fm);font-size:11px">'+r.endDd+'</td>'+
        '<td>'+(risky?'<button class="btn btn-r" onclick="DSH.nudge(\''+r.name+'\')">독촉</button>':'<span style="color:var(--dim);font-size:10px">정상</span>')+'</td>'+
      '</tr>'
    }).join('')+
    '<tr style="background:var(--deep)">'+
      '<td colspan="2" style="font-weight:700">합계</td>'+
      '<td style="font-family:var(--fm);font-weight:700;color:var(--orange)">'+fmtW(totalPending)+'</td>'+
      '<td colspan="3"></td></tr>'+
    '</tbody></table>'
}

function renderTrend(){
  var canvas=$id('trend-chart'); if(!canvas)return
  var ctx=canvas.getContext('2d')
  var W=canvas.offsetWidth||600; var H=120
  canvas.width=W; canvas.height=H

  // Build monthly data
  var months=[]
  for(var i=5;i>=0;i--){
    var d=new Date(); d.setMonth(d.getMonth()-i)
    months.push(d.toISOString().slice(0,7))
  }
  var allLedger=[]
  S.projects.forEach(function(p){(S.ledger[p.id]||[]).forEach(function(r){allLedger.push(r)})})
  var data=months.map(function(mo){
    var inc=allLedger.filter(function(r){return r.type==='income'&&r.date&&r.date.startsWith(mo)}).reduce(function(a,r){return a+(+r.amount||0)},0)
    var exp=allLedger.filter(function(r){return r.type==='expense'&&r.date&&r.date.startsWith(mo)}).reduce(function(a,r){return a+(+r.amount||0)},0)
    return{mo:mo,profit:inc-exp}
  })

  var maxAbs=Math.max(1,Math.max.apply(null,data.map(function(d){return Math.abs(d.profit)})))
  var W1=(W-60)/months.length, yMid=H/2

  ctx.clearRect(0,0,W,H)
  ctx.strokeStyle='rgba(85,85,102,0.3)'; ctx.lineWidth=1
  ctx.beginPath(); ctx.moveTo(30,yMid); ctx.lineTo(W-10,yMid); ctx.stroke()
  ctx.fillStyle='rgba(85,85,102,0.3)'
  ctx.font='9px "Noto Sans KR"'; ctx.textAlign='left'; ctx.fillText('±0',2,yMid+4)

  // Bars
  data.forEach(function(d,i){
    var h=Math.round((Math.abs(d.profit)/maxAbs)*(yMid-10))
    var x=30+i*W1+4; var bw=W1-8
    var isPos=d.profit>=0
    ctx.fillStyle=isPos?'rgba(0,255,178,0.5)':'rgba(255,51,85,0.5)'
    if(isPos)ctx.fillRect(x,yMid-h,bw,h)
    else ctx.fillRect(x,yMid,bw,h)
    // Value
    ctx.fillStyle=isPos?'var(--green)':'var(--red)'
    ctx.font='9px "JetBrains Mono"'
    ctx.textAlign='center'
    if(Math.abs(d.profit)>0)ctx.fillText(fmt(d.profit),x+bw/2,isPos?yMid-h-3:yMid+h+11)
    // Month label
    ctx.fillStyle='rgba(160,144,128,0.6)'; ctx.font='9px "Noto Sans KR"'; ctx.textAlign='center'
    ctx.fillText(d.mo.slice(5)+'월',x+bw/2,H-2)
  })
}

function nudge(name){
  alert('📱 ['+name+'] 담당자에게 미수금 독촉 알림을 발송합니다.\n(이 데모에서는 실제 발송되지 않습니다)')
}

window.DSH={refresh:refresh,nudge:nudge}

async function init(){
  if(typeof AppState!=='undefined') AppState.load()
  if(window.ecoreanAPI?.onTabSwitch){
    window.ecoreanAPI.onTabSwitch(function(tab){if(tab==='dashboard')refresh()})
  }
  await refresh()
  // Auto-refresh every 5 minutes
  setInterval(function(){refresh()},5*60*1000)
  console.log('✅ dashboard.html ready — BOC v2')
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init)
else init()

})()
</script>
</body>
</html>
