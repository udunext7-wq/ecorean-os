<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DB 관리 — ECOREAN BOC</title>
<link rel="stylesheet" href="../shared/boc-design.css">
<style>

#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;flex-shrink:0;background:var(--deep);border-bottom:1px solid var(--border);min-height:44px}
#cat-bar{display:flex;flex-shrink:0;background:var(--deep);border-bottom:1px solid var(--border);overflow-x:auto}
.cb{padding:9px 14px;font-size:12px;font-weight:500;color:var(--dim);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;flex-shrink:0}
.cb:hover{color:var(--text)}
.cb.act{color:var(--gold);border-bottom-color:var(--gold)}
#main{flex:1;overflow:hidden;display:flex}

/* Tree panel */
#tree-panel{width:220px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.tree-item{padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--text2);transition:all 0.2s;display:flex;align-items:center;gap:6px}
.tree-item:hover{background:rgba(201,168,76,0.04);color:var(--text)}
.tree-item.act{background:rgba(201,168,76,0.08);color:var(--gold)}
.tree-item.l1{font-weight:600;font-size:12px}
.tree-item.l2{padding-left:20px;font-size:11px}
.tree-cnt{font-size:9px;background:var(--deep);padding:1px 5px;border-radius:8px;color:var(--dim);margin-left:auto}

/* Content panel */
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--deep)}
#toolbar input{flex:1;max-width:240px}
#rec-wrap{flex:1;overflow-y:auto;padding:10px 14px}

/* Table */
.dt{width:100%;border-collapse:collapse}
.dt th,.dt td{padding:6px 8px;border:1px solid var(--border);font-size:12px}
.dt th{background:var(--deep);color:var(--text2);font-weight:500;white-space:nowrap}
.dt tr:hover td{background:rgba(201,168,76,0.02)}
.dt td.mono{font-family:var(--fm);font-size:11px}
.dt .act-cell{white-space:nowrap;width:80px}
.status-ok{color:var(--green);font-size:10px}
.status-dis{color:var(--red);font-size:10px}


/* Modal */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:100;align-items:center;justify-content:center}
#modal-bg.open{display:flex}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;width:500px;max-height:80vh;overflow-y:auto}
.modal-t{font-size:15px;font-weight:700;color:var(--platinum);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.fg1{display:flex;flex-direction:column;gap:4px}
.full{grid-column:1/-1}
label.lbl{font-size:10px;color:var(--text2);font-weight:500}
.w100{width:100%}

/* Stats */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center}
.stat-v{font-family:var(--fm);font-size:16px;font-weight:700;color:var(--platinum)}
.stat-l{font-size:10px;color:var(--dim);margin-top:2px}

</style>
</head>
<body>
<div id="app">

<div id="topbar">
  <div style="font-family:var(--font-head);font-size:18px;font-weight:600;color:var(--gold);letter-spacing:0.04em">DB 관리</div>
  <div style="display:flex;gap:7px">
    <button class="btn btn-g btn-sm" onclick="DB.addNew()">+ 항목 추가</button>
    <button class="btn btn-p btn-sm" onclick="DB.load()">↻ 새로고침</button>
  </div>
</div>

<div id="cat-bar">
  <button class="cb act" data-cat="process" onclick="DB.selCat('process')">⚙️ 공정 DB</button>
  <button class="cb" data-cat="ontology" onclick="DB.selCat('ontology')">🔗 온톨로지</button>
  <button class="cb" data-cat="labor" onclick="DB.selCat('labor')">👷 인건비</button>
  <button class="cb" data-cat="region" onclick="DB.selCat('region')">🗺 지역계수</button>
  <button class="cb" data-cat="brand" onclick="DB.selCat('brand')">🏷 브랜드 DB</button>
  <button class="cb" data-cat="vendor" onclick="DB.selCat('vendor')">🏢 외주업체</button>
</div>

<div id="main">
  <div id="tree-panel"></div>
  <div id="content">
    <div id="toolbar">
      <input type="text" id="srch" placeholder="🔍 검색..." oninput="DB.search(this.value)">
      <div id="tb-info" style="font-size:11px;color:var(--dim)"></div>
      <button class="btn btn-p btn-sm" onclick="DB.toggleDisabled()">비활성 포함</button>
    </div>
    <div id="rec-wrap"></div>
  </div>
</div>

</div>

<!-- Modal -->
<div id="modal-bg">
<div id="modal">
  <div class="modal-t" id="modal-title">항목 추가</div>
  <div class="fg" id="modal-fields"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
    <button class="btn btn-p" onclick="DB.closeModal()">취소</button>
    <button class="btn btn-g" onclick="DB.saveModal()">💾 저장</button>
  </div>
</div>
</div>

<div id="toast"></div>

<script src="../shared/engine/boc-engine.js"></script>
<script src="../shared/store/boc-state.js"></script>
<script>
'use strict'
;(function(){

var S={cat:'process',items:[],filtered:[],selCatFilter:'',srch:'',showDisabled:false,editItem:null}

function $id(id){return document.getElementById(id)}
function $v(id){var el=$id(id);return el?el.value:''}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function now(){return new Date().toISOString()}
function jp(s,fb){try{return typeof s==='string'?JSON.parse(s):(s||fb)}catch(e){return fb}}
function toast(msg,ms){var el=$id('toast');if(!el)return;el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none'},ms||2200)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── Category configs ──────────────────────────────────
var CATS={
  process:{
    label:'공정 DB',
    load:loadProcess,
    cols:['id','name','cat','lb','mt','unit','dur','status'],
    headers:['ID','공정명','구분','노무비','자재비','단위','기간','상태'],
    form:[
      {id:'name',label:'공정명',type:'text',full:true},
      {id:'cat',label:'구분',type:'text'},
      {id:'lb',label:'노무비 (원/단위)',type:'number'},
      {id:'mt',label:'자재비 (원/단위)',type:'number'},
      {id:'unit',label:'단위',type:'text'},
      {id:'dur',label:'기간(일)',type:'number'},
    ]
  },
  ontology:{
    label:'온톨로지 규칙',
    load:loadOntology,
    cols:['ruleId','trigger','linked','triggerType','confidenceLevel','status'],
    headers:['규칙ID','트리거','연결공정','유형','신뢰도','상태'],
    form:[
      {id:'ruleId',label:'규칙 ID',type:'text'},
      {id:'trigger',label:'트리거 조건',type:'text',full:true},
      {id:'linked',label:'연결 공정 ID (쉼표 구분)',type:'text',full:true},
      {id:'triggerType',label:'유형',type:'text'},
      {id:'confidenceLevel',label:'신뢰도 (0~1)',type:'number'},
    ]
  },
  labor:{
    label:'인건비 DB',
    load:loadLabor,
    cols:['role','region','dailyWage','updatedAt','status'],
    headers:['직종','지역','일당(원)','업데이트','상태'],
    form:[
      {id:'role',label:'직종',type:'text'},
      {id:'region',label:'지역',type:'text'},
      {id:'dailyWage',label:'일당 (원)',type:'number',full:true},
    ]
  },
  region:{
    label:'지역계수',
    load:loadRegion,
    cols:['regionId','name','coefficient','basis','status'],
    headers:['ID','지역명','계수','기준','상태'],
    form:[
      {id:'regionId',label:'지역 ID',type:'text'},
      {id:'name',label:'지역명',type:'text'},
      {id:'coefficient',label:'계수 (예: 1.0)',type:'number'},
      {id:'basis',label:'기준 지역',type:'text'},
    ]
  },
  brand:{
    label:'브랜드 DB',
    load:loadBrand,
    cols:['id','brand','item','price','unit','status'],
    headers:['ID','브랜드','품목','단가(원)','단위','상태'],
    form:[
      {id:'brand',label:'브랜드명',type:'text'},
      {id:'item',label:'품목명',type:'text',full:true},
      {id:'price',label:'단가 (원)',type:'number'},
      {id:'unit',label:'단위',type:'text'},
    ]
  },
  vendor:{
    label:'외주업체',
    load:loadVendor,
    cols:['id','name','specialty','contact','rating','status'],
    headers:['ID','업체명','전문분야','연락처','등급','상태'],
    form:[
      {id:'name',label:'업체명',type:'text',full:true},
      {id:'specialty',label:'전문분야',type:'text'},
      {id:'contact',label:'연락처',type:'text'},
      {id:'rating',label:'등급 (A/B/C)',type:'text'},
      {id:'memo',label:'메모',type:'text',full:true},
    ]
  }
}

// ── Load functions ────────────────────────────────────
async function dbQ(sql,p){
  if(window.ecoreanAPI?.db?.query) return await window.ecoreanAPI.db.query(sql,p||[])
  return []
}
async function dbE(sql,p){
  if(window.ecoreanAPI?.db?.execute) return await window.ecoreanAPI.db.execute(sql,p||[])
  return {ok:false}
}

async function loadProcess(){
  // Primary: CalcEngine.DB (always available)
  var eng=(typeof CalcEngine!=='undefined'&&CalcEngine.DB)?CalcEngine.DB:{}
  var items=Object.entries(eng).map(function(kv){
    var id=kv[0],item=kv[1]
    return{id:id,name:item.name||id,cat:item.cat||'기타',lb:item.lb||0,mt:item.mt||0,
      unit:item.unit||'㎡',dur:item.dur||1,status:'active',_source:'engine'}
  })
  // Also query DB if available
  var dbRows=await dbQ('SELECT * FROM processes')
  dbRows.forEach(function(row){
    var idx=items.findIndex(function(i){return i.id===row.id})
    if(idx>=0)Object.assign(items[idx],row,{_source:'db'})
    else items.push(Object.assign({_source:'db'},row))
  })
  return items
}

async function loadOntology(){
  var rows=await dbQ('SELECT * FROM ontology_rules')
  if(rows.length) return rows
  // Fallback: show engine rules if available
  if(typeof OntologyEngine!=='undefined'&&OntologyEngine._rules){
    return Object.entries(OntologyEngine._rules).map(function(kv){
      return{ruleId:kv[0],trigger:kv[1].trigger||kv[0],linked:JSON.stringify(kv[1].linked||[]),
        triggerType:kv[1].triggerType||'갈바',confidenceLevel:kv[1].confidenceLevel||0.9,status:'active'}
    })
  }
  return []
}

async function loadLabor(){
  var rows=await dbQ('SELECT * FROM labor_roles')
  if(rows.length) return rows
  // Fallback from seed file if available
  try{
    var seed=jp(localStorage.getItem('ecorean_labor_seed'),[])
    return seed
  }catch(e){return []}
}

async function loadRegion(){
  var rows=await dbQ('SELECT * FROM region_coefficients')
  if(rows.length) return rows
  return [
    {regionId:'r19a',name:'서울',coefficient:1.0,basis:'서울기준',status:'active'},
    {regionId:'r19b',name:'제주',coefficient:1.2,basis:'서울기준',status:'active'},
    {regionId:'r19c',name:'부산',coefficient:0.95,basis:'서울기준',status:'active'},
    {regionId:'r19d',name:'경기',coefficient:1.05,basis:'서울기준',status:'active'},
  ]
}

async function loadBrand(){
  var rows=await dbQ('SELECT * FROM brands')
  return rows.length?rows:[]
}

async function loadVendor(){
  var rows=await dbQ('SELECT * FROM vendors')
  return rows.length?rows:[]
}

// ── Main load ─────────────────────────────────────────
async function load(){
  var conf=CATS[S.cat]; if(!conf)return
  S.items=await conf.load()
  S.filtered=S.items.slice()
  buildTree()
  applyFilter()
}

function buildTree(){
  var tree=$id('tree-panel'); if(!tree)return
  tree.innerHTML=''
  var groups={}
  S.items.forEach(function(item){
    var grp=item.cat||item.specialty||item.region||item.basis||'기타'
    if(!groups[grp])groups[grp]=[]
    groups[grp].push(item)
  })
  var keys=Object.keys(groups).sort()
  // "전체" entry
  var all=document.createElement('div')
  all.className='tree-item l1'+(S.selCatFilter===''?' act':'')
  all.innerHTML='<span>전체</span><span class="tree-cnt">'+S.items.length+'</span>'
  all.onclick=function(){S.selCatFilter='';applyFilter();updateTreeAct('')}
  tree.appendChild(all)
  keys.forEach(function(grp){
    var d=document.createElement('div')
    d.className='tree-item l2'+(S.selCatFilter===grp?' act':'')
    d.dataset.grp=grp
    d.innerHTML='<span>'+grp+'</span><span class="tree-cnt">'+groups[grp].length+'</span>'
    d.onclick=function(){S.selCatFilter=grp;applyFilter();updateTreeAct(grp)}
    tree.appendChild(d)
  })
}

function updateTreeAct(grp){
  document.querySelectorAll('.tree-item').forEach(function(d){
    var isAct=(grp===''&&!d.dataset.grp)||(d.dataset.grp===grp)
    d.classList.toggle('act',isAct)
  })
}

function applyFilter(){
  var q=(S.srch||'').toLowerCase()
  S.filtered=S.items.filter(function(item){
    if(!S.showDisabled&&item.status==='disabled')return false
    if(S.selCatFilter){
      var grp=item.cat||item.specialty||item.region||item.basis||'기타'
      if(grp!==S.selCatFilter)return false
    }
    if(q){
      var haystack=Object.values(item).join(' ').toLowerCase()
      return haystack.includes(q)
    }
    return true
  })
  renderTable()
}

// ── Render table ──────────────────────────────────────
function renderTable(){
  var wrap=$id('rec-wrap'),inf=$id('tb-info'); if(!wrap)return
  if(inf)inf.textContent=S.filtered.length+' / '+S.items.length+' 건'
  var conf=CATS[S.cat]; if(!conf)return
  if(!S.filtered.length){
    wrap.innerHTML='<div style="padding:30px;text-align:center;color:var(--dim);font-size:12px">검색 결과 없음</div>'
    return
  }
  var cols=conf.cols; var headers=conf.headers
  var rows=S.filtered.map(function(item,i){
    var tds=cols.map(function(col){
      var v=item[col]
      if(col==='status')return '<td><span class="'+(v==='disabled'?'status-dis':'status-ok')+'">'+(v==='disabled'?'비활성':'활성')+'</span></td>'
      if(typeof v==='number')return '<td class="mono" style="text-align:right">'+v.toLocaleString()+'</td>'
      if(typeof v==='string'&&v.length>30)return '<td style="font-size:11px;color:var(--text2)">'+esc(v.slice(0,30))+'…</td>'
      return '<td class="'+(col==='id'?'mono':'')+'">'+esc(v!==undefined&&v!==null?v:'—')+'</td>'
    }).join('')
    return '<tr>'+tds+
      '<td class="act-cell">'+
        '<button class="btn btn-b btn-sm" onclick="DB.edit('+i+')">수정</button>'+
        (item.status!=='disabled'?
          ' <button class="btn btn-r btn-sm" onclick="DB.disable('+i+')">비활</button>':
          ' <button class="btn btn-p btn-sm" onclick="DB.enable('+i+')">복구</button>')+
      '</td></tr>'
  }).join('')
  wrap.innerHTML=
    '<table class="dt"><thead><tr>'+
      headers.map(function(h){return '<th>'+h+'</th>'}).join('')+
      '<th style="width:80px">관리</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table>'
}

// ── CRUD ──────────────────────────────────────────────
function addNew(){
  S.editItem=null
  openModal(null)
}

function edit(idx){
  S.editItem=S.filtered[idx]
  openModal(S.editItem)
}

function openModal(item){
  var conf=CATS[S.cat]; if(!conf)return
  var title=$id('modal-title'),fields=$id('modal-fields')
  if(title)title.textContent=item?'항목 수정 — '+S.cat:'+ 항목 추가 — '+S.cat
  if(!fields)return
  fields.innerHTML=conf.form.map(function(f){
    var val=item&&item[f.id]!==undefined?item[f.id]:''
    return '<div class="fg1'+(f.full?' full':'')+'">'+
      '<label class="lbl">'+f.label+'</label>'+
      '<input type="'+f.type+'" id="mf-'+f.id+'" class="w100" value="'+esc(val)+'" placeholder="'+f.label+'">'+
    '</div>'
  }).join('')
  $id('modal-bg').classList.add('open')
}

function closeModal(){$id('modal-bg').classList.remove('open')}

async function saveModal(){
  var conf=CATS[S.cat]; if(!conf)return
  var data={}
  conf.form.forEach(function(f){
    var v=$v('mf-'+f.id)
    data[f.id]=f.type==='number'?parseFloat(v)||0:v
  })
  var isNew=!S.editItem
  var n=now()
  if(isNew){
    data.id='db_'+uid(); data.status='active'; data.createdAt=n; data.updatedAt=n
    S.items.unshift(data)
  } else {
    Object.assign(S.editItem,data); S.editItem.updatedAt=n
  }
  // Attempt DB save
  await saveToDB(data,isNew)
  applyFilter(); closeModal()
  toast(isNew?'✅ 항목 추가됨':'✅ 수정됨')
}

async function saveToDB(item,isNew){
  if(!window.ecoreanAPI?.db?.execute)return
  var cat=S.cat
  if(cat==='process'){
    if(isNew){
      await dbE('INSERT OR REPLACE INTO processes(id,name,cat,laborCost,materialCost,unit,duration,status,createdAt,updatedAt) VALUES(?,?,?,?,?,?,?,?,?,?)',
        [item.id,item.name,item.cat,item.lb||0,item.mt||0,item.unit||'㎡',item.dur||1,'active',item.createdAt,item.updatedAt])
    } else {
      await dbE('UPDATE processes SET name=?,cat=?,laborCost=?,materialCost=?,unit=?,duration=?,updatedAt=? WHERE id=?',
        [item.name,item.cat,item.lb||0,item.mt||0,item.unit||'㎡',item.dur||1,now(),item.id||S.editItem?.id])
    }
  } else if(cat==='vendor'){
    await dbE('INSERT OR REPLACE INTO vendors(id,name,specialty,contact,rating,memo,status,updatedAt) VALUES(?,?,?,?,?,?,?,?)',
      [item.id,item.name,item.specialty||'',item.contact||'',item.rating||'',item.memo||'',(item.status||'active'),now()])
  }
  // Other tables: generic log
}

async function disable(idx){
  var item=S.filtered[idx]; if(!item)return
  if(!confirm('"'+( item.name||item.id)+'" 을 비활성화합니까?\n(실제 삭제되지 않고 숨겨집니다)'))return
  item.status='disabled'; item.updatedAt=now()
  await dbE('UPDATE '+tableFor(S.cat)+' SET status=\'disabled\',updatedAt=? WHERE id=?',[now(),item.id])
  applyFilter(); toast('비활성화됨 (status=disabled)')
}

async function enable(idx){
  var item=S.filtered[idx]; if(!item)return
  item.status='active'; item.updatedAt=now()
  await dbE('UPDATE '+tableFor(S.cat)+' SET status=\'active\',updatedAt=? WHERE id=?',[now(),item.id])
  applyFilter(); toast('복구됨')
}

function tableFor(cat){
  var map={process:'processes',ontology:'ontology_rules',labor:'labor_roles',
    region:'region_coefficients',brand:'brands',vendor:'vendors'}
  return map[cat]||cat
}

// ── Cat switch ────────────────────────────────────────
async function selCat(cat){
  S.cat=cat; S.selCatFilter=''; S.srch=''
  var si=$id('srch');if(si)si.value=''
  document.querySelectorAll('.cb').forEach(function(b){b.classList.toggle('act',b.dataset.cat===cat)})
  await load()
}

function search(q){S.srch=q;applyFilter()}

function toggleDisabled(){
  S.showDisabled=!S.showDisabled
  var btn=document.querySelector('[onclick="DB.toggleDisabled()"]')
  if(btn)btn.style.color=S.showDisabled?'var(--gold)':'var(--text2)'
  applyFilter()
}

window.DB={
  load:load,selCat:selCat,search:search,toggleDisabled:toggleDisabled,
  addNew:addNew,edit:edit,disable:disable,enable:enable,
  closeModal:closeModal,saveModal:saveModal,
}

async function init(){
  if(typeof AppState!=='undefined') AppState.load()
  if(window.ecoreanAPI?.onTabSwitch){
    window.ecoreanAPI.onTabSwitch(function(tab){if(tab==='dbmgr')load()})
  }
  await load()
  console.log('✅ dbmgr.html ready — BOC v2')
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init)
else init()

})()
</script>
</body>
</html>
