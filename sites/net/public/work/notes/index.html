<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style id="ecorean-gate-style">html{visibility:hidden}</style>
<script src="/ecorean-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoNote — ECOREAN 직원 공용 노트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ── ECOREAN 직원 포털과 같은 팔레트 ── */
:root{
  --bg:#05070d;--bg2:#0c111c;--bg3:#111827;--bg4:#172033;--line:#1c2536;--line2:#273247;
  --text:#e8ecf4;--dim:#8b95a8;--dim2:#5b6577;--accent:#4ade80;--accent-dim:rgba(74,222,128,.12);
  --red:#f87171;--blue:#60a5fa;--amber:#fbbf24;--gold:#d4b46a;
  --sb:300px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
::selection{background:rgba(96,165,250,.35)}

.shell{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ── 사이드바 ── */
aside{width:var(--sb);flex:0 0 var(--sb);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sb-head{padding:14px 14px 8px;display:flex;align-items:center;gap:8px}
.sb-head .logo{font-weight:800;letter-spacing:.5px;font-size:15px}
.sb-head .logo span{color:var(--accent)}
.sb-head .logo small{display:block;font-weight:500;color:var(--dim2);font-size:11px;letter-spacing:0}
.sb-head .sp{flex:1}
.ibtn{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px}
.ibtn:hover{background:var(--bg3);color:var(--text)}
.sb-search{padding:0 14px 8px}
.sb-search input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:0;font-size:13px}
.sb-search input:focus{border-color:var(--line2)}
.sb-sec{padding:8px 14px 2px;font-size:11px;color:var(--dim2);letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center}
.sb-sec .sp{flex:1}
.tree{flex:1;overflow:auto;padding:2px 8px 12px;min-height:0}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-left:14px}
.node{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;color:var(--dim);font-size:13.5px;cursor:pointer;user-select:none;min-width:0}
.node:hover{background:var(--bg3);color:var(--text)}
.node.on{background:var(--accent-dim);color:var(--text)}
.node .tg{width:16px;height:16px;flex:0 0 16px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--dim2);font-size:10px}
.node .tg:hover{background:var(--bg4);color:var(--text)}
.node .tg.empty{visibility:hidden}
.node .ic{width:18px;flex:0 0 18px;text-align:center;font-size:14px}
.node .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .tt.untitled{color:var(--dim2);font-style:italic}
.node .add{opacity:0;width:18px;flex:0 0 18px;text-align:center;color:var(--dim2);border-radius:4px}
.node:hover .add{opacity:1}
.node .add:hover{background:var(--bg4);color:var(--accent)}
.tree .empty{color:var(--dim2);font-size:13px;padding:12px 8px}
li.closed>ul{display:none}
.sb-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
.sb-foot b{color:var(--text)}
.sb-foot .sp{flex:1}
.sb-foot a{color:var(--dim);text-decoration:none}
.sb-foot a:hover{color:var(--text)}
.result{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--dim)}
.result:hover{background:var(--bg3);color:var(--text)}
.result b{display:block;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 본문 ── */
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--dim);min-height:46px}
.top .crumb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb a{color:var(--dim);text-decoration:none}
.top .crumb a:hover{color:var(--text)}
.top .crumb i{margin:0 5px;font-style:normal;color:var(--dim2)}
.top .st{font-size:12px;color:var(--dim2);white-space:nowrap}
.top .st.dirty{color:var(--amber)}
.top .st.err{color:var(--red)}
.top .st.ok{color:var(--accent)}
.tbtn{padding:5px 9px;border-radius:6px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.tbtn:hover{background:var(--bg3);color:var(--text)}
.tbtn.danger:hover{color:var(--red)}
#menuBtn{display:none}

.paper{flex:1;overflow:auto;min-height:0}
.page{max-width:860px;margin:0 auto;padding:36px 48px 160px}
.pg-icon{font-size:44px;line-height:1;display:inline-block;cursor:pointer;border-radius:8px;padding:4px;margin-left:-4px}
.pg-icon:hover{background:var(--bg3)}
.pg-icon.none{font-size:13px;color:var(--dim2);padding:6px 8px;border:1px dashed var(--line2)}
.pg-title{display:block;width:100%;background:none;border:0;outline:0;font-size:34px;font-weight:800;line-height:1.25;padding:8px 0 4px;color:var(--text);letter-spacing:-.3px}
.pg-title::placeholder{color:var(--dim2)}
.pg-meta{font-size:12.5px;color:var(--dim2);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
.pg-meta b{color:var(--dim);font-weight:500}

/* 툴바 */
.bar{position:sticky;top:0;z-index:5;background:rgba(5,7,13,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:5px 6px;display:flex;flex-wrap:wrap;gap:2px;margin:0 0 18px}
.bar button,.bar select{height:30px;min-width:30px;padding:0 7px;border-radius:6px;color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.bar select{background:var(--bg);border:0;outline:0;padding-right:4px}
.bar button:hover{background:var(--bg3);color:var(--text)}
.bar button.on{background:var(--accent-dim);color:var(--accent)}
.bar .sep{width:1px;background:var(--line);margin:4px 4px}
.bar .tbl{display:none;gap:2px}
.bar.in-table .tbl{display:inline-flex}
.bar b{font-weight:700}
.bar i{font-style:italic}
.bar u{text-decoration:underline}
.bar s{text-decoration:line-through}

/* 편집기 */
.ProseMirror{outline:0;min-height:50vh;font-size:16px;line-height:1.75;color:var(--text)}
.ProseMirror>*+*{margin-top:.55em}
.ProseMirror h1{font-size:1.9em;margin-top:1.3em;line-height:1.25}
.ProseMirror h2{font-size:1.5em;margin-top:1.2em;line-height:1.3}
.ProseMirror h3{font-size:1.2em;margin-top:1em}
.ProseMirror p{margin:0}
.ProseMirror p.is-editor-empty:first-child::before{content:attr(data-placeholder);color:var(--dim2);float:left;height:0;pointer-events:none}
.ProseMirror ul,.ProseMirror ol{padding-left:1.5em}
.ProseMirror li p{margin:0}
.ProseMirror ul[data-type="taskList"]{list-style:none;padding-left:.2em}
.ProseMirror ul[data-type="taskList"] li{display:flex;gap:8px;align-items:flex-start}
.ProseMirror ul[data-type="taskList"] li>label{flex:0 0 auto;margin-top:.35em;user-select:none}
.ProseMirror ul[data-type="taskList"] li>div{flex:1}
.ProseMirror ul[data-type="taskList"] li[data-checked="true"]>div{color:var(--dim2);text-decoration:line-through}
.ProseMirror input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.ProseMirror blockquote{border-left:3px solid var(--gold);margin:0;padding:2px 0 2px 14px;color:var(--dim)}
.ProseMirror code{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.9em;font-family:Consolas,"D2Coding",monospace}
.ProseMirror pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font-family:Consolas,"D2Coding",monospace;font-size:.9em}
.ProseMirror pre code{background:none;border:0;padding:0}
.ProseMirror hr{border:0;border-top:1px solid var(--line2);margin:1.4em 0}
.ProseMirror a{color:var(--blue);text-decoration:underline;cursor:pointer}
.ProseMirror img{max-width:100%;height:auto;border-radius:8px;display:block}
.ProseMirror img.ProseMirror-selectednode{outline:3px solid var(--blue)}
.ProseMirror img[src=""],.ProseMirror img:not([src]){min-height:80px;background:var(--bg3);border:1px dashed var(--line2)}
.ProseMirror div[data-youtube-video]{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;margin:.6em 0}
.ProseMirror div[data-youtube-video] iframe{width:100%;height:100%;border:0;border-radius:10px;background:#000}
.ProseMirror div[data-youtube-video].ProseMirror-selectednode iframe{outline:3px solid var(--blue)}
.ProseMirror table{border-collapse:collapse;width:100%;margin:.6em 0;table-layout:fixed;overflow:hidden}
.ProseMirror td,.ProseMirror th{border:1px solid var(--line2);padding:6px 9px;vertical-align:top;min-width:60px;position:relative}
.ProseMirror th{background:var(--bg3);font-weight:600;text-align:left}
.ProseMirror .selectedCell:after{content:"";position:absolute;inset:0;background:rgba(96,165,250,.18);pointer-events:none}
.ProseMirror .column-resize-handle{position:absolute;right:-2px;top:0;bottom:0;width:4px;background:var(--blue);pointer-events:none}
.ProseMirror .tableWrapper{overflow-x:auto}
.ProseMirror .ProseMirror-gapcursor:after{border-top:1px solid var(--text)}
.ProseMirror .up-ph{display:inline-block;padding:10px 14px;border:1px dashed var(--line2);border-radius:8px;color:var(--dim);font-size:13px}
.ProseMirror.drag{outline:2px dashed var(--accent);outline-offset:8px;border-radius:8px}

/* 슬래시 메뉴 */
.slash{position:fixed;z-index:50;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);width:280px;max-height:320px;overflow:auto;padding:6px;display:none}
.slash.show{display:block}
.slash .it{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.slash .it .k{width:30px;height:30px;border-radius:6px;background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 30px}
.slash .it small{display:block;color:var(--dim2);font-size:11.5px}
.slash .it.sel,.slash .it:hover{background:var(--bg3)}
.slash .none{padding:8px;color:var(--dim2);font-size:13px}

/* 모달·토스트 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
.modal .mh .sp{flex:1}
.modal .mb{padding:14px 18px;overflow:auto;min-height:0}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.btn{padding:7px 13px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);font-size:13px;color:var(--text)}
.btn:hover{background:var(--bg4)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04120a;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.modal input[type=text],.modal input[type=url],.modal select{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;outline:0}
.modal label{display:block;font-size:12.5px;color:var(--dim);margin:10px 0 4px}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
.vlist li:hover{background:var(--bg3)}
.vlist .sp{flex:1}
.vlist small{color:var(--dim2)}
.preview{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);max-height:50vh;overflow:auto}
.preview .ProseMirror{min-height:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--line2);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
.banner{display:none;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;align-items:center;gap:10px;flex-wrap:wrap}
.banner.show{display:flex}
.banner .sp{flex:1}
.welcome{color:var(--dim);max-width:560px;margin:80px auto;text-align:center;padding:0 20px}
.welcome h2{color:var(--text);margin:0 0 6px}
.welcome p{margin:6px 0}
.welcome kbd{background:var(--bg3);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-size:12px}

@media (max-width:860px){
  aside{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;width:min(320px,86vw);flex-basis:auto;box-shadow:0 0 40px rgba(0,0,0,.6)}
  aside.open{transform:none}
  #menuBtn{display:inline-flex}
  .page{padding:20px 18px 140px}
  .pg-title{font-size:26px}
  .top .hide-m{display:none}
}
@media print{aside,.top,.bar,.slash,.toast{display:none!important}.paper{overflow:visible}body{background:#fff;color:#000}.ProseMirror{color:#000}}
</style>
</head>
<body>
<div class="shell">
  <aside id="side">
    <div class="sb-head">
      <div class="logo">ECO<span>NOTE</span><small>직원 공용 노트</small></div>
      <div class="sp"></div>
      <button class="ibtn" id="newRootBtn" title="새 페이지">＋</button>
      <button class="ibtn" id="closeSideBtn" title="닫기" style="display:none">✕</button>
    </div>
    <div class="sb-search"><input id="q" type="search" placeholder="제목·본문 검색" autocomplete="off"></div>
    <div class="sb-sec"><span id="treeLabel">페이지</span><div class="sp"></div><button class="tbtn" id="trashBtn" style="padding:2px 6px;font-size:11px">🗑 휴지통</button></div>
    <div class="tree" id="tree"><div class="empty">불러오는 중…</div></div>
    <div class="sb-foot"><b id="meName">—</b><span id="meRole"></span><div class="sp"></div><a href="/work/">직원 포털 →</a></div>
  </aside>
  <main>
    <div class="top">
      <button class="ibtn" id="menuBtn" title="페이지 목록">☰</button>
      <div class="crumb" id="crumb"></div>
      <span class="st" id="saveSt"></span>
      <button class="tbtn hide-m" id="subBtn" title="이 페이지 아래에 새 페이지">＋ 하위</button>
      <button class="tbtn" id="histBtn" title="수정 이력">🕘</button>
      <button class="tbtn hide-m" id="moveBtn" title="다른 페이지 아래로 이동">↪</button>
      <button class="tbtn hide-m" id="linkBtn" title="이 페이지 링크 복사">🔗</button>
      <button class="tbtn danger" id="delBtn" title="휴지통으로">🗑</button>
    </div>
    <div class="paper" id="paper">
      <div class="welcome" id="welcome">
        <h2>EcoNote</h2>
        <p>직원 모두가 함께 쓰는 노트입니다. 왼쪽에서 페이지를 고르거나 <b>＋</b>로 새로 만드세요.</p>
        <p>본문에서 <kbd>/</kbd> 를 치면 제목·표·체크리스트·이미지·YouTube 를 넣을 수 있습니다.</p>
        <p>이미지는 서버에 저장되고, 영상은 YouTube 주소를 붙여 넣으면 바로 재생됩니다.</p>
      </div>
      <div class="page" id="pageEl" style="display:none">
        <div class="banner" id="conflict"><span>⚠️ 다른 직원이 이 페이지를 먼저 고쳤습니다.</span><div class="sp"></div><button class="btn" id="cfLoad">서버 내용 불러오기</button><button class="btn danger" id="cfForce">내 내용으로 덮어쓰기</button></div>
        <span class="pg-icon none" id="pgIcon" title="아이콘 바꾸기">아이콘 추가</span>
        <input class="pg-title" id="pgTitle" placeholder="제목 없음" autocomplete="off" spellcheck="false">
        <div class="pg-meta" id="pgMeta"></div>
        <div class="bar" id="bar">
          <select id="blockSel" title="블록 종류">
            <option value="p">본문</option><option value="h1">제목 1</option><option value="h2">제목 2</option><option value="h3">제목 3</option>
          </select>
          <span class="sep"></span>
          <button data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
          <button data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
          <button data-cmd="strike" title="취소선"><s>S</s></button>
          <button data-cmd="code" title="코드">&lt;/&gt;</button>
          <button data-cmd="link" title="링크">🔗</button>
          <span class="sep"></span>
          <button data-cmd="bulletList" title="목록">•≡</button>
          <button data-cmd="orderedList" title="번호 목록">1≡</button>
          <button data-cmd="taskList" title="체크리스트">☑</button>
          <button data-cmd="blockquote" title="인용">❝</button>
          <button data-cmd="codeBlock" title="코드 블록">{ }</button>
          <button data-cmd="hr" title="구분선">—</button>
          <span class="sep"></span>
          <button data-cmd="table" title="표">▦</button>
          <button data-cmd="image" title="이미지 (서버 저장)">🖼</button>
          <button data-cmd="youtube" title="YouTube 영상">▶</button>
          <span class="sep"></span>
          <button data-cmd="undo" title="되돌리기">↶</button>
          <button data-cmd="redo" title="다시 실행">↷</button>
          <span class="tbl"><span class="sep"></span>
            <button data-cmd="addRow" title="아래 행 추가">행＋</button><button data-cmd="addCol" title="오른쪽 열 추가">열＋</button>
            <button data-cmd="delRow" title="행 삭제">행－</button><button data-cmd="delCol" title="열 삭제">열－</button>
            <button data-cmd="toggleHeader" title="머리글 행">머리글</button><button data-cmd="delTable" title="표 삭제">표✕</button>
          </span>
        </div>
        <div id="editor"></div>
      </div>
    </div>
  </main>
</div>
<div class="slash" id="slash"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple style="display:none">

<script src="/work/notes/econote-editor.js?v=1"></script>

'use strict';

var REF = 'gdcfqbdgubgpzusbtftf';
var ANON = 'sb_publishable_LU8lIQH-L5K8B1qwtezCUg_PkcCrAOQ';
var API = 'https://' + REF + '.supabase.co/rest/v1/';
var STORAGE = 'https://' + REF + '.supabase.co/storage/v1/';

var A = window.ECOREAN_AUTH || {};
function fresh(force) {

$('#slash').addEventListener('mousedown', function (e) { e.preventDefault(); var it = e.target.closest('[data-i]'); if (it) slashRun(+it.getAttribute('data-i')); });
function slashKey(ev) {
  if (!editor) return false;
  if (slash.open) {
    if (ev.key === 'ArrowDown') { slash.sel = (slash.sel + 1) % Math.max(1, slash.items.length); slashRender(slashQuery()); return true; }
    if (ev.key === 'ArrowUp') { slash.sel = (slash.sel - 1 + Math.max(1, slash.items.length)) % Math.max(1, slash.items.length); slashRender(slashQuery()); return true; }
    if (ev.key === 'Enter' || ev.key === 'Tab') { if (slash.items.length) { slashRun(slash.sel); return true; } slashClose(); return false; }
    if (ev.key === 'Escape') { slashClose(); return true; }
    if (ev.key === ' ' && !slashQuery()) { slashClose(); return false; }
    return false;
  }
  if (ev.key === '/' && !ev.isComposing) {
    var $f = editor.state.selection.$from;
    if (editor.state.selection.empty && $f.parent.type.name === 'paragraph' && $f.parentOffset === 0 && !editor.isActive('codeBlock')) {
      slash.open = true; slash.from = $f.pos; slash.sel = 0; setTimeout(function () { if (slash.open) slashRender(''); }, 0);
    }
  }
  return false;
}
function slashQuery() { try { return editor.state.doc.textBetween(slash.from + 1, editor.state.selection.from, ''); } catch (e) { return ''; } }
function slashWatch() {
  if (!slash.open) return; var $f = editor.state.selection.$from;
  if ($f.pos < slash.from + 1 || $f.parent.type.name !== 'paragraph') return slashClose();
  var txt = editor.state.doc.textBetween(slash.from, editor.state.selection.from, '');
  if (txt.charAt(0) !== '/') return slashClose();
  slashRender(txt.slice(1));
}

/* ═══════════ 페이지 열기 / 저장 ═══════════ */
function setSt(t, cls) { var s = $('#saveSt'); s.textContent = t; s.className = 'st ' + (cls || ''); }
function markDirty() { if (!cur) return; dirty = true; setSt('저장 안 됨', 'dirty'); clearTimeout(saveTimer); saveTimer = setTimeout(function () { save(); }, 1400); }
function pageMeta() {
  var p = cur; $('#pgMeta').innerHTML = '<span>만든 사람 <b>' + esc(p.created_by_name || '—') + '</b> ' + esc(fmtDt(p.created_at)) + '</span><span>마지막 수정 <b>' + esc(p.updated_by_name || '—') + '</b> ' + esc(fmtDt(p.updated_at)) + '</span>' + (editor ? '<span>' + editor.storage.characterCount.characters().toLocaleString() + '자</span>' : '');
  var ic = $('#pgIcon'); if (p.icon) { ic.textContent = p.icon; ic.className = 'pg-icon'; } else { ic.textContent = '아이콘 추가'; ic.className = 'pg-icon none'; }
  $('#crumb').innerHTML = ancestors(p.id).map(function (a) { return '<a href="?p=' + a.id + '" data-id="' + a.id + '">' + esc(a.icon || '') + ' ' + esc(titleOf(a) || '제목 없음') + '</a><i>›</i>'; }).join('') + '<span>' + esc(p.icon || '') + ' ' + esc(titleOf(p) || '제목 없음') + '</span>' + (p.deleted_at ? ' <span style="color:var(--red)">· 휴지통</span>' : '');
}
$('#crumb').addEventListener('click', function (e) { var a = e.target.closest('a[data-id]'); if (a) { e.preventDefault(); openPage(a.getAttribute('data-id')); } });
function openPage(id, opts) {
  opts = opts || {};
  if (cur && cur.id === id && !opts.force) { $('#side').classList.remove('open'); return; }
  var go = dirty ? save() : Promise.resolve();
  return go.then(function () { return rest('econote_pages?select=*&id=eq.' + id); }).then(function (rows) {
    var p = rows && rows[0]; if (!p) { toast('페이지를 찾을 수 없습니다', true); return; }
    return resolveImages(p.content || { type: 'doc', content: [{ type: 'paragraph' }] }).then(function (doc) {
      if (editor) { editor.destroy(); editor = null; }
      cur = p; dirty = false; clearTimeout(saveTimer); slashClose(); $('#conflict').classList.remove('show');
      $('#welcome').style.display = 'none'; $('#pageEl').style.display = '';
      $('#pgTitle').value = p.title || '';
      var ro = !!p.deleted_at;
      editor = mkEditor($('#editor'), doc, !ro);

      editor.on('selectionUpdate', function () { syncBar(); slashWatch(); });
      editor.on('transaction', syncBar);
      $('#bar').style.display = ro ? 'none' : ''; $('#pgTitle').readOnly = ro;
      pageMeta(); syncBar(); renderTree();
      var idx = pages.findIndex(function (x) { return x.id === p.id; }); if (idx >= 0) { pages[idx].rev = p.rev; pages[idx].updated_at = p.updated_at; }
      ancestors(p.id).forEach(function (a) { openSet[a.id] = true; }); try { localStorage.setItem('econote_open', JSON.stringify(openSet)); } catch (x) {}
      history.replaceState(null, '', '?p=' + p.id); $('#side').classList.remove('open');
      if (opts.focusTitle) $('#pgTitle').focus(); else if (!ro && opts.focus !== false) editor.commands.focus('end');
      $('#paper').scrollTop = 0;
    });
  }).catch(function (e) { toast('열기 실패: ' + e.message, true); });
}
function collect() {
  var doc = stripImages(editor.getJSON());
  return { title: $('#pgTitle').value.trim(), content: doc, content_text: editor.getText({ blockSeparator: '\n' }).slice(0, 20000), updated_by: me.id, updated_by_name: me.name };
}
function save(force) {
  if (!cur || !editor || saving) return Promise.resolve();
  if (!dirty && !force) return Promise.resolve();
  saving = true; clearTimeout(saveTimer); setSt('저장 중…', 'dirty');
  var body = collect(), myRev = cur.rev;
  var q = 'econote_pages?id=eq.' + cur.id + (force ? '' : '&rev=eq.' + myRev);
  return rest(q, { method: 'PATCH', body: JSON.stringify(body), headers: { Prefer: 'return=representation' } }).then(function (rows) {
    saving = false;
    if (!rows || !rows.length) { /* rev 불일치 = 다른 사람이 먼저 저장 */ setSt('충돌', 'err'); $('#conflict').classList.add('show'); return; }
    var r = rows[0]; cur.rev = r.rev; cur.updated_at = r.updated_at; cur.updated_by_name = r.updated_by_name; cur.title = r.title; cur.content_text = r.content_text;
    dirty = false; lastSavedAt = Date.now(); setSt('저장됨 ' + fmtDt(r.updated_at), 'ok');
    var idx = pages.findIndex(function (x) { return x.id === cur.id; }); if (idx >= 0) { pages[idx].title = r.title; pages[idx].rev = r.rev; pages[idx].updated_at = r.updated_at; pages[idx].icon = r.icon; }
    renderTree(); pageMeta(); $('#conflict').classList.remove('show');
  }).catch(function (e) { saving = false; setSt('저장 실패', 'err'); toast('저장 실패: ' + e.message, true); saveTimer = setTimeout(function () { save(); }, 8000); });
}
$('#cfLoad').addEventListener('click', function () { dirty = false; openPage(cur.id, { force: true }); });
$('#cfForce').addEventListener('click', function () { dirty = true; save(true); });
$('#pgTitle').addEventListener('input', markDirty);
$('#pgTitle').addEventListener('keydown', function (e) { if (e.key === 'Enter' || (e.key === 'ArrowDown')) { e.preventDefault(); if (editor) editor.commands.focus('start'); } });
$('#pgIcon').addEventListener('click', function () {
  if (!cur || cur.deleted_at) return;
  promptBox('페이지 아이콘', '이모지 하나 (비우면 제거)', cur.icon || '', '📌').then(function (v) {
    if (v === null) return; v = v.trim().slice(0, 4) || null;

  });
});
document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (cur) { dirty = true; save(); } } });

document.addEventListener('visibilitychange', function () { if (document.hidden && dirty) save(); });

/* ═══════════ 만들기 · 이동 · 삭제 · 이력 ═══════════ */
function createPage(parentId) {
  var sib = children(parentId || null, false); var so = sib.length ? Math.max.apply(null, sib.map(function (s) { return s.sort_order || 0; })) + 1 : 0;
  var row = { parent_id: parentId || null, title: '', sort_order: so, created_by: me.id, created_by_name: me.name, updated_by: me.id, updated_by_name: me.name, content: { type: 'doc', content: [{ type: 'paragraph' }] } };
  return rest('econote_pages', { method: 'POST', body: JSON.stringify(row), headers: { Prefer: 'return=representation' } }).then(function (rows) {
    var p = rows[0]; pages.push(p); if (parentId) openSet[parentId] = true; viewTrash = false; searchQ = ''; $('#q').value = ''; renderTree();

  }).catch(function (e) { toast('만들기 실패: ' + e.message, true); });
}
$('#newRootBtn').addEventListener('click', function () { createPage(null); });
$('#subBtn').addEventListener('click', function () { if (cur && !cur.deleted_at) createPage(cur.id); });
$('#linkBtn').addEventListener('click', function () { if (!cur) return; var u = location.origin + '/work/notes/?p=' + cur.id; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast('링크 복사됨'); }, function () { promptBox('페이지 링크', '주소', u); }); });
$('#moveBtn').addEventListener('click', function () {
  if (!cur || cur.deleted_at) return; var ban = {}; ban[cur.id] = 1; descendants(cur.id).forEach(function (d) { ban[d] = 1; });
  var opts = '<option value="">(최상위)</option>' + pages.filter(function (p) { return !p.deleted_at && !ban[p.id]; }).map(function (p) { return '<option value="' + p.id + '"' + (p.id === cur.parent_id ? ' selected' : '') + '>' + esc(ancestors(p.id).map(function (a) { return titleOf(a) || '제목 없음'; }).concat([titleOf(p) || '제목 없음']).join(' › ')) + '</option>'; }).join('');
  modal('<div class="mh">페이지 이동</div><div class="mb"><label>어느 페이지 아래로 옮길까요?</label><select id="mvSel">' + opts + '</select></div><div class="mf"><button class="btn" id="mCancel">취소</button><button class="btn pri" id="mOk">이동</button></div>', function (b) {
    b.querySelector('#mCancel').onclick = closeModal;
    b.querySelector('#mOk').onclick = function () {
      var v = b.querySelector('#mvSel').value || null; closeModal();
      rest('econote_pages?id=eq.' + cur.id, { method: 'PATCH', body: JSON.stringify({ parent_id: v }), headers: { Prefer: 'return=representation' } }).then(function (rows) { if (rows && rows[0]) { cur.parent_id = v; cur.rev = rows[0].rev; var p = byId(cur.id); if (p) p.parent_id = v; if (v) openSet[v] = true; renderTree(); pageMeta(); toast('이동했습니다'); } }).catch(function (e) { toast('이동 실패: ' + e.message, true); });
    };
  });
});
$('#delBtn').addEventListener('click', function () {
  if (!cur) return;
  if (cur.deleted_at) { /* 휴지통 안: 복원 / 완전 삭제 */
    modal('<div class="mh">휴지통 페이지</div><div class="mb">「' + esc(titleOf(cur) || '제목 없음') + '」<br><small style="color:var(--dim)">복원하면 다른 직원 화면에도 다시 나타납니다. 완전 삭제는 이미지 파일까지 지우며 되돌릴 수 없습니다.</small></div><div class="mf"><button class="btn" id="mCancel">닫기</button><button class="btn danger" id="mPurge">완전 삭제</button><button class="btn pri" id="mRestore">복원</button></div>', function (b) {
      b.querySelector('#mCancel').onclick = closeModal;
      b.querySelector('#mRestore').onclick = function () { closeModal(); rest('econote_pages?id=eq.' + cur.id, { method: 'PATCH', body: JSON.stringify({ deleted_at: null }), headers: { Prefer: 'return=minimal' } }).then(function () { toast('복원했습니다'); return loadTree(); }).then(function () { viewTrash = false; renderTree(); openPage(cur.id, { force: true }); }).catch(function (e) { toast('복원 실패: ' + e.message, true); }); };
      b.querySelector('#mPurge').onclick = function () {
        closeModal(); var id = cur.id;
        confirmBox('완전 삭제', '「' + esc(titleOf(cur) || '제목 없음') + '」와 하위 페이지·첨부 이미지를 영구히 지웁니다. 다른 직원도 다시 볼 수 없습니다.', '영구 삭제', true).then(function (ok) {
          if (!ok) return;
          var ids = [id].concat(descendants(id));
          rest('econote_files?select=path&page_id=in.(' + ids.join(',') + ')').then(function (files) {
            var paths = (files || []).map(function (f) { return f.path; });
            var p0 = paths.length ? store('object/' + BUCKET, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: paths }) }).catch(function () {}) : Promise.resolve();
            return p0.then(function () { return rest('econote_pages?id=in.(' + ids.join(',') + ')', { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); });
          }).then(function () { toast('영구 삭제했습니다'); cur = null; if (editor) { editor.destroy(); editor = null; } $('#pageEl').style.display = 'none'; $('#welcome').style.display = ''; history.replaceState(null, '', location.pathname); return loadTree(); }).catch(function (e) { toast('삭제 실패: ' + e.message, true); });

  confirmBox('휴지통으로 보내기', '「' + esc(titleOf(cur) || '제목 없음') + '」' + (kids ? ' 과 하위 페이지 ' + kids + '개' : '') + '를 휴지통으로 보냅니다.<br><small style="color:var(--dim)">다른 직원 화면에서도 사라집니다. 휴지통에서 복원할 수 있습니다.</small>', '휴지통으로', true).then(function (ok) {
    if (!ok) return; var ids = [cur.id].concat(descendants(cur.id)); var now = new Date().toISOString();
    (dirty ? save() : Promise.resolve()).then(function () { return rest('econote_pages?id=in.(' + ids.join(',') + ')', { method: 'PATCH', body: JSON.stringify({ deleted_at: now }), headers: { Prefer: 'return=minimal' } }); }).then(function () {
      toast('휴지통으로 보냈습니다'); cur = null; dirty = false; if (editor) { editor.destroy(); editor = null; } $('#pageEl').style.display = 'none'; $('#welcome').style.display = ''; history.replaceState(null, '', location.pathname); return loadTree();
    }).catch(function (e) { toast('삭제 실패: ' + e.message, true); });
  });
});
$('#trashBtn').addEventListener('click', function () { viewTrash = !viewTrash; searchQ = ''; $('#q').value = ''; renderTree(); });
$('#histBtn').addEventListener('click', function () {
  if (!cur) return;
  rest('econote_versions?select=id,rev,title,saved_by_name,saved_at&page_id=eq.' + cur.id + '&order=saved_at.desc&limit=40').then(function (rows) {
    modal('<div class="mh">수정 이력 <span style="font-weight:400;color:var(--dim);font-size:12px;margin-left:6px">같은 사람의 연속 저장은 10분 단위로 묶입니다</span><div class="sp"></div><button class="ibtn" id="mCancel">✕</button></div><div class="mb">' + (rows.length ? '<ul class="vlist">' + rows.map(function (v) { return '<li><span>' + esc(fmtDt(v.saved_at)) + '</span><span class="sp">' + esc(v.title || '제목 없음') + ' <small>· ' + esc(v.saved_by_name || '—') + ' · r' + v.rev + '</small></span><button class="btn" data-v="' + v.id + '">보기</button></li>'; }).join('') + '</ul>' : '<div style="color:var(--dim)">아직 저장된 이전 버전이 없습니다.</div>') + '</div>', function (b) {
      b.querySelector('#mCancel').onclick = closeModal;
      b.querySelectorAll('[data-v]').forEach(function (btn) { btn.onclick = function () { showVersion(+btn.getAttribute('data-v')); }; });
    });
  }).catch(function (e) { toast('이력 조회 실패: ' + e.message, true); });
});
function showVersion(vid) {
  rest('econote_versions?select=*&id=eq.' + vid).then(function (rows) {
    var v = rows[0]; if (!v) return;
    return resolveImages(v.content || { type: 'doc' }).then(function (doc) {
      modal('<div class="mh">' + esc(fmtDt(v.saved_at)) + ' · ' + esc(v.saved_by_name || '—') + '<div class="sp"></div><button class="ibtn" id="mCancel">✕</button></div><div class="mb"><div style="font-weight:700;font-size:18px;margin-bottom:8px">' + esc(v.title || '제목 없음') + '</div><div class="preview" id="vPrev"></div></div><div class="mf"><button class="btn" id="mBack">← 목록</button><button class="btn pri" id="mRestore">이 버전으로 되돌리기</button></div>', function (b) {
        var pe = mkEditor(b.querySelector('#vPrev'), doc, false);
        b.querySelector('#mCancel').onclick = function () { pe.destroy(); closeModal(); };
        b.querySelector('#mBack').onclick = function () { pe.destroy(); closeModal(); $('#histBtn').click(); };
        b.querySelector('#mRestore').onclick = function () {
          pe.destroy(); closeModal();
          if (!editor || cur.deleted_at) return;
          editor.commands.setContent(doc); $('#pgTitle').value = v.title || ''; dirty = true; save(true).then(function () { toast('되돌렸습니다 (되돌리기 전 내용도 이력에 남습니다)'); });
        };
      });
    });
  });
}

/* ═══════════ 폴링 — 다른 직원의 변경 반영 ═══════════ */
function poll() {
  if (document.hidden) return;
  rest('econote_pages?select=' + SUMMARY + ',created_at&order=sort_order.asc,created_at.asc').then(function (rows) {
    var before = JSON.stringify(pages.map(function (p) { return [p.id, p.parent_id, p.title, p.icon, p.sort_order, p.deleted_at]; }));
    pages = rows || [];
    var after = JSON.stringify(pages.map(function (p) { return [p.id, p.parent_id, p.title, p.icon, p.sort_order, p.deleted_at]; }));
    if (before !== after && !searchQ) renderTree();
    if (cur) { var s = byId(cur.id);
      if (!s) { toast('이 페이지가 삭제되었습니다', true); return; }
      if (s.rev !== cur.rev && !dirty && !saving) { openPage(cur.id, { force: true, focus: false }); toast((s.updated_by_name || '다른 직원') + ' 님의 수정을 반영했습니다'); }
      else if (s.rev !== cur.rev && dirty) { /* 저장 때 rev 검사가 충돌을 잡는다 */ }
    }
  }).catch(function () {});
}
setInterval(poll, 20000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });

/* ═══════════ 모바일 사이드바 · 드래그 표시 ═══════════ */
$('#menuBtn').addEventListener('click', function () { $('#side').classList.toggle('open'); });
$('#closeSideBtn').addEventListener('click', function () { $('#side').classList.remove('open'); });
if (window.matchMedia && window.matchMedia('(max-width:860px)').matches) $('#closeSideBtn').style.display = '';
['dragenter', 'dragover'].forEach(function (ev) { $('#editor').addEventListener(ev, function (e) { if (e.dataTransfer && Array.prototype.some.call(e.dataTransfer.types || [], function (t) { return t === 'Files'; })) { this.querySelector('.ProseMirror') && this.querySelector('.ProseMirror').classList.add('drag'); } }); });
['dragleave', 'drop'].forEach(function (ev) { $('#editor').addEventListener(ev, function () { var pm = this.querySelector('.ProseMirror'); if (pm) pm.classList.remove('drag'); }); });
document.addEventListener('mousedown', function (e) { if (slash.open && !e.target.closest('#slash') && !e.target.closest('.ProseMirror')) slashClose(); });

/* ═══════════ 부팅 ═══════════ */
function boot() {
  if (!T) { $('#tree').innerHTML = '<div class="empty">편집기 모듈을 불러오지 못했습니다. 새로고침해 주세요.</div>'; return; }
  var uid = A.session && A.session.user && A.session.user.id;
  if (!uid) { try { uid = JSON.parse(atob(A.session.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch (e) {} }
  me.id = uid;
  var ROLE_KO = { master: '마스터', admin: '관리자', executive: '임원', staff: '직원' };
  rest('profiles?select=display_name,role,email&id=eq.' + uid).then(function (rows) {
    var p = rows && rows[0] || {}; me.name = p.display_name || (p.email || '').split('@')[0] || '직원'; me.role = p.role || '';
    $('#meName').textContent = me.name; $('#meRole').textContent = ' · ' + (ROLE_KO[me.role] || '직원');
  }).catch(function () { me.name = '직원'; });
  loadTree().then(function () {
    var pid = new URLSearchParams(location.search).get('p');
    if (pid && byId(pid)) { if (byId(pid).deleted_at) viewTrash = true; openPage(pid, { focus: false }); }
  }).catch(function (e) { $('#tree').innerHTML = '<div class="empty">불러오기 실패: ' + esc(e.message) + '</div>'; });
}
/* 테스트 하네스(tests/econote) 전용 노출 */
window.__ECONOTE = { get editor() { return editor; }, get cur() { return cur; }, get pages() { return pages; }, get dirty() { return dirty; }, save: save, openPage: openPage, createPage: createPage, poll: poll };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
