<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style id="ecorean-gate-style">html{visibility:hidden}</style>
<script src="/ecorean-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoNote — ECOREAN 직원 공용 노트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ═══════════ 테마 ═══════════ */
:root{
  --bg:#090c13;--bg2:#0f131c;--bg3:#161c28;--bg4:#1e2634;--line:#1c2433;--line2:#2a3446;
  --text:#e9edf5;--text2:#c3cad8;--dim:#8d97ab;--dim2:#5d6779;
  --accent:#4ade80;--accent2:#22d3ee;--accent-dim:rgba(74,222,128,.13);--accent-line:rgba(74,222,128,.35);
  --red:#f87171;--blue:#60a5fa;--amber:#fbbf24;--gold:#d4b46a;--violet:#a78bfa;
  --shadow:0 14px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  --sb:288px;--radius:10px;
  --hl-y:#5a4a12;--hl-g:#164a2a;--hl-b:#163a5a;--hl-p:#3d2a5a;--hl-r:#5a1f27;
  --co-info:rgba(96,165,250,.12);--co-info-l:rgba(96,165,250,.4);--co-warn:rgba(251,191,36,.12);--co-warn-l:rgba(251,191,36,.45);--co-ok:rgba(74,222,128,.12);--co-ok-l:rgba(74,222,128,.4);--co-bad:rgba(248,113,113,.12);--co-bad-l:rgba(248,113,113,.4);--co-note:rgba(167,139,250,.12);--co-note-l:rgba(167,139,250,.4);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f8fb;--bg2:#ffffff;--bg3:#eef1f6;--bg4:#e3e8f0;--line:#e4e8ef;--line2:#cfd6e1;
  --text:#171c26;--text2:#2e3644;--dim:#5f6b7f;--dim2:#96a0b1;
  --accent:#16a34a;--accent2:#0891b2;--accent-dim:rgba(22,163,74,.1);--accent-line:rgba(22,163,74,.35);
  --red:#dc2626;--blue:#2563eb;--amber:#d97706;--gold:#a8862f;--violet:#7c3aed;
  --shadow:0 14px 44px rgba(20,30,50,.16),0 2px 8px rgba(20,30,50,.08);
  --hl-y:#fff1a8;--hl-g:#c9f5d8;--hl-b:#cfe6ff;--hl-p:#e6d9ff;--hl-r:#ffd3d3;
  --co-info:rgba(37,99,235,.08);--co-info-l:rgba(37,99,235,.35);--co-warn:rgba(217,119,6,.1);--co-warn-l:rgba(217,119,6,.4);--co-ok:rgba(22,163,74,.1);--co-ok-l:rgba(22,163,74,.35);--co-bad:rgba(220,38,38,.08);--co-bad-l:rgba(220,38,38,.35);--co-note:rgba(124,58,237,.08);--co-note-l:rgba(124,58,237,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--blue)}
::selection{background:rgba(96,165,250,.35)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}
.hide{display:none!important}
kbd{background:var(--bg3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:inherit;color:var(--dim)}

.shell{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ═══════════ 사이드바 ═══════════ */
aside{width:var(--sb);flex:0 0 var(--sb);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;transition:margin .18s ease}
.shell.sb-off aside{margin-left:calc(var(--sb) * -1)}
.sb-resize{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5}
.sb-resize:hover,.sb-resize.on{background:var(--accent-line)}
.sb-head{padding:14px 12px 8px 16px;display:flex;align-items:center;gap:6px}
.sb-head .logo{font-weight:800;letter-spacing:.4px;font-size:15px;line-height:1.1}
.sb-head .logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-head .logo small{display:block;font-weight:500;color:var(--dim2);font-size:11px;letter-spacing:0;margin-top:3px}
.sp{flex:1}
.ibtn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px;flex:0 0 auto}
.ibtn:hover{background:var(--bg3);color:var(--text)}
.ibtn.on{color:var(--accent);background:var(--accent-dim)}
.sb-search{padding:2px 12px 8px 16px}
.sb-search button{width:100%;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--dim);text-align:left}
.sb-search button:hover{border-color:var(--line2);color:var(--text)}
.sb-search kbd{margin-left:auto}
.sb-scroll{flex:1;overflow:auto;min-height:0;padding:0 8px 14px 8px}
.sb-sec{padding:12px 8px 3px;font-size:11px;color:var(--dim2);letter-spacing:.9px;text-transform:uppercase;display:flex;align-items:center;gap:6px;user-select:none}
.sb-sec .sp{flex:1}
.sb-sec .mini{font-size:11px;letter-spacing:0;text-transform:none;color:var(--dim2);padding:1px 6px;border-radius:5px}
.sb-sec .mini:hover{background:var(--bg3);color:var(--text)}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-left:14px}
.node{display:flex;align-items:center;gap:3px;padding:4px 4px 4px 4px;border-radius:7px;color:var(--text2);font-size:13.5px;cursor:pointer;user-select:none;min-width:0;position:relative;outline:0}
.node:hover{background:var(--bg3);color:var(--text)}
.node:focus-visible{box-shadow:inset 0 0 0 1px var(--accent-line)}
.node.on{background:var(--accent-dim);color:var(--text)}
.node .tg{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--dim2);font-size:10px}
.node .tg:hover{background:var(--bg4);color:var(--text)}
.node .tg.empty{visibility:hidden}
.node .ic{width:20px;flex:0 0 20px;text-align:center;font-size:14px}
.node .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .tt.untitled{color:var(--dim2);font-style:italic}
.node .act{display:none;gap:1px}
.node:hover .act,.node.menu-open .act{display:inline-flex}
.node .act button{width:20px;height:20px;border-radius:5px;color:var(--dim2);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.node .act button:hover{background:var(--bg4);color:var(--accent)}
.node.dragging{opacity:.4}
.node.drop-before::before,.node.drop-after::after{content:"";position:absolute;left:24px;right:6px;height:2px;background:var(--accent);border-radius:2px}
.node.drop-before::before{top:-1px}
.node.drop-after::after{bottom:-1px}
.node.drop-inside{box-shadow:inset 0 0 0 2px var(--accent-line);background:var(--accent-dim)}
.node input.rename{flex:1;background:var(--bg);border:1px solid var(--accent-line);border-radius:5px;padding:1px 6px;font-size:13px;outline:0;min-width:0}
.tree .empty{color:var(--dim2);font-size:13px;padding:10px 8px}
li.closed>ul{display:none}
.sb-foot{border-top:1px solid var(--line);padding:9px 12px 9px 16px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.sb-foot b{color:var(--text);font-weight:600}
.sb-foot a{color:var(--dim);text-decoration:none}
.sb-foot a:hover{color:var(--text)}
.av{display:inline-flex;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120a;font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-right:4px;vertical-align:-4px;flex:0 0 18px}
.result{padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--dim)}
.result:hover,.result.sel{background:var(--bg3);color:var(--text)}
.result b{display:block;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══════════ 본문 영역 ═══════════ */
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:4px;padding:6px 10px 6px 8px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--dim);min-height:44px}
.top .crumb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.top .crumb a{color:var(--dim);text-decoration:none;padding:2px 4px;border-radius:5px}
.top .crumb a:hover{color:var(--text);background:var(--bg3)}
.top .crumb i{margin:0 3px;font-style:normal;color:var(--dim2)}
.top .st{font-size:12px;color:var(--dim2);white-space:nowrap;margin:0 4px}
.top .st.dirty{color:var(--amber)}
.top .st.err{color:var(--red)}
.top .st.ok{color:var(--accent)}
.tbtn{padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tbtn:hover{background:var(--bg3);color:var(--text)}
.tbtn.on{color:var(--amber)}
.body{flex:1;display:flex;min-height:0}
.paper{flex:1;overflow:auto;min-height:0}
.page{max-width:820px;margin:0 auto;padding:0 56px 180px}
.page.wide{max-width:1400px}
.cover{height:150px;margin:0 -56px 0;border-radius:0 0 18px 18px;position:relative;background:var(--cv,linear-gradient(120deg,#1e3a5f,#0f766e))}
.cover .cv-act{position:absolute;right:14px;bottom:10px;display:flex;gap:6px;opacity:0;transition:.15s}
.cover:hover .cv-act{opacity:1}
.cover .cv-act button{background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:4px 9px;font-size:12px;backdrop-filter:blur(4px)}
.head{padding-top:34px}
.head.has-cover{padding-top:0;margin-top:-30px}
.pg-icon{font-size:56px;line-height:1;display:inline-block;cursor:pointer;border-radius:12px;padding:4px;margin-left:-6px;transition:background .15s}
.pg-icon:hover{background:var(--bg3)}
.pg-icon.none{font-size:12.5px;color:var(--dim2);padding:5px 9px;border:1px dashed var(--line2);border-radius:7px;opacity:0;margin-top:8px}
.head:hover .pg-icon.none,.pg-icon.none:focus{opacity:1}
.head-act{display:flex;gap:4px;margin-top:8px;opacity:0;transition:.15s;height:0}
.head:hover .head-act{opacity:1}
.head-act button{font-size:12px;color:var(--dim2);padding:2px 8px;border-radius:6px}
.head-act button:hover{background:var(--bg3);color:var(--text)}
.pg-title{display:block;width:100%;background:none;border:0;outline:0;font-size:38px;font-weight:800;line-height:1.2;padding:12px 0 4px;color:var(--text);letter-spacing:-.5px;resize:none;overflow:hidden;font-family:inherit}
.pg-title::placeholder{color:var(--dim2)}
.pg-meta{font-size:12.5px;color:var(--dim2);margin:2px 0 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pg-meta b{color:var(--dim);font-weight:500}

/* 상단 도구줄 */
.bar{position:sticky;top:8px;z-index:6;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:4px 5px;display:flex;flex-wrap:wrap;gap:1px;margin:0 0 20px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.bar button,.bar select{height:29px;min-width:29px;padding:0 6px;border-radius:7px;color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative}
.bar select{background:transparent;border:0;outline:0;padding-right:2px;cursor:pointer}
.bar select option{background:var(--bg2);color:var(--text)}
.bar button:hover{background:var(--bg3);color:var(--text)}
.bar button.on{background:var(--accent-dim);color:var(--accent)}
.bar .sep{width:1px;background:var(--line);margin:5px 4px}
.bar .grp{display:inline-flex;gap:1px}
.bar .tbl{display:none}
.bar.in-table .tbl{display:inline-flex}
.bar b{font-weight:700}.bar i{font-style:italic}.bar u{text-decoration:underline}.bar s{text-decoration:line-through}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(128,128,128,.4)}
.pop{position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:none;min-width:160px}
.pop.show{display:block}
.pop .row{display:flex;gap:5px;flex-wrap:wrap;max-width:210px}
.pop .row button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2)}
.pop .row button:hover{outline:2px solid var(--accent-line)}
.pop .lbl{font-size:11px;color:var(--dim2);margin:6px 0 4px}
.pop .it{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text2);white-space:nowrap}
.pop .it:hover,.pop .it.sel{background:var(--bg3);color:var(--text)}
.pop .it.danger:hover{color:var(--red)}
.pop .it kbd{margin-left:auto}
.pop .it .k{width:20px;text-align:center;font-size:13px;color:var(--dim)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.emo{display:grid;grid-template-columns:repeat(8,30px);gap:2px;max-height:230px;overflow:auto}
.emo button{width:30px;height:30px;border-radius:6px;font-size:18px}
.emo button:hover{background:var(--bg3)}

/* 선택 버블 · 이미지 도구 */
.bubble{position:fixed;z-index:55;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:3px;display:none;gap:1px;align-items:center}
.bubble.show{display:inline-flex}
.bubble button{height:28px;min-width:28px;padding:0 6px;border-radius:6px;color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.bubble button:hover{background:var(--bg3);color:var(--text)}
.bubble button.on{background:var(--accent-dim);color:var(--accent)}
.bubble .sep{width:1px;background:var(--line);margin:4px 3px;align-self:stretch}

/* ═══════════ 편집기 ═══════════ */
#editor{position:relative}
.ProseMirror{outline:0;min-height:55vh;font-size:16px;line-height:1.8;color:var(--text);padding-left:2px}
html[data-fs="small"] .ProseMirror{font-size:14.5px;line-height:1.7}
html[data-fs="large"] .ProseMirror{font-size:18px;line-height:1.85}
.page.serif .ProseMirror,html[data-font="serif"] .ProseMirror{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
html[data-font="mono"] .ProseMirror{font-family:"JetBrains Mono","D2Coding",Consolas,monospace}
.ProseMirror>*+*{margin-top:.5em}
.ProseMirror h1{font-size:1.85em;margin-top:1.35em;line-height:1.25;letter-spacing:-.3px}
.ProseMirror h2{font-size:1.45em;margin-top:1.25em;line-height:1.3;letter-spacing:-.2px}
.ProseMirror h3{font-size:1.18em;margin-top:1em}
.ProseMirror p{margin:0}
.ProseMirror .is-empty::before{content:attr(data-placeholder);color:var(--dim2);float:left;height:0;pointer-events:none}
.ProseMirror ul,.ProseMirror ol{padding-left:1.55em}
.ProseMirror li p{margin:0}
.ProseMirror li+li{margin-top:.15em}
.ProseMirror ul[data-type="taskList"]{list-style:none;padding-left:.15em}
.ProseMirror ul[data-type="taskList"] li{display:flex;gap:9px;align-items:flex-start}
.ProseMirror ul[data-type="taskList"] li>label{flex:0 0 auto;margin-top:.4em;user-select:none}
.ProseMirror ul[data-type="taskList"] li>div{flex:1}
.ProseMirror ul[data-type="taskList"] li[data-checked="true"]>div{color:var(--dim2);text-decoration:line-through}
.ProseMirror input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.ProseMirror blockquote{border-left:3px solid var(--gold);margin:0;padding:2px 0 2px 16px;color:var(--text2)}
.ProseMirror code{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.88em;font-family:"JetBrains Mono","D2Coding",Consolas,monospace;color:var(--accent2)}
.ProseMirror pre{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;font-family:"JetBrains Mono","D2Coding",Consolas,monospace;font-size:.88em;line-height:1.6}
.ProseMirror pre code{background:none;border:0;padding:0;color:inherit}
.ProseMirror hr{border:0;border-top:1px solid var(--line2);margin:1.6em 0}
.ProseMirror a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ProseMirror mark{border-radius:3px;padding:0 2px;color:inherit}
.ProseMirror img{max-width:100%;height:auto;border-radius:10px;display:block;transition:box-shadow .15s}
.ProseMirror img[data-align="center"]{margin-left:auto;margin-right:auto}
.ProseMirror img[data-align="right"]{margin-left:auto}
.ProseMirror img.ProseMirror-selectednode{box-shadow:0 0 0 3px var(--blue)}
.ProseMirror img[src=""],.ProseMirror img:not([src]){min-height:90px;background:var(--bg3);border:1px dashed var(--line2)}
.ProseMirror div[data-youtube-video]{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;margin:.6em 0}
.ProseMirror div[data-youtube-video] iframe{width:100%;height:100%;border:0;border-radius:12px;background:#000}
.ProseMirror div[data-youtube-video].ProseMirror-selectednode iframe{outline:3px solid var(--blue)}
.ProseMirror .tableWrapper{overflow-x:auto;margin:.6em 0}
.ProseMirror table{border-collapse:collapse;width:100%;table-layout:fixed;overflow:hidden;border-radius:8px}
.ProseMirror td,.ProseMirror th{border:1px solid var(--line2);padding:6px 10px;vertical-align:top;min-width:60px;position:relative}
.ProseMirror th{background:var(--bg3);font-weight:600;text-align:left}
.ProseMirror .selectedCell:after{content:"";position:absolute;inset:0;background:rgba(96,165,250,.18);pointer-events:none}
.ProseMirror .column-resize-handle{position:absolute;right:-2px;top:0;bottom:0;width:4px;background:var(--blue);pointer-events:none}
.ProseMirror .ProseMirror-gapcursor:after{border-top:1px solid var(--text)}
.ProseMirror div[data-callout]{display:flex;gap:12px;padding:12px 14px;border-radius:10px;background:var(--co-info);border:1px solid var(--co-info-l);margin:.6em 0}
.ProseMirror div[data-callout][data-tone="warn"]{background:var(--co-warn);border-color:var(--co-warn-l)}
.ProseMirror div[data-callout][data-tone="ok"]{background:var(--co-ok);border-color:var(--co-ok-l)}
.ProseMirror div[data-callout][data-tone="bad"]{background:var(--co-bad);border-color:var(--co-bad-l)}
.ProseMirror div[data-callout][data-tone="note"]{background:var(--co-note);border-color:var(--co-note-l)}
.ProseMirror div[data-callout] .co-icon{font-size:20px;line-height:1.4;flex:0 0 auto;cursor:pointer;user-select:none}
.ProseMirror div[data-callout] .co-body{flex:1;min-width:0}
.ProseMirror div[data-type="details"]{display:flex;gap:4px;margin:.4em 0;padding:2px 0}
.ProseMirror div[data-type="details"]>button{width:24px;height:24px;flex:0 0 24px;border-radius:6px;color:var(--dim);font-size:11px;margin-top:.2em;display:inline-flex;align-items:center;justify-content:center}
.ProseMirror div[data-type="details"]>button:hover{background:var(--bg3);color:var(--text)}
.ProseMirror div[data-type="details"]>button::before{content:"▶";transition:transform .15s}
.ProseMirror div[data-type="details"].is-open>button::before{transform:rotate(90deg)}
.ProseMirror div[data-type="details"]>div{flex:1;min-width:0}
.ProseMirror div[data-type="detailsSummary"]{font-weight:600}
.ProseMirror div[data-type="detailsContent"]{padding:4px 0 2px 2px}
.ProseMirror div[data-type="details"]:not(.is-open)>div>div[data-type="detailsContent"]{display:none}
.ProseMirror .drag-over{outline:2px dashed var(--accent);outline-offset:6px;border-radius:8px}
.drag-handle{width:22px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim2);cursor:grab;font-size:15px;letter-spacing:-2px;user-select:none;opacity:.8;position:relative;transition:opacity .1s,background .1s}
.drag-handle:hover{background:var(--bg3);color:var(--text);opacity:1}
.drag-handle::before{content:"⋮⋮"}

.slash .it small{display:block;color:var(--dim2);font-size:11.5px}
.slash .it.sel,.slash .it:hover{background:var(--bg3)}
.slash .none{padding:8px;color:var(--dim2);font-size:13px}
.slash .grp{font-size:10.5px;color:var(--dim2);letter-spacing:.8px;text-transform:uppercase;padding:6px 8px 2px}

function poll() {
  if (document.hidden || pollBusy) return Promise.resolve();
  pollBusy = true;
  return rest('econote_pages?select=updated_at&order=updated_at.desc&limit=1', { headers: { Prefer: 'count=exact' }, raw: true }).then(function (res) {
    var at = res.body && res.body[0] ? res.body[0].updated_at : null;
    var n = parseInt(String((res.headers && res.headers.get('content-range')) || '').split('/')[1], 10);
    if (at === tick.at && n === tick.n) return;
    return rest('econote_pages?select=' + SUMMARY + ',created_at&order=sort_order.asc,created_at.asc').then(function (rows) {
      var key = function (p) { return [p.id, p.parent_id, p.title, p.icon, p.sort_order, p.deleted_at]; };
      var before = JSON.stringify(pages.map(key)); pages = rows || []; setTick();
      if (before !== JSON.stringify(pages.map(key))) renderTree();
      if (cur) { var s = byId(cur.id);
        if (!s) { toast('이 페이지가 삭제되었습니다', true); return; }
        if (s.rev !== cur.rev && !dirty && !saving) { return openPage(cur.id, { force: true, focus: false, keepScroll: true }).then(function () { toast((s.updated_by_name || '다른 직원') + ' 님의 수정을 반영했습니다'); }); }
        if (s.rev === cur.rev && JSON.stringify(s.props || {}) !== JSON.stringify(cur.props || {})) { cur.props = s.props || {}; pageMeta(); }
      }
    });
  }).catch(function () {}).then(function () { pollBusy = false; });
}
var pollTimer = null;

restartPoll();
document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });

  if (!uid) { try { uid = JSON.parse(atob(A.session.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch (e) {} }

  rest('profiles?select=display_name,role,email&id=eq.' + uid).then(function (rows) {
    var p = rows && rows[0] || {}; me.name = p.display_name || (p.email || '').split('@')[0] || '직원'; me.role = p.role || '';
    $('#meName').textContent = me.name; $('#meRole').textContent = ' · ' + (ROLE_KO[me.role] || '직원'); $('#meAv').textContent = initials(me.name);

}
