<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style id="ecorean-gate-style">html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/ecorean-gate.js"></script>
<script src="/app-cloud.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOREAN 현장 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F4F1EA;--bg-panel:#FBFAF6;--bg-soft:#EAE5DA;
  --ink:#1A1F2E;--ink-2:#3D4555;--ink-3:#6B7384;
  --line:#C9C3B5;--line-soft:#DDD6C5;
  --accent:#B85420;--accent-soft:#F2D4C0;
  --crit:#A32D2D;--ok:#0F6E56;--info:#1B4D8C;--warn:#946200;
  --font-sans:'Manrope','Pretendard',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','D2Coding',monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.hdr{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.hdr h1{font-size:20px;font-weight:800;margin:0}
.hdr .sub{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:0.08em;margin-top:3px}
.asset{display:inline-block;font-family:var(--font-mono);font-size:9px;color:var(--crit);border:1px solid var(--crit);padding:2px 7px;border-radius:2px;margin-top:8px}
.btn{font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;padding:7px 11px;border:1px solid var(--line);background:var(--bg-panel);color:var(--ink-2);cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.clock{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);margin-top:5px;letter-spacing:0.04em}
.clock b{color:var(--accent);font-weight:600}

/* ── 전체 요약 상단 바 ── */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:20px}
.kpi .c{background:var(--bg-panel);padding:14px}
.kpi .c.main{background:var(--ink);color:var(--bg)}
.kpi .l{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;color:var(--ink-3);text-transform:uppercase}
.kpi .c.main .l{color:var(--bg-soft)}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-family:var(--font-mono)}
.kpi .v small{font-size:11px;font-weight:500;color:var(--ink-3)}
.kpi .c.main .v small{color:var(--bg-soft)}

/* ── 섹션 제목 ── */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-h .t{font-weight:800;font-size:15px}
.sec-h .mark{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);letter-spacing:0.08em}

/* ── 현장 카드 그리드 ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(184,84,32,.14);transform:translateY(-2px)}
.card-top{padding:14px 15px 12px;border-bottom:1px solid var(--line-soft)}
.card-name{font-size:16px;font-weight:800;line-height:1.3;margin:0}
.card-addr{font-size:11.5px;color:var(--ink-3);margin-top:3px;min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-id{font-family:var(--font-mono);font-size:9px;color:var(--ink-3);letter-spacing:0.05em;margin-top:6px;display:inline-block;background:var(--bg-soft);border-radius:3px;padding:2px 6px}
.card-prog{padding:12px 15px}
.card-prog .pl{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink-3);font-family:var(--font-mono);letter-spacing:0.05em}
.card-prog .pl b{font-size:20px;font-weight:800;color:var(--accent);font-family:var(--font-mono)}
.pbar{height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft);margin-top:2px}
.card-stats .s{background:var(--bg-panel);padding:9px 15px}
.card-stats .sl{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;color:var(--ink-3);text-transform:uppercase}
.card-stats .sv{font-size:14px;font-weight:700;margin-top:2px;font-family:var(--font-mono)}
.card-stats .sv small{font-size:10px;font-weight:500;color:var(--ink-3)}
.card-foot{padding:9px 15px;background:var(--bg-soft);font-family:var(--font-mono);font-size:10px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-soft)}
.card-foot .go{color:var(--accent);font-weight:600}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:50px 20px;background:var(--bg-panel);border:2px dashed var(--line);border-radius:8px}
.empty .big{font-size:38px;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:800;margin:0 0 6px}
.empty p{color:var(--ink-3);font-size:13px;margin:0 0 18px}

.footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.hidden{display:none}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div>
      <h1>현장 통합 대시보드</h1>
      <div class="sub">MULTI-SITE DASHBOARD · 전체 현장 현황 한눈에 · ECOREAN</div>
      <span class="asset">🔒 복제금지 · ECOREAN 자산</span>
      <div class="clock" id="clock">—</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <a class="btn" href="/daily/">＋ 현장일보 열기</a>
      <button class="btn" onclick="boot()">↻ 새로고침</button>
      <button class="btn" onclick="window.print()">🖨 인쇄</button>
    </div>
  </header>

  <!-- 전체 요약 상단 바 -->
  <div class="kpi" id="kpi"></div>

  <!-- 현장별 카드 -->
  <div id="sitesSection">
    <div class="sec-h"><span class="t">현장별 현황</span><span class="mark" id="siteCount">SITES</span></div>
    <div class="cards" id="cards"></div>
  </div>

  <!-- 빈 상태 -->
  <div id="emptyState" class="empty hidden">
    <div class="big">🏗️</div>
    <h3>아직 등록된 현장이 없습니다</h3>
    <p>현장일보에서 새 현장을 만드세요.</p>
    <a class="btn" href="/daily/" style="font-size:13px;padding:10px 18px">＋ 현장일보 열기</a>
  </div>

  <footer class="footer">
    <span>ⓒ 2026 ECOREAN · 현장 통합 대시보드 v2.0 · 무단 복제·배포 금지 · ECOREAN 자산</span>
    <span id="loadStatus"></span>
  </footer>
</div>

<script>
/* ═══ 저장소: app_documents(APP_CLOUD, 세션 인증·staff RLS) 읽기 전용 ═══
   현장일보 앱과 동일 백엔드. get(key){value} 인터페이스 유지 — 값은 {v:문자열}. */
(function(){
  window.storage={
    async get(k){
      try{
        if(!(window.APP_CLOUD&&APP_CLOUD.ready()))return null;
        const doc=await APP_CLOUD.load('sitedaily',k);
        return (doc&&doc.data&&typeof doc.data.v==='string')?{key:k,value:doc.data.v}:null;
      }catch(e){return null;}
    }
  };
})();

const won=n=>(Math.round(+n||0)).toLocaleString('ko-KR');
const esc=v=>(v==null?'':String(v)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ── 일보(report) 집계 헬퍼 — 현장일보 앱 계산식 재사용 ── */
function mpTotal(r){return (r.manpower||[]).reduce((s,m)=>s+(+m.count||0),0);}
function expTotal(r){return (r.cash&&r.cash.expenses||[]).reduce((s,x)=>s+(+x.amount||0),0);}

/* 전체 진행률: 공정표(schedule.phases) 있으면 dur 가중, 없으면 최근 일보 공정 progress 평균 */
function overallProgress(st,dates,reports){
  const durById={};let totalDur=0;
  if(st&&st.schedule&&st.schedule.phases){st.schedule.phases.forEach(p=>{durById[p.id]=p.dur;totalDur+=(+p.dur||0);});}
  if(totalDur){
    const latest={};
    dates.forEach(d=>{(reports[d].processes||[]).forEach(p=>{if(p.id!=null)latest[p.id]=p.progress;});});
    let acc=0;Object.keys(latest).forEach(id=>acc+=(+latest[id]||0)/100*(durById[id]||0));
    return Math.round(acc/totalDur*100);
  }
  if(!dates.length)return 0;
  const ps=reports[dates[dates.length-1]].processes||[];
  return ps.length?Math.round(ps.reduce((a,p)=>a+(+p.progress||0),0)/ps.length):0;
}

/* 현장 1개 집계 */
function aggSite(st){
  const reports=(st&&st.reports)||{};
  const dates=Object.keys(reports).sort();
  let totalMD=0,totalExp=0;
  dates.forEach(d=>{totalMD+=mpTotal(reports[d]);totalExp+=expTotal(reports[d]);});
  return {
    dates,count:dates.length,totalMD,totalExp,
    overall:overallProgress(st,dates,reports),
    lastDate:dates.length?dates[dates.length-1]:null
  };
}

/* ── 부팅: 인덱스 → 각 현장 데이터 로드 ── */
async function boot(){
  document.getElementById('loadStatus').textContent='불러오는 중…';
  let sites=[];
  try{const g=await window.storage.get('boc-daily-sites');if(g&&g.value)sites=JSON.parse(g.value)||[];}catch(e){sites=[];}
  if(!Array.isArray(sites))sites=[];
  const cards=[];
  await Promise.all(sites.map(async s=>{
    let st=null;
    try{const g=await window.storage.get('boc-daily-state:'+s.id);if(g&&g.value)st=JSON.parse(g.value);}catch(e){}
    cards.push({site:s,state:st||{},agg:aggSite(st||{})});
  }));
  // 인덱스 순서 유지
  const order={};sites.forEach((s,i)=>order[s.id]=i);
  cards.sort((a,b)=>(order[a.site.id]??0)-(order[b.site.id]??0));
  render(cards);
  document.getElementById('loadStatus').textContent='불러옴 '+new Date().toLocaleTimeString('ko-KR');
}

/* ── 렌더 ── */
function render(cards){
  const nSites=cards.length;
  const totalReports=cards.reduce((s,c)=>s+c.agg.count,0);
  const totalMD=cards.reduce((s,c)=>s+c.agg.totalMD,0);
  const totalExp=cards.reduce((s,c)=>s+c.agg.totalExp,0);

  document.getElementById('kpi').innerHTML=`
    <div class="c main"><div class="l">총 현장 수</div><div class="v">${nSites}<small> 현장</small></div></div>
    <div class="c"><div class="l">총 일보 수</div><div class="v">${totalReports}<small> 건</small></div></div>
    <div class="c"><div class="l">전체 누적 인원</div><div class="v">${totalMD.toLocaleString('ko-KR')}<small> 인일</small></div></div>
    <div class="c"><div class="l">전체 누적 지출</div><div class="v">${won(totalExp)}<small> 원</small></div></div>`;

  const hasSites=nSites>0;
  document.getElementById('sitesSection').classList.toggle('hidden',!hasSites);
  document.getElementById('emptyState').classList.toggle('hidden',hasSites);
  document.getElementById('siteCount').textContent=nSites+' SITES';
  if(!hasSites){document.getElementById('cards').innerHTML='';return;}

  document.getElementById('cards').innerHTML=cards.map(c=>{
    const s=c.site,a=c.agg;
    const name=esc((s.name)||(c.state.site&&c.state.site.name)||'(이름 없음)');
    const addr=esc(s.addr||(c.state.site&&c.state.site.addr)||'');
    const id=esc(s.id||'');
    return `<a class="card" href="/daily/?site=${encodeURIComponent(s.id||'')}">
      <div class="card-top">
        <h3 class="card-name">${name}</h3>
        <div class="card-addr">${addr||'&nbsp;'}</div>
        <span class="card-id">${id||'—'}</span>
      </div>
      <div class="card-prog">
        <div class="pl"><span>전체 진행률</span><b>${a.overall}%</b></div>
        <div class="pbar"><i style="width:${Math.max(0,Math.min(100,a.overall))}%"></i></div>
      </div>
      <div class="card-stats">
        <div class="s"><div class="sl">일보</div><div class="sv">${a.count}<small> 건</small></div></div>
        <div class="s"><div class="sl">누적 인원</div><div class="sv">${a.totalMD.toLocaleString('ko-KR')}<small> 인일</small></div></div>
        <div class="s"><div class="sl">누적 지출</div><div class="sv">${won(a.totalExp)}<small> 원</small></div></div>
        <div class="s"><div class="sl">최근 일보</div><div class="sv" style="font-size:12px">${a.lastDate?esc(a.lastDate):'—'}</div></div>
      </div>
      <div class="card-foot"><span>현장 열기</span><span class="go">/daily/?site=${id||'—'} →</span></div>
    </a>`;
  }).join('');
}

/* ── 시계 ── */
(function(){const WD=['일','월','화','수','목','금','토'],z=n=>String(n).padStart(2,'0');
  function tick(){const el=document.getElementById('clock');if(!el)return;const d=new Date();
    el.innerHTML=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} (${WD[d.getDay()]}) <b>${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}</b>`;}
  tick();setInterval(tick,1000);})();

boot();
</script>
</body>
</html>
