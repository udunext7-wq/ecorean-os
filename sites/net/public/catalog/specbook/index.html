<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스펙북 발행 — ECOREAN</title>
<style id="ecorean-gate-style">html{visibility:hidden}</style>
<style>
:root{--gold:#B8965A;--dark:#1A1814;--line:#ddd;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',-apple-system,sans-serif;background:#f2efe9;color:#222;font-size:14px}
/* 상단 콘솔 (인쇄 제외) */
.console{position:sticky;top:0;z-index:50;background:var(--dark);color:#F8F4EE;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.console b{letter-spacing:.15em}
.console select,.console input{background:#2a261f;border:1px solid #4a4438;color:#F8F4EE;padding:8px 10px;border-radius:7px;font-size:13px}
.console .grow{flex:1;min-width:160px}
.console button,.console .btn{background:var(--gold);color:#1A1814;border:none;border-radius:7px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px;text-decoration:none}
.console button.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.toggle{display:flex;border:1px solid var(--gold);border-radius:7px;overflow:hidden}
.toggle button{border-radius:0;background:transparent;color:var(--gold)}
.toggle button.on{background:var(--gold);color:#1A1814}
/* 문서 */
.doc{max-width:860px;margin:24px auto;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.cover{padding:70px 60px;border-bottom:3px double #333;min-height:340px;display:flex;flex-direction:column;justify-content:space-between}
.cover .brand{font-family:Georgia,serif;letter-spacing:.4em;font-size:20px;color:var(--gold)}
.cover h1{font-size:34px;margin:24px 0 8px;line-height:1.3}
.cover .sub{color:#666;line-height:2}
.cover .badge{align-self:flex-start;border:1px solid var(--gold);color:#8a713f;padding:4px 14px;font-size:12px;letter-spacing:.2em;margin-top:20px}
.sec{padding:34px 50px;border-bottom:1px solid var(--line)}
.sec h2{font-size:18px;border-left:5px solid var(--gold);padding-left:12px;margin-bottom:18px}
.item{display:flex;gap:20px;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;page-break-inside:avoid}
.item img{width:170px;height:170px;object-fit:cover;border-radius:6px;background:#eee;flex-shrink:0}
.item .ph{width:170px;height:170px;border-radius:6px;background:#f4f1ea;display:flex;align-items:center;justify-content:center;color:#b9a97f;font-family:Georgia,serif;font-size:22px;text-align:center;padding:8px;flex-shrink:0}
.item table{flex:1;border-collapse:collapse;font-size:13px;height:fit-content}
.item th{color:#8a713f;text-align:left;padding:5px 12px 5px 0;font-size:11px;letter-spacing:.12em;white-space:nowrap;vertical-align:top;width:74px}
.item td{padding:5px 0;border-bottom:1px solid #f0ece2;line-height:1.5}
.item .nm{font-size:15.5px;font-weight:700}
.sum{padding:34px 50px}
.sum h2{font-size:18px;border-left:5px solid var(--gold);padding-left:12px;margin-bottom:16px}
.sum table{width:100%;border-collapse:collapse;font-size:12.5px}
.sum th,.sum td{border:1px solid #ccc;padding:7px 9px;text-align:left}
.sum th{background:#f6f2e9}
.sum .r{text-align:right}
.foot{padding:26px 50px;color:#777;font-size:12px;line-height:1.9;border-top:1px solid var(--line)}
.empty{padding:80px;text-align:center;color:#999}
@media print{
  .console{display:none}
  body{background:#fff}
  .doc{box-shadow:none;margin:0;max-width:none}
  .cover{min-height:80vh}
  .sec{page-break-before:auto}
}
@media (max-width:700px){ .item{flex-direction:column} .item img,.item .ph{width:100%;height:200px} .cover,.sec,.sum{padding:24px 20px} }
</style>
</head>
<body>
<div class="console">
  <b>ECOREAN 스펙북</b>
  <select id="bookSel" class="grow"></select>
  <input id="siteAddr" class="grow" placeholder="현장 주소 (표지에 표시)">
  <div class="toggle">
    <button id="vSite" class="on" type="button">🔒 현장·발주용</button>
    <button id="vClient" type="button">👤 고객 제안용</button>
  </div>
  <button id="printBtn" type="button">🖨 인쇄 / PDF</button>
  <button id="poBtn" type="button" class="ghost" style="border:1px solid var(--gold);background:transparent;color:var(--gold)">📦 발주서 생성</button>
  <a class="btn ghost" href="/hub">허브</a>
</div>

<div class="doc" id="doc"><div class="empty">스펙북을 선택하세요</div></div>

<script src="/ecorean-gate.js"></script>
<script>
(function(){
  var REF='gdcfqbdgubgpzusbtftf';
  var API='https://'+REF+'.supabase.co/rest/v1';
  var ANON='sb_publishable_LU8lIQH-L5K8B1qwtezCUg_PkcCrAOQ';
  var state={books:[],book:null,items:[],mode:'site'};
  function token(){var s=window.ECOREAN_AUTH&&window.ECOREAN_AUTH.session;return s&&s.access_token?s.access_token:null;}
  function hdr(){return {apikey:ANON,Authorization:'Bearer '+(token()||ANON),'Content-Type':'application/json'};}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
  function won(n){return n==null?'—':'₩'+Number(n).toLocaleString('ko-KR');}
  function api(p,o){return fetch(API+p,Object.assign({headers:hdr()},o||{})).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,120));});
    return r.text().then(function(t){return t?JSON.parse(t):null;});});}

  function qsBook(){try{return new URL(location.href).searchParams.get('book');}catch(e){return null;}}

  function loadBooks(){
    return api('/spec_books?select=*&order=updated_at.desc').then(function(rows){
      state.books=rows||[];
      var want=qsBook()||localStorage.getItem('ecorean_specbook_current');
      state.book=state.books.find(function(b){return b.id===want;})||state.books[0]||null;
      var sel=document.getElementById('bookSel');
      sel.innerHTML=state.books.length
        ? state.books.map(function(b){return '<option value="'+b.id+'"'+(state.book&&b.id===state.book.id?' selected':'')+'>'+esc(b.name)+'</option>';}).join('')
        : '<option>스펙북 없음 — 도감에서 담아주세요</option>';
      document.getElementById('siteAddr').value=state.book&&state.book.site_addr?state.book.site_addr:'';
      return loadItems();
    });
  }
  function loadItems(){
    if(!state.book){render();return Promise.resolve();}
    return api('/spec_book_items?book_id=eq.'+state.book.id+'&select=*&order=sort,created_at').then(function(rows){
      state.items=rows||[];render();
    });
  }

  function render(){
    var doc=document.getElementById('doc');
    if(!state.book){doc.innerHTML='<div class="empty">스펙북이 없습니다 — 도감에서 [+ 스펙북 담기]로 시작하세요</div>';return;}
    var internal=state.mode==='site';
    var today=new Date();
    var dstr=today.getFullYear()+'. '+(today.getMonth()+1)+'. '+today.getDate()+'.';
    // 공간별 그룹
    var groups={};
    state.items.forEach(function(it){var k=it.location||'위치 미지정';(groups[k]=groups[k]||[]).push(it);});
    var order=Object.keys(groups).sort(function(a,b){return a==='위치 미지정'?1:b==='위치 미지정'?-1:a.localeCompare(b,'ko');});

    var html='<div class="cover"><div>'
      +'<div class="brand">E C O R E A N</div>'
      +'<h1>'+esc(state.book.name)+'<br>자재 스펙북</h1>'
      +'<div class="sub">'+(state.book.site_addr?esc(state.book.site_addr)+'<br>':'')
      +'작성일 '+dstr+' · 품목 '+state.items.length+'건'
      +(state.book.created_by?'<br>작성 '+esc(state.book.created_by):'')+'</div>'
      +'<span class="badge">'+(internal?'현장·발주용 (단가 포함)':'고객 제안용')+'</span>'
      +'</div><div class="sub" style="font-size:12px">건축부터 리모델링까지, 설계·시공 전문 — ECOREAN · 1588-9291</div></div>';

    order.forEach(function(loc){
      html+='<div class="sec"><h2>'+esc(loc)+' <span style="color:#999;font-size:12px;font-weight:400">'+groups[loc].length+'품목</span></h2>';
      groups[loc].forEach(function(it){
        var media=it.img_url?'<img src="'+esc(it.img_url)+'" loading="lazy">':'<div class="ph">'+esc(it.brand||it.name)+'</div>';
        html+='<div class="item">'+media+'<table>'
          +'<tr><td colspan="2" class="nm">'+esc(it.name)+'</td></tr>'
          +'<tr><th>브랜드</th><td>'+esc(it.brand||'—')+'</td></tr>'
          +'<tr><th>분류</th><td>'+esc(it.category||'—')+'</td></tr>'
          +(it.spec?'<tr><th>규격·코드</th><td>'+esc(it.spec)+'</td></tr>':'')
          +'<tr><th>수량</th><td>'+(it.qty!=null?it.qty+' '+esc(it.qty_unit||''):'현장 실측')+'</td></tr>'
          +(internal?'<tr><th>공급처</th><td>'+esc(it.supplier||'—')+'</td></tr>':'')
          +(internal?'<tr><th>참고 단가</th><td>'+won(it.price)+'</td></tr>':'')
          +(it.note?'<tr><th>비고</th><td>'+esc(it.note)+'</td></tr>':'')
          +'</table></div>';
      });
      html+='</div>';
    });

    // 총괄표
    html+='<div class="sum"><h2>총괄표'+(internal?' · 발주 체크리스트':'')+'</h2><table><thead><tr>'
      +'<th>위치</th><th>품명</th><th>브랜드</th><th>규격</th><th>수량</th>'
      +(internal?'<th>공급처</th><th class="r">참고 단가</th>':'')+'</tr></thead><tbody>';
    order.forEach(function(loc){groups[loc].forEach(function(it){
      html+='<tr><td>'+esc(loc)+'</td><td>'+esc(it.name)+'</td><td>'+esc(it.brand||'')+'</td><td>'+esc(it.spec||'')+'</td>'
        +'<td>'+(it.qty!=null?it.qty+' '+esc(it.qty_unit||''):'실측')+'</td>'
        +(internal?'<td>'+esc(it.supplier||'')+'</td><td class="r">'+won(it.price)+'</td>':'')+'</tr>';
    });});
    html+='</tbody></table></div>';
    html+='<div class="foot">※ 본 스펙북의 이미지·규격은 제조사 자료 기준이며, 실제 색상·질감은 실물 샘플로 최종 확인이 필요합니다.'
      +(internal?'<br>※ 참고 단가는 작성 시점 기준 내부 참고용입니다 — 발주 전 공급처 최신 단가 확인.':'<br>※ 자재 단가와 시공 견적은 담당자가 별도 안내드립니다.')
      +'<br>© ECOREAN · ecorean.net</div>';
    doc.innerHTML=html;
  }

  document.getElementById('bookSel').addEventListener('change',function(e){
    state.book=state.books.find(function(b){return b.id===e.target.value;})||null;
    if(state.book) localStorage.setItem('ecorean_specbook_current',state.book.id);
    document.getElementById('siteAddr').value=state.book&&state.book.site_addr?state.book.site_addr:'';
    loadItems();
  });
  document.getElementById('siteAddr').addEventListener('change',function(e){
    if(!state.book) return;
    var v=e.target.value.trim()||null;
    api('/spec_books?id=eq.'+state.book.id,{method:'PATCH',body:JSON.stringify({site_addr:v,updated_at:new Date().toISOString()})})
      .then(function(){state.book.site_addr=v;render();}).catch(function(){});
  });
  document.getElementById('vSite').onclick=function(){state.mode='site';this.classList.add('on');document.getElementById('vClient').classList.remove('on');render();};
  document.getElementById('vClient').onclick=function(){state.mode='client';this.classList.add('on');document.getElementById('vSite').classList.remove('on');render();};
  document.getElementById('printBtn').onclick=function(){window.print();};

  /* ── 2단계: 공급처별 발주서 자동 생성 (work_purchase_orders 초안) ── */
  document.getElementById('poBtn').onclick=function(){
    if(!state.book||!state.items.length){alert('발주할 품목이 없습니다.');return;}
    var groups={};
    state.items.forEach(function(it){var k=it.supplier||'공급처 미지정';(groups[k]=groups[k]||[]).push(it);});
    var names=Object.keys(groups);
    var plan=names.map(function(s){return '· '+s+' — '+groups[s].length+'품목';}).join('\n');
    if(!confirm('공급처별로 발주서 초안 '+names.length+'건을 생성합니다:\n\n'+plan+'\n\n수량·단가 미입력 품목은 0으로 들어가며, 발주서 화면에서 수정 후 발주하세요.')) return;
    var uid=window.ECOREAN_AUTH&&window.ECOREAN_AUTH.session&&window.ECOREAN_AUTH.session.user?window.ECOREAN_AUTH.session.user.id:null;
    var now=new Date();
    var ymd=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
    var hm=String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var done=0, fails=[];
    var seq=0;
    var jobs=names.map(function(sup){
      seq++;
      var items=groups[sup].map(function(it){
        var qty=(it.qty!=null&&isFinite(it.qty))?Number(it.qty):0;
        var price=(it.price!=null&&isFinite(it.price))?Math.round(it.price):0;
        return {
          name:(it.location?'['+it.location+'] ':'')+it.name,
          spec:it.spec||'', unit:it.qty_unit||'',
          qty:qty, unit_price:price, amount:Math.round(qty*price)
        };
      });
      var supply=items.reduce(function(a,i){return a+i.amount;},0);
      var row={
        po_no:'PO-'+ymd+'-SB'+hm+String(seq),
        vendor_name:sup,
        order_date:todayStr,
        delivery_place:state.book.site_addr||null,
        items:items,
        supply_amount:supply,
        vat_amount:Math.round(supply*0.1),
        status:'작성중',
        memo:'스펙북 「'+state.book.name+'」에서 자동 생성 ('+todayStr+')',
        created_by:uid
      };
      return api('/work_purchase_orders',{method:'POST',body:JSON.stringify(row)})
        .then(function(){done++;})
        .catch(function(e){fails.push(sup+': '+e.message);});
    });
    Promise.all(jobs).then(function(){
      if(fails.length) alert('발주서 '+done+'건 생성, 실패 '+fails.length+'건:\n'+fails.join('\n'));
      else if(confirm('발주서 초안 '+done+'건이 생성되었습니다.\n직원 포털 발주서 화면으로 이동할까요?')) location.href='/work/#po';
    });
  };

  loadBooks().catch(function(){document.getElementById('doc').innerHTML='<div class="empty">불러오기 실패 — 로그인 상태를 확인해 주세요 (/hub 새로고침 후 재시도)</div>';});
})();
</script>
</body>
</html>
