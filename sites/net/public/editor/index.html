<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:#0a0b10;color:#e8e8ec;font-size:12px}
#app{display:flex;flex-direction:column;height:100vh}

/* TOP BAR */
#topbar{height:50px;display:flex;align-items:center;padding:0 16px;background:#13141a;border-bottom:1px solid #23252e;gap:8px;flex-shrink:0;z-index:100}
.logo{font-family:'Cormorant Garamond',serif;font-size:19px;color:#d4af37;letter-spacing:2.5px;font-weight:600}
.logo small{color:#666;font-size:9px;letter-spacing:3px;margin-left:6px;font-family:'DM Sans',sans-serif;font-weight:400}
.spacer{flex:1}
.btn{padding:6px 11px;font-size:11px;background:transparent;border:1px solid #2e3038;border-radius:5px;color:#bbb;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:all 0.15s;white-space:nowrap}
.btn:hover{background:#1c1d24;border-color:#3e4048;color:#fff}
.btn.pri{background:#d4af37;color:#000;border-color:#d4af37;font-weight:500}
.btn.pri:hover{background:#e6c149}
.btn i{font-size:13px}
.btn-sm{padding:4px 8px;font-size:10px}

.dev-toggle{display:inline-flex;background:#1c1d24;border-radius:5px;overflow:hidden;border:1px solid #2e3038}
.dev-toggle button{padding:5px 9px;background:transparent;border:none;color:#888;cursor:pointer;font-size:12px}
.dev-toggle button.on{background:#2e3038;color:#d4af37}

/* MAIN LAYOUT */
#main{display:flex;flex:1;overflow:hidden;min-height:0;user-select:none}
.resize-handle{width:4px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;z-index:50;transition:background 0.15s}
.resize-handle:hover,.resize-handle.dragging{background:#d4af3766}

/* LEFT PANEL */
#left{width:220px;min-width:160px;max-width:380px;background:#13141a;border-right:1px solid #23252e;display:flex;flex-direction:column;flex-shrink:0}
.left-tabs{display:flex;border-bottom:1px solid #23252e;flex-shrink:0}
.left-tab{flex:1;padding:9px 6px;font-size:10px;background:transparent;border:none;color:#666;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:inherit;border-bottom:2px solid transparent}
.left-tab.on{color:#d4af37;border-bottom-color:#d4af37}
.left-content{flex:1;overflow-y:auto;padding:12px}

.panel-title{font-size:9px;text-transform:uppercase;letter-spacing:1.8px;color:#666;margin:12px 0 7px;padding-bottom:5px;border-bottom:1px solid #1f2027;display:flex;justify-content:space-between;align-items:center}
.panel-title:first-child{margin-top:0}
.panel-title small{font-weight:normal;color:#444;letter-spacing:0.5px;text-transform:none}

.comp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.comp-item{padding:9px 5px;background:#1a1b22;border:1px solid #23252e;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;color:#aaa;text-align:center;transition:all 0.12s;line-height:1.2}
.comp-item:hover{background:#23252e;border-color:#d4af3766;color:#fff;transform:translateY(-1px)}
.comp-item i{font-size:16px;color:#d4af37}

.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.theme-sw{padding:5px 3px;background:#1a1b22;border:1.5px solid #23252e;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;transition:border-color 0.15s}
.theme-sw.on{border-color:#d4af37}
.theme-sw-bar{display:flex;gap:1.5px}
.theme-sw-bar span{width:7px;height:7px;border-radius:2px}
.theme-sw-name{font-size:8px;color:#999}

.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.style-sw{padding:6px 4px;background:#1a1b22;border:1.5px solid #23252e;border-radius:4px;cursor:pointer;font-size:9.5px;text-align:center;color:#aaa;transition:all 0.12s}
.style-sw:hover{border-color:#3e4048;color:#fff}
.style-sw.on{border-color:#d4af37;color:#fff;background:#23252e}

.color-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.color-row .clr-label{font-size:10px;color:#999;width:62px;flex-shrink:0;text-transform:capitalize}
.color-picker{width:26px;height:24px;border:1px solid #23252e;border-radius:3px;cursor:pointer;background:#1a1b22;padding:1px;flex-shrink:0}
.color-picker::-webkit-color-swatch{border:none;border-radius:2px}
.color-picker::-moz-color-swatch{border:none;border-radius:2px}
.hex-input{flex:1;padding:4px 7px;background:#1a1b22;border:1px solid #23252e;border-radius:3px;color:#fff;font-size:10px;font-family:'Courier New',monospace}
.hex-input:focus{outline:none;border-color:#d4af37}

.slider-row{display:flex;align-items:center;gap:6px;padding:3px 0;margin-bottom:4px}
.slider-row .slr-label{font-size:10px;color:#999;width:62px;flex-shrink:0}
.slider-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:#23252e;border-radius:2px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:#d4af37;border-radius:50%;cursor:pointer}
.slider-row input[type=range]::-moz-range-thumb{width:12px;height:12px;background:#d4af37;border-radius:50%;cursor:pointer;border:none}
.slider-val{font-size:10px;color:#888;min-width:32px;text-align:right;font-family:'Courier New',monospace}

.text-input{padding:5px 7px;background:#1a1b22;border:1px solid #23252e;border-radius:3px;color:#fff;font-size:10.5px;font-family:inherit;width:100%}
.text-input:focus{outline:none;border-color:#d4af37}
.text-area{padding:6px 8px;background:#1a1b22;border:1px solid #23252e;border-radius:3px;color:#fff;font-size:10.5px;font-family:inherit;width:100%;resize:vertical;min-height:50px}
.text-area:focus{outline:none;border-color:#d4af37}

.toggle{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:10.5px;color:#bbb;cursor:pointer}
.toggle input{width:28px;height:14px;-webkit-appearance:none;background:#23252e;border-radius:7px;position:relative;cursor:pointer;transition:background 0.15s}
.toggle input:checked{background:#d4af37}
.toggle input::before{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:#fff;border-radius:50%;transition:left 0.15s}
.toggle input:checked::before{left:16px}
.toggle span{flex:1}

.row{display:flex;gap:5px;align-items:center;margin-bottom:5px}
.row .lbl{font-size:10px;color:#999;width:62px;flex-shrink:0}

/* CENTER CANVAS */
#canvas-wrap{flex:1;overflow:auto;background:#1a1b21;display:flex;justify-content:center;align-items:flex-start;padding:16px;position:relative}
.canvas-frame{background:#000;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,0.5);overflow:hidden;position:relative;transition:width 0.3s;width:100%}
.canvas-frame.desktop{max-width:1200px;min-height:760px}
.canvas-frame.tablet{width:768px;max-width:768px;min-height:760px}
.canvas-frame.mobile{width:375px;max-width:375px;min-height:680px}

#canvas-bg{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none}
#stars-canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
#canvas{min-height:760px;position:relative;overflow:visible}
#canvas.empty::before{content:'← 좌측에서 컴포넌트를 클릭하여 시작하세요';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#3a3c44;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;letter-spacing:1px;pointer-events:none;white-space:nowrap;background:#13141a88;padding:16px 28px;border-radius:8px;border:1px dashed #2a2c34}

.bld-el{position:relative;outline:1px dashed transparent;outline-offset:-1px;transition:outline 0.1s;z-index:2}
.bld-el:hover{outline:1px dashed #d4af3788}
.bld-el.selected{outline:2px solid #d4af37!important;outline-offset:-2px;z-index:10}
.bld-el.selected::after{content:attr(data-type);position:absolute;top:-21px;left:0;background:#d4af37;color:#000;font-size:9px;padding:2px 8px;border-radius:3px 3px 3px 0;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;z-index:1000;white-space:nowrap;font-family:'DM Sans',sans-serif}
.bld-el.dragging{opacity:0.35;transform:scale(0.98)}
.bld-el.drag-over-top{border-top:3px solid #d4af37!important}
.bld-el.drag-over-bottom{border-bottom:3px solid #d4af37!important}
.bld-el.has-glass{backdrop-filter:var(--el-blur);-webkit-backdrop-filter:var(--el-blur)}
.el-ctrl{position:absolute;top:-25px;right:0;display:none;gap:1px;z-index:1001}
.bld-el.selected .el-ctrl{display:flex}
.el-ctrl button{width:21px;height:21px;background:#d4af37;border:none;border-radius:3px;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif}
.el-ctrl button:hover{background:#fff}
.el-ctrl button i{font-size:11px}

/* GRID LAYOUT (12-column) */
#canvas.grid-on{display:grid;grid-template-columns:repeat(12,1fr);align-items:start;row-gap:0}
.bld-el.cell>*:not(.el-ctrl):not(.el-bg-img):not(.rsz):not(.gw-badge){margin-left:0!important;margin-right:0!important;max-width:none!important}
.rsz{position:absolute;top:0;bottom:0;width:12px;cursor:col-resize;z-index:1002;display:none;align-items:center;justify-content:center}
.bld-el.selected .rsz{display:flex}
.rsz.l{left:-6px}.rsz.r{right:-6px}
.rsz{touch-action:none}
.rsz.b{top:auto;left:30%;right:30%;bottom:-7px;width:auto;height:14px;cursor:ns-resize}
.rsz.b::after{width:60%;max-width:90px;min-width:28px;height:4px;max-height:none;min-height:0}
.rsz::after{content:'';width:4px;height:60%;max-height:80px;min-height:24px;background:#d4af37;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,0.6)}
.gw-badge{position:absolute;top:-21px;left:62px;background:#1c1d24;border:1px solid #d4af37;color:#d4af37;font-size:9px;padding:2px 7px;border-radius:3px;z-index:1001;display:none;font-family:'DM Sans',sans-serif;letter-spacing:0.5px;pointer-events:none}
.bld-el.selected .gw-badge{display:block}

/* FREE LAYOUT (자유 배치 + 줄자 + 자석 스냅) */
#canvas.free-on{display:block!important}
.free-on .bld-el{position:absolute!important;cursor:move}
.free-on .rsz,.free-on .gw-badge{display:none!important}
#free-guides{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9990}
.fg-line{position:absolute}
.fg-vline{width:1px;top:0;bottom:0;background:#d4af37;box-shadow:0 0 4px #d4af37aa}
.fg-hline{height:1px;left:0;right:0;background:#d4af37;box-shadow:0 0 4px #d4af37aa}
.fg-badge{position:absolute;background:#13141aee;border:1px solid #d4af37;color:#d4af37;font-size:10px;padding:3px 7px;border-radius:4px;font-family:'DM Sans',sans-serif;white-space:nowrap;pointer-events:none;z-index:9993}
/* 눈금자 하이라이트: 드래그 요소의 폭/높이 구간 + 끝값 */
.rl-band{position:absolute;background:#d4af3733;box-sizing:border-box;z-index:9991}
.rl-bt{top:0;height:15px;border-left:1px solid #d4af37;border-right:1px solid #d4af37}
.rl-bl{left:0;width:15px;border-top:1px solid #d4af37;border-bottom:1px solid #d4af37}
.rl-val{position:absolute;background:#d4af37;color:#13141a;font-size:8px;font-weight:700;padding:0 3px;border-radius:2px;font-family:'DM Sans',sans-serif;white-space:nowrap;pointer-events:none;line-height:1.5;z-index:9992}
/* 인접 간격(gap) 측정선: 시안=일반 거리, 마젠타(.eq)=동일간격 스냅 */
.fg-gap{position:absolute;background:#22d3ee;z-index:9991}
.fg-gap.eq{background:#e879f9}
.fg-gh{height:1px}
.fg-gh::before,.fg-gh::after{content:'';position:absolute;top:-3px;width:1px;height:7px;background:inherit}
.fg-gh::before{left:0}.fg-gh::after{right:0}
.fg-gv{width:1px}
.fg-gv::before,.fg-gv::after{content:'';position:absolute;left:-3px;height:1px;width:7px;background:inherit}
.fg-gv::before{top:0}.fg-gv::after{bottom:0}
.fg-gaplabel{position:absolute;transform:translate(-50%,-50%);background:#22d3ee;color:#062a30;font-weight:700;font-size:9px;padding:1px 5px;border-radius:3px;font-family:'DM Sans',sans-serif;white-space:nowrap;pointer-events:none;z-index:9992}
.fg-gaplabel.eq{background:#e879f9;color:#3b0764}
.ruler{position:absolute;background:#13141acc;z-index:9985;pointer-events:none;font-family:'DM Sans',sans-serif;font-size:8px;color:#666;overflow:hidden}
#ruler-top{top:0;left:0;right:0;height:15px;border-bottom:1px solid #23252e}
#ruler-left{top:0;left:0;bottom:0;width:15px;border-right:1px solid #23252e}

/* RIGHT PANEL */
#right{width:270px;min-width:200px;max-width:420px;background:#13141a;border-left:1px solid #23252e;display:flex;flex-direction:column;flex-shrink:0}
.right-tabs{display:flex;border-bottom:1px solid #23252e;flex-shrink:0}
.right-tab{flex:1;padding:9px 4px;font-size:9.5px;background:transparent;border:none;color:#666;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:inherit;border-bottom:2px solid transparent}
.right-tab.on{color:#d4af37;border-bottom-color:#d4af37}
.right-content{flex:1;overflow-y:auto;padding:12px}

.empty-prop{padding:20px 10px;text-align:center;color:#555;font-size:11px;border:1px dashed #23252e;border-radius:5px}
.prop-info{padding:8px 11px;background:#1a1b22;border-radius:4px;border-left:3px solid #d4af37;margin-bottom:10px}
.prop-info-label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1.5px}
.prop-info-name{font-size:12px;color:#fff;font-weight:500;margin-top:2px}

.layer-list{display:flex;flex-direction:column;gap:2px;max-height:none;overflow-y:auto}
.layer-item{display:flex;align-items:center;gap:6px;padding:5px 7px;background:#1a1b22;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:10px;color:#aaa;transition:all 0.1s}
.layer-item:hover{background:#23252e;color:#fff}
.layer-item.on{border-color:#d4af37;color:#d4af37;background:#23252e}
.layer-item i{font-size:11px;color:#d4af37}
.layer-item .layer-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-act{background:transparent;border:none;color:#666;cursor:pointer;padding:0;font-size:11px}
.layer-act:hover{color:#fff}

.btn-reset{font-size:9px;color:#666;background:none;border:none;cursor:pointer;text-decoration:underline}
.btn-reset:hover{color:#d4af37}

/* STATUS BAR */
#statusbar{height:22px;background:#13141a;border-top:1px solid #23252e;display:flex;align-items:center;padding:0 14px;font-size:9.5px;color:#666;gap:14px;flex-shrink:0}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:5000;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-box{background:#13141a;border:1px solid #23252e;border-radius:8px;padding:18px;max-width:900px;width:100%;max-height:80vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #23252e}
.modal-head strong{font-family:'Cormorant Garamond',serif;font-size:16px;color:#d4af37;letter-spacing:1.5px}
.modal-close{background:transparent;border:none;color:#888;cursor:pointer;font-size:20px;line-height:1}
.code-display{background:#0a0a0d;border-radius:5px;padding:12px;font-family:'Courier New',monospace;font-size:10px;line-height:1.5;white-space:pre-wrap;word-break:break-all;overflow-y:auto;flex:1;color:#bbb;border:1px solid #1c1d23}

.mini-toolbar{position:fixed;background:#13141a;border:1px solid #2e3038;border-radius:6px;padding:4px;display:flex;gap:2px;box-shadow:0 4px 16px rgba(0,0,0,0.5);z-index:2000;transition:opacity 0.15s}
.mini-toolbar button{width:26px;height:26px;background:transparent;border:none;color:#aaa;cursor:pointer;border-radius:4px;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.mini-toolbar button:hover{background:#23252e;color:#fff}
.mini-toolbar .sep{width:1px;background:#23252e;margin:2px 1px}
.locked-overlay{position:absolute;inset:0;z-index:100;cursor:not-allowed}
.bld-el.hidden{opacity:0.2}
.layer-item .layer-badge{font-size:9px;padding:1px 4px;border-radius:2px;margin-left:4px}
.layer-item .layer-badge.locked{background:#d4af3733;color:#d4af37}
.layer-item .layer-badge.hidden{background:#66666633;color:#888}
.color-swatch-saved{width:18px;height:18px;border-radius:3px;border:1px solid #23252e;cursor:pointer;flex-shrink:0}
.color-swatch-saved:hover{transform:scale(1.2);z-index:1}
.saved-palette{display:flex;flex-wrap:wrap;gap:3px;padding:4px 0}
.inline-edit:focus{outline:2px solid #d4af37 !important;outline-offset:2px;cursor:text}
.preview-mode .bld-el{outline:none!important}
.preview-mode .bld-el::after,.preview-mode .el-ctrl{display:none!important}
.preview-mode #canvas.empty::before{display:none}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0f1015}
::-webkit-scrollbar-thumb{background:#23252e;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3c44}

@keyframes au{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes np{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes shimmer{0%{transform:translateX(-150%) skewX(-15deg)}100%{transform:translateX(250%) skewX(-15deg)}}

/* 모바일 패널 드로어 토글 — 에디터 로직과 무관한 독립 스크립트 */
(function(){
  var L=document.getElementById('btn-mob-left'),R=document.getElementById('btn-mob-right'),B=document.getElementById('m-backdrop');
  if(!L||!R||!B)return;
  function close(){document.body.classList.remove('m-left-open','m-right-open');}
  L.addEventListener('click',function(){var o=document.body.classList.contains('m-left-open');close();if(!o)document.body.classList.add('m-left-open');});
  R.addEventListener('click',function(){var o=document.body.classList.contains('m-right-open');close();if(!o)document.body.classList.add('m-right-open');});
  B.addEventListener('click',close);
  /* 컴포넌트를 캔버스에 추가하면 드로어 자동 닫기 */
  var lc=document.getElementById('left-content');
  if(lc)lc.addEventListener('click',function(e){if(window.innerWidth<=900&&e.target.closest('.comp-item'))close();});
})();
</script>

// ── 2026-08-23 저장 안정화 ──
// (A) 업로드 이미지 자동 압축: 4~8MB 원본이 그대로 base64 로 들어가 localStorage(5MB 한도)와
//     서버 저장 페이로드를 터뜨리던 근본 원인. 긴 변 1600px + JPEG 0.85 로 통상 1/10 크기.
function compressImage(file,cb){
  const isPng=/png$/i.test(file.type);
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1600;
      let w=img.naturalWidth,h=img.naturalHeight;
      const scale=Math.min(1,MAX/Math.max(w,h));
      // 작고(<400KB) 축소도 불필요하면 원본 유지
      if(scale>=1&&file.size<400*1024){cb(ev.target.result);return;}
      w=Math.round(w*scale);h=Math.round(h*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
      let out;
      if(isPng){
        // 투명 픽셀이 있으면 PNG 유지, 아니면 JPEG
        const d=ctx.getImageData(0,0,Math.min(w,64),Math.min(h,64)).data;
        let alpha=false;for(let i=3;i<d.length;i+=16){if(d[i]<250){alpha=true;break;}}
        out=alpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.85);
      }else out=cv.toDataURL('image/jpeg',0.85);
      // 압축이 오히려 커지면 원본 사용
      cb(out.length<ev.target.result.length?out:ev.target.result);
    };
    img.onerror=()=>cb(ev.target.result);
    img.src=ev.target.result;
  };
  rd.readAsDataURL(file);
}
// (B) IndexedDB 문서 저장소: localStorage 5MB 한도 때문에 이미지 포함 문서가 소리 없이
//     저장 실패하던 문제 해결 (수백 MB 까지 안전). localStorage 는 소형 설정 미러로만.
const IDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('ecorean-editor',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('docs');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  set(key,val){return this.open().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('docs','readwrite');tx.objectStore('docs').put(val,key);
    tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>{db.close();rej(tx.error);};}));},
  get(key){return this.open().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('docs','readonly');const q=tx.objectStore('docs').get(key);
    q.onsuccess=()=>{db.close();res(q.result);};q.onerror=()=>{db.close();rej(q.error);};}));},
};

  Object.assign(S,h);
  S.selectedId=null;
  renderAll();
}
function redo(){
  if(S.historyIdx>=S.history.length-1)return;
  S.historyIdx++;
  const h=clone(S.history[S.historyIdx]);
  Object.assign(S,h);
  S.selectedId=null;
  renderAll();
}
function copyEl(){
  if(!S.selectedId)return;
  const el=activePage().elements.find(e=>e.id===S.selectedId);
  if(el) clipboard=clone(el);
}
function pasteEl(){
  if(!clipboard)return;
  const ne=clone(clipboard);
  ne.id=newId();
  if(ne._objUrl)delete ne._objUrl; // don't copy object URLs
  activePage().elements.push(ne);
  S.selectedId=ne.id;
  pushHist();renderAll();
}

function shadowCss(preset,c){
  if(!preset||preset==='auto')preset=S.shadowDefault;
  let css=SHADOW_PRESETS[preset]?.css||'none';
  return css.replace(/var\(--ac\)/g,c.accent);
}

function getShineOpacity(style){
  const none=['ghost-text','underline','gradient-border','retro-3d','minimal','solid','outline'];

  return 0.10;
}

// ── 글래스 효과 모양 8종(입체감) — 단일 소스 ──
const GLASS_SHAPES={
  frost:'프로스트', water:'💧 물방울', crystal:'💎 크리스탈', bubble:'🫧 볼록버블',
  pearl:'⚪ 진주', aqua:'🌊 아쿠아', diamond:'✦ 다이아', inset:'◖ 오목(눌림)', custom:'🎛 커스텀'
};
// shape별 글래스 CSS 선언 배열. box-shadow는 inset(입체) 위주 → 그림자/글로우와 합성됨.
// custom 은 el.effects(e)의 사용자 파라미터(틴트/투명도/하이라이트/깊이/테두리)로 생성.
function glassDecls(shape,op,blur,e){
  const bf=[`backdrop-filter:blur(${blur}px) saturate(180%)`,`-webkit-backdrop-filter:blur(${blur}px) saturate(180%)`];
  const o=v=>Math.max(0,Math.min(1,v));
  if(shape==='custom'){
    const tint=(e&&e.glassTint)||'#ffffff';
    const cop=o((e&&e.glassOp!==undefined?e.glassOp:Math.round(op*100))/100);
    const hi=o((e&&e.glassHi!==undefined?e.glassHi:50)/100);
    const dp=o((e&&e.glassDepth!==undefined?e.glassDepth:30)/100);
    const bd=o((e&&e.glassBorder!==undefined?e.glassBorder:25)/100);
    const ah=Math.round(cop*255).toString(16).padStart(2,'0');
    return [`background:${tint}${ah}`,...bf,`border:1px solid rgba(255,255,255,${bd.toFixed(2)})`,`box-shadow:inset 0 4px 9px rgba(255,255,255,${hi.toFixed(2)}),inset 0 -5px 10px rgba(0,0,0,${dp.toFixed(2)}),inset 0 0 0 1px rgba(255,255,255,${(bd*0.5).toFixed(2)}),0 12px 30px rgba(0,0,0,0.4)`];
  }
  switch(shape){
    case 'water':return [`background:linear-gradient(180deg,rgba(255,255,255,${o(op+0.10)}),rgba(255,255,255,${op}) 42%,rgba(255,255,255,${o(op-0.03)}))`,...bf,`border:1px solid rgba(255,255,255,0.35)`,`box-shadow:inset 0 3px 8px rgba(255,255,255,0.6),inset 0 -4px 8px rgba(0,0,0,0.25),inset 0 0 0 1px rgba(255,255,255,0.15),0 12px 30px rgba(0,0,0,0.45)`];
    case 'crystal':return [`background:linear-gradient(180deg,rgba(255,255,255,0.35),rgba(180,210,240,0.12) 50%,rgba(120,160,210,0.18))`,...bf,`border:1px solid rgba(255,255,255,0.4)`,`box-shadow:inset 0 2px 4px rgba(255,255,255,0.7),inset 0 -2px 6px rgba(0,40,100,0.3),inset 0 0 22px rgba(180,220,255,0.2),0 10px 30px rgba(0,40,100,0.4)`];
    case 'bubble':return [`background:radial-gradient(125% 90% at 30% 16%,rgba(255,255,255,0.5),rgba(255,255,255,${op}) 46%,rgba(255,255,255,${o(op-0.02)}))`,...bf,`border:1px solid rgba(255,255,255,0.3)`,`box-shadow:inset 0 4px 10px rgba(255,255,255,0.55),inset 0 -6px 12px rgba(0,0,0,0.22),0 14px 34px rgba(0,0,0,0.4)`];
    case 'pearl':return [`background:linear-gradient(180deg,rgba(255,248,250,0.6),rgba(240,225,235,0.25) 60%,rgba(210,195,215,0.3))`,...bf,`border:1px solid rgba(255,255,255,0.5)`,`box-shadow:inset 0 3px 6px rgba(255,255,255,0.8),inset 0 -2px 5px rgba(180,150,170,0.35),inset 0 0 18px rgba(255,225,235,0.4),0 10px 26px rgba(120,90,110,0.35)`];
    case 'aqua':return [`background:linear-gradient(180deg,rgba(150,220,255,0.4),rgba(40,120,200,0.2) 50%,rgba(10,60,130,0.28))`,...bf,`border:1px solid rgba(170,220,255,0.45)`,`box-shadow:inset 0 3px 8px rgba(220,245,255,0.6),inset 0 -4px 8px rgba(0,30,80,0.4),inset 0 0 24px rgba(80,170,255,0.22),0 12px 30px rgba(10,50,120,0.45)`];
    case 'diamond':return [`background:linear-gradient(135deg,rgba(255,255,255,0.45),rgba(255,255,255,0.08) 40%,rgba(255,255,255,0.3) 70%,rgba(255,255,255,0.06))`,...bf,`border:1px solid rgba(255,255,255,0.55)`,`box-shadow:inset 0 2px 3px rgba(255,255,255,0.9),inset 0 -2px 3px rgba(0,0,0,0.3),inset 2px 0 4px rgba(255,255,255,0.3),inset -2px 0 4px rgba(0,0,0,0.2),0 10px 28px rgba(0,0,0,0.45)`];
    case 'inset':return [`background:rgba(255,255,255,${o(op-0.02)||0.02})`,...bf,`border:1px solid rgba(255,255,255,0.12)`,`box-shadow:inset 0 6px 12px rgba(0,0,0,0.4),inset 0 -3px 8px rgba(255,255,255,0.18),0 2px 4px rgba(255,255,255,0.05)`];
    case 'frost':default:return [`background:rgba(255,255,255,${op})`,...bf,`border:1px solid rgba(255,255,255,0.22)`,`box-shadow:inset 0 2px 6px rgba(255,255,255,0.35),inset 0 -2px 4px rgba(0,0,0,0.2),0 10px 32px rgba(0,0,0,0.45)`];
  }
}

// 요소 효과 단일 소스: glass(8모양)+gradient+shadow+glow+radius+opacity+rotate.
// box-shadow는 glass의 입체 그림자 + 드롭/글로우를 하나로 합성 → 그림자를 켜도 글래스 입체가 유지된다.
function effectDecls(el,c){
  const e=el.effects;
  if(!e)return [];
  const s=[];const shadows=[];
  if(e.glass){
    const blur=S.glassBlur||20,op=S.glassOpacity||0.06;
    glassDecls(e.glassShape||'frost',op,blur,e).forEach(d=>{
      if(d.startsWith('box-shadow:'))shadows.push(d.slice(11));
      else if(d.startsWith('border:')&&el.style?.border)return;  // 사용자 보더 우선
      else s.push(d);
    });
  }
  if(e.gradient){
    const g1=e.gColor1||c.accent,g2=e.gColor2||c.accent2,ang=e.gAngle||135;
    s.push(`background:linear-gradient(${ang}deg,${g1},${g2})`);  // glass 배경 위에 덮어씀
  }
  let drop='';
  if(e.shadow&&e.shadow!=='auto'&&e.shadow!=='none')drop=shadowCss(e.shadow,c);
  if(e.glow){
    const gs=e.glowSize||30,gc=e.glowColor||c.accent;
    drop=`0 0 ${gs}px ${gc}66, 0 0 ${gs*2}px ${gc}22${drop?','+drop:''}`;
  }
  if(drop)shadows.push(drop);
  if(shadows.length)s.push(`box-shadow:${shadows.join(',')}`);
  if(e.borderRadius)s.push(`border-radius:${e.borderRadius}px`);
  if(e.opacity!==undefined&&e.opacity!==1)s.push(`opacity:${e.opacity}`);
  if(e.rotate)s.push(`transform:rotate(${e.rotate}deg)`);
  return s;
}
function effectStyleStr(el,c){return effectDecls(el,c).join(';');}

// 래퍼(.bld-el / 내보내기 래퍼)의 전체 시각 스타일 단일 소스.
// = 효과(effectDecls) + 필터 + 변형(transform 통합) + 그라디언트 텍스트.
// 캔버스(applyFx)와 내보내기(buildExport)가 동일 문자열을 동일 위치(요소 래퍼)에 적용한다.
// card 는 elHTML 내부에서 자체적으로 글래스/그림자를 그리므로 래퍼 효과에서 제외한다.
function wrapperStyleStr(el,c){
  if(el.type==='card')return '';
  const e=el.effects||{},ex=el.styleEx||{};
  const decls=effectDecls(el,c).filter(d=>!d.startsWith('transform:'));
  // 필터
  const filters=[];
  if(ex.filterBlur)filters.push(`blur(${ex.filterBlur}px)`);
  if(ex.filterBright!==undefined&&ex.filterBright!==100)filters.push(`brightness(${ex.filterBright}%)`);
  if(ex.filterContrast!==undefined&&ex.filterContrast!==100)filters.push(`contrast(${ex.filterContrast}%)`);
  if(ex.filterSat!==undefined&&ex.filterSat!==100)filters.push(`saturate(${ex.filterSat}%)`);
  if(ex.filterGray)filters.push(`grayscale(${ex.filterGray}%)`);
  if(ex.filterSepia)filters.push(`sepia(${ex.filterSepia}%)`);
  if(ex.filterInvert)filters.push(`invert(${ex.filterInvert}%)`);
  if(filters.length)decls.push(`filter:${filters.join(' ')}`);
  // 변형: effects.rotate + styleEx(scale/rotate/skew) 을 하나의 transform 으로 통합
  const tf=[];
  if(ex.scale&&ex.scale!==1)tf.push(`scale(${ex.scale})`);
  const rot=(parseFloat(ex.rotate)||0)+(parseFloat(e.rotate)||0);
  if(rot)tf.push(`rotate(${rot}deg)`);
  if(ex.skewX)tf.push(`skewX(${ex.skewX}deg)`);
  if(ex.skewY)tf.push(`skewY(${ex.skewY}deg)`);
  if(tf.length)decls.push(`transform:${tf.join(' ')}`);
  // 그라디언트 텍스트
  if(ex.gradText){
    const g=`linear-gradient(${ex.gradAngle||90}deg,${ex.gradColor1||c.accent},${ex.gradColor2||c.text})`;
    decls.push(`background-image:${g}`,`-webkit-background-clip:text`,`background-clip:text`,`-webkit-text-fill-color:transparent`);
  }
  return decls.join(';');
}
// 배경이미지 오버레이 스타일 단일 소스 (캔버스 applyFx · 내보내기 buildExport 공유)
function bgOverlayStyle(el){
  const op=el.bgImageOpacity!==undefined?el.bgImageOpacity:1;
  const sz=el.bgImageSize||'cover',pos=el.bgImagePos||'center';
  return `position:absolute;inset:0;background-image:url(${el.bgImage});background-size:${sz};background-position:${pos};background-repeat:no-repeat;z-index:0;pointer-events:none;opacity:${op}`;
}
// 비디오 URL 종류 판별 단일 소스 (미리보기 elHTML · 내보내기 buildExport 공유)
function parseVideoUrl(url){
  const u=url||'';
  let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s?#]+)/);
  if(m)return {kind:'youtube',id:m[1]};
  m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m)return {kind:'vimeo',id:m[1]};
  if(u.match(/\.(mp4|webm|ogg|mov)(\?|$)/i)||u.includes('blob:')||u.startsWith('http'))return {kind:'mp4',id:u};
  return {kind:'none',id:''};
}

// ========== SVG 차트 ==========
function svgSpark(data,color){
  const pts=data.split(',').map(parseFloat);
  const mx=Math.max(...pts),mn=Math.min(...pts);
  const w=110,h=32;
  const path=pts.map((p,i)=>{
    const x=(i/(pts.length-1))*w;
    const y=h-((p-mn)/(mx-mn||1))*(h-4)-2;
    return (i===0?'M':'L')+` ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  const fill=path+` L ${w} ${h} L 0 ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:110px;height:32px"><path d="${fill}" fill="${color}22"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

function svgBars(data,color,c){
  const items=data.split(',').map(s=>{const[l,v]=s.split(':');return{l,v:parseFloat(v)}});
  const max=Math.max(...items.map(i=>i.v));
  const w=300,h=160;
  const bw=(w-60)/items.length-10;
  const bars=items.map((it,i)=>{
    const bh=(it.v/max)*(h-50);
    const x=30+i*(bw+10);
    const y=h-30-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${color}" rx="3" opacity="${1-i*0.1}"/>
<text x="${x+bw/2}" y="${h-12}" font-size="10" fill="${c.muted}" text-anchor="middle">${it.l}</text>
<text x="${x+bw/2}" y="${y-6}" font-size="10" fill="${c.text}" text-anchor="middle" opacity="0.8">${it.v}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:160px">${bars}</svg>`;
}

function svgDonut(data,c){
  const items=data.split(',').map(s=>{const[l,v]=s.split(':');return{l,v:parseFloat(v)}});
  const total=items.reduce((a,b)=>a+b.v,0);
  const cx=70,cy=70,r=50;
  let ang=-90;
  const cols=[c.accent,c.accent2,c.muted,c.border];
  let arcs='';
  items.forEach((it,i)=>{
    const a1=ang*Math.PI/180;
    ang+=(it.v/total)*360;
    const a2=ang*Math.PI/180;
    const large=(it.v/total)>0.5?1:0;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    arcs+=`<path d="M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${cols[i%4]}" opacity="${1-i*0.18}"/>`;
  });
  const legend=items.map((it,i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:11px;color:${c.text};line-height:1.6"><span style="width:10px;height:10px;background:${cols[i%4]};opacity:${1-i*0.18};border-radius:2px"></span><span style="flex:1">${it.l}</span><span style="color:${c.muted}">${Math.round(it.v/total*100)}%</span></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap"><svg viewBox="0 0 140 140" style="width:140px;height:140px;flex-shrink:0"><circle cx="${cx}" cy="${cy}" r="${r}" fill="transparent" stroke="${c.border}" stroke-width="0.5"/>${arcs}<circle cx="${cx}" cy="${cy}" r="26" fill="${c.bg}"/></svg><div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px">${legend}</div></div>`;
}

function svgLine(data,color,c){
  const pts=data.split(',').map(parseFloat);
  const mx=Math.max(...pts),mn=Math.min(...pts);
  const w=320,h=140;
  const path=pts.map((p,i)=>{
    const x=20+(i/(pts.length-1))*(w-40);
    const y=20+(1-(p-mn)/(mx-mn||1))*(h-50);
    return (i===0?'M':'L')+` ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  const fill=path+` L ${w-20} ${h-30} L 20 ${h-30} Z`;
  const dots=pts.map((p,i)=>{
    const x=20+(i/(pts.length-1))*(w-40);
    const y=20+(1-(p-mn)/(mx-mn||1))*(h-50);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px"><line x1="20" y1="${h-30}" x2="${w-20}" y2="${h-30}" stroke="${c.muted}33"/><path d="${fill}" fill="${color}22"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>`;
}

function svgGauge(value,color,c){
  const ang=value*1.8-90;
  const cx=70,cy=70,r=50;
  const rad=ang*Math.PI/180;
  const x=cx+r*Math.cos(rad),y=cy+r*Math.sin(rad);
  const large=value>50?1:0;
  return `<svg viewBox="0 0 140 90" style="width:140px;height:90px"><path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${c.border}" stroke-width="10" stroke-linecap="round"/><path d="M ${cx-r} ${cy} A ${r} ${r} 0 ${large} 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"/></svg>`;
}

// ========== 요소 HTML ==========
// 효과(글래스/그라데이션/글로우/그림자/필터/변형)를 컴포넌트 "자체"에 주입한다.
//  - 버튼/버튼그룹 → <button> 요소에만 적용 (바깥 래퍼가 아니라 버튼에)
//  - 그 외 → 컴포넌트 루트 요소(첫 style 속성)에 적용
//  - card → wrapperStyleStr이 ''을 반환하므로 주입 안 함(자체 글래스/그림자 유지)
function elHTML(el){
  let html=elHTMLCore(el);
  const fx=wrapperStyleStr(el,S.colors);
  if(!fx)return html;
  if(el.type==='button'||el.type==='button-group'){
    return html.replace(/<button style="([^"]*)"/g,(m,sty)=>`<button style="${sty};${fx}"`);
  }
  return html.replace(/style="([^"]*)"/,(m,sty)=>`style="${sty};${fx}"`);
}

function elHTMLCore(el){
  const c=S.colors,f=FONTS[S.font],r=S.radius,p=el.props||{};
  const cs=customStyleStr(el);

  switch(el.type){
    case 'nav':return `<nav style="display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:1px solid ${c.text}10;position:relative;z-index:5;${cs}"><span style="font-family:'${f.h}',serif;font-size:18px;letter-spacing:3px;color:${c.accent};font-weight:600">${p.logo}</span><div style="display:flex;gap:24px;font-size:11px;color:${c.muted};letter-spacing:1.5px;text-transform:uppercase"><span>${p.item1}</span><span>${p.item2}</span><span>${p.item3}</span></div></nav>`;
    case 'footer':return `<footer style="padding:60px 40px 30px;border-top:1px solid ${c.text}10;margin-top:60px;${cs}"><div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;max-width:1200px;margin:0 auto;padding-bottom:40px;border-bottom:1px solid ${c.text}10" data-grid-cols="4"><div><div style="font-family:'${f.h}',serif;font-size:22px;color:${c.accent};letter-spacing:3px;font-weight:600;margin-bottom:8px">${p.logo}</div><div style="font-size:12px;color:${c.muted};letter-spacing:0.5px">${p.tagline}</div></div>${[1,2,3].map(i=>`<div><div style="font-size:11px;color:${c.text};text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;font-weight:500">${p['c'+i+'t']}</div>${p['c'+i].split('|').map(l=>`<div style="font-size:12px;color:${c.muted};margin-bottom:6px">${l}</div>`).join('')}</div>`).join('')}</div><div style="max-width:1200px;margin:24px auto 0;font-size:10px;color:${c.muted};letter-spacing:1px;text-align:center">${p.copy}</div></footer>`;
    case 'divider':return `<div style="height:1px;background:${c.text}15;margin:24px 40px;${cs}"></div>`;
    case 'spacer':return `<div style="height:${p.height}px;${cs}"></div>`;
    case 'h1':return `<h1 style="font-family:'${f.h}',serif;font-size:clamp(36px,7vw,72px);line-height:1.05;letter-spacing:-0.02em;font-weight:400;margin:0;padding:14px 40px;color:${c.text};${cs}">${p.text}</h1>`;
    case 'h2':return `<h2 style="font-family:'${f.h}',serif;font-size:clamp(28px,4vw,44px);line-height:1.15;font-weight:400;margin:0;padding:12px 40px;color:${c.text};${cs}">${p.text}</h2>`;
    case 'h3':return `<h3 style="font-family:'${f.h}',serif;font-size:22px;line-height:1.3;font-weight:400;margin:0;padding:10px 40px;color:${c.text};${cs}">${p.text}</h3>`;
    case 'p':return `<p style="font-size:15px;line-height:1.75;color:${c.muted};margin:0;padding:10px 40px;max-width:680px;${cs}">${p.text}</p>`;
    case 'overline':return `<div style="padding:14px 40px;${cs}"><span style="display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:${c.accent};padding-bottom:6px;border-bottom:1px solid ${c.accent}40">${p.text}</span></div>`;
    case 'quote':return `<div style="padding:30px 60px;${cs}"><div style="font-family:'${f.h}',serif;font-size:24px;line-height:1.4;color:${c.text};font-style:italic;border-left:2px solid ${c.accent};padding-left:24px">"${p.text}"<div style="font-size:12px;font-family:'${f.b}',sans-serif;color:${c.muted};margin-top:14px;letter-spacing:1px;text-transform:uppercase;font-style:normal">— ${p.author}</div></div></div>`;
    case 'button':{
      const bS=S.btnStyle;
      const bR=p.radius!==undefined?parseInt(p.radius):50;
      const bPV=p.paddingV||'14';const bPH=p.paddingH||'32';
      const bFull=p.fullWidth==='true';
      const shine=getShineOpacity(bS);
      const isGlass=GLASS_BTN_STYLES.includes(bS);
      const depthShadow=isGlass?GLASS_DEPTH_SHADOW:'';
      return `<div style="padding:14px 40px;${cs}">
<button style="${buttonStyle(bS,c)}${depthShadow}border-radius:${bR}px;padding:${bPV}px ${bPH}px;${bFull?'width:100%;':''}vertical-align:middle"
  onmouseover="this.style.transform='translateY(-3px) scale(1.02)';this.style.filter='brightness(1.12)';this.querySelector('.bsm').style.animation='shimmer 0.65s ease forwards'"
  onmouseout="this.style.transform='';this.style.filter='';this.querySelector('.bsm').style.animation='none'">
<span style="position:absolute;top:0;left:0;right:0;height:52%;background:linear-gradient(180deg,rgba(255,255,255,${shine}) 0%,rgba(255,255,255,${(shine*0.3).toFixed(2)}) 55%,transparent 100%);border-radius:${bR}px ${bR}px 50% 50% / ${bR}px ${bR}px 30% 30%;pointer-events:none;z-index:1"></span>
<span style="position:absolute;bottom:0;left:10%;right:10%;height:18%;background:linear-gradient(0deg,rgba(255,255,255,0.07),transparent);border-radius:0 0 ${bR}px ${bR}px;pointer-events:none;z-index:1"></span>
<span class="bsm" style="position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);transform:translateX(-150%) skewX(-12deg);pointer-events:none;z-index:2"></span>
<span style="position:relative;z-index:3">${p.text}</span>
</button></div>`;}
    case 'button-group':{
      const cnt=parseInt(p.count||'2');
      const gap=Math.max(0,parseInt(p.gap||12)||12);
      const align={'left':'flex-start','center':'center','right':'flex-end'}[p.align||'left']||'flex-start';
      const bR=parseInt(p.radius||'50');
      const bPV=p.paddingV||'14';
      const bPH=p.paddingH||'28';
      function bgBtn(txt,st){
        let bSty='';
        const sty=st||'primary';
        if(sty==='primary'||sty==='default') bSty=buttonStyle(S.btnStyle,c);
        else if(sty==='glass') bSty=buttonStyle('arctic-glass',c);
        else if(sty==='outline') bSty=buttonStyle('outline',c);
        else if(sty==='minimal') bSty=buttonStyle('minimal',c);
        else if(sty==='solid') bSty=buttonStyle('solid',c);
        else bSty=buttonStyle(sty,c);
        const shine=getShineOpacity(sty==='primary'?S.btnStyle:sty==='glass'?'arctic-glass':'minimal');
        const isGlass=sty==='glass'||GLASS_BTN_STYLES.includes(sty);
        const depth=isGlass?GLASS_DEPTH_SHADOW:'';
        return `<button style="${bSty}${depth}border-radius:${bR}px;padding:${bPV}px ${bPH}px" onmouseover="this.style.transform='translateY(-3px)';this.style.filter='brightness(1.12)'" onmouseout="this.style.transform='';this.style.filter=''"><span style="position:absolute;top:0;left:0;right:0;height:52%;background:linear-gradient(180deg,rgba(255,255,255,${shine}),transparent);border-radius:${bR}px ${bR}px 50% 50%;pointer-events:none;z-index:1"></span><span style="position:relative;z-index:2">${txt}</span></button>`;
      }
      const btns=[1,2,3,4].slice(0,cnt).map(i=>bgBtn(p['t'+i]||'Button '+i,p['s'+i]||'primary')).join('');
      return `<div style="padding:14px 40px;${cs}"><div style="display:flex;flex-wrap:wrap;gap:${gap}px;align-items:center;justify-content:${align}">${btns}</div></div>`;
    }
    case 'input':return `<div style="padding:10px 40px;${cs}"><input placeholder="${p.placeholder}" style="display:block;width:100%;max-width:400px;padding:14px 16px;background:${c.text}08;border:1px solid ${c.text}18;border-radius:${Math.max(r-6,6)}px;color:${c.text};font-size:14px;outline:none;font-family:inherit"></div>`;
    case 'hero':return `<section style="padding:80px 40px 60px;max-width:1240px;margin:0 auto;position:relative;z-index:2;${cs}"><span style="display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:${c.accent};margin-bottom:22px;padding-bottom:6px;border-bottom:1px solid ${c.accent}40">${p.overline}</span><h1 style="font-family:'${f.h}',serif;font-size:clamp(38px,7vw,72px);line-height:1.05;letter-spacing:-0.02em;font-weight:400;margin:0 0 28px;color:${c.text}">${p.title}</h1><p style="font-size:16px;line-height:1.7;color:${c.muted};max-width:560px;margin:0 0 36px">${p.subtitle}</p><div style="display:flex;gap:14px;flex-wrap:wrap"><button style="${buttonStyle(S.btnStyle,c)}">${p.btn1}</button><button style="${buttonStyle('outline',c)}">${p.btn2}</button></div></section>`;
    case 'cta':return `<section style="margin:40px;padding:60px 40px;border-radius:${r+8}px;background:${c.accent2}40;border:1px solid ${c.accent}33;text-align:center;${cs}"><span style="display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:${c.accent};margin-bottom:16px">${p.overline}</span><h2 style="font-family:'${f.h}',serif;font-size:36px;line-height:1.2;font-weight:400;margin:0 0 14px;color:${c.text}">${p.title}</h2><p style="font-size:15px;color:${c.muted};max-width:520px;margin:0 auto 28px">${p.subtitle}</p><button style="${buttonStyle(S.btnStyle,c)}">${p.btn}</button></section>`;
    case 'card':{
      const eGlass=el.effects?.glass;
      const bg=eGlass?`rgba(255,255,255,${S.glassOpacity})`:`rgba(255,255,255,0.04)`;
      const bf=eGlass?`backdrop-filter:blur(${S.glassBlur}px);-webkit-backdrop-filter:blur(${S.glassBlur}px);`:'';
      const shadow=el.effects?.shadow&&el.effects.shadow!=='auto'?shadowCss(el.effects.shadow,c):shadowCss(S.shadowDefault,c);
      return `<div style="margin:10px 40px;padding:28px;border-radius:${r}px;background:${bg};${bf}border:1px solid ${c.accent}1f;box-shadow:${shadow};${cs}"><span style="font-family:'${f.h}',serif;font-size:13px;color:${c.accent};letter-spacing:2px;display:block;margin-bottom:14px">${p.num}</span><h3 style="font-family:'${f.h}',serif;font-size:22px;font-weight:400;margin:0 0 6px;color:${c.text}">${p.title}</h3><p style="font-size:13px;color:${c.muted};margin:0">${p.desc}</p></div>`;
    }
    case 'stat':return `<div style="margin:10px 40px;padding:22px;border-radius:${r}px;background:rgba(255,255,255,0.04);border:1px solid ${c.accent}1f;max-width:280px;box-shadow:${shadowCss(S.shadowDefault,c)};${cs}"><span style="font-size:11px;color:${c.muted};letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:10px">${p.label}</span><strong style="font-family:'${f.h}',serif;font-size:32px;font-weight:400;color:${c.accent};display:block;line-height:1">${p.value}</strong><em style="font-size:11px;color:${c.muted};font-style:normal;display:block;margin-top:8px">${p.change}</em></div>`;
    case 'card-row':return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 40px;${cs}" data-grid-cols="4">${[1,2,3,4].map(i=>`<div style="padding:24px;border-radius:${r}px;background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid ${c.accent}1f;box-shadow:${shadowCss(S.shadowDefault,c)}"><span style="font-family:'${f.h}',serif;font-size:12px;color:${c.accent};letter-spacing:2px;display:block;margin-bottom:12px">0${i}</span><h3 style="font-family:'${f.h}',serif;font-size:20px;font-weight:400;margin:0 0 4px;color:${c.text}">${p['t'+i]}</h3><p style="font-size:12px;color:${c.muted};margin:0">${p['d'+i]}</p></div>`).join('')}</div>`;
    case 'stat-row':return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 40px;${cs}" data-grid-cols="4">${[1,2,3,4].map(i=>`<div style="padding:22px;border-radius:${r}px;background:rgba(255,255,255,0.04);border:1px solid ${c.accent}1f;box-shadow:${shadowCss(S.shadowDefault,c)}"><span style="font-size:11px;color:${c.muted};letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:10px">${p['l'+i]}</span><strong style="font-family:'${f.h}',serif;font-size:28px;font-weight:400;color:${c.accent};display:block;line-height:1">${p['v'+i]}</strong></div>`).join('')}</div>`;
    case 'login':return `<section style="display:flex;align-items:center;justify-content:center;min-height:500px;padding:40px 20px;position:relative;z-index:2;${cs}"><div style="width:100%;max-width:420px;padding:42px 36px;border-radius:${Math.max(r+8,20)}px;background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid ${c.accent}1f;box-shadow:${shadowCss('xl',c)}"><span style="display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:${c.accent};margin-bottom:18px;padding-bottom:6px;border-bottom:1px solid ${c.accent}40">${p.overline}</span><h2 style="font-family:'${f.h}',serif;font-size:32px;font-weight:400;margin:0 0 24px;color:${c.text}">${p.title}</h2><input placeholder="${p.email}" style="display:block;width:100%;padding:14px 16px;margin-bottom:12px;background:${c.text}08;border:1px solid ${c.text}18;border-radius:${Math.max(r-6,6)}px;color:${c.text};font-size:14px;outline:none"><input type="password" placeholder="${p.pw}" style="display:block;width:100%;padding:14px 16px;margin-bottom:16px;background:${c.text}08;border:1px solid ${c.text}18;border-radius:${Math.max(r-6,6)}px;color:${c.text};font-size:14px;outline:none"><button style="${buttonStyle(S.btnStyle,c)};width:100%">${p.btn}</button><div style="margin-top:24px;padding-top:20px;border-top:1px solid ${c.text}10;text-align:center;font-size:10px;color:${c.muted};letter-spacing:2px;text-transform:uppercase">${p.sub}</div></div></section>`;

    case 'accordion':return `<section style="margin:20px 40px;${cs}"><h3 style="font-family:'${f.h}',serif;font-size:24px;font-weight:400;margin:0 0 16px;color:${c.text}">${p.title}</h3><div style="display:flex;flex-direction:column;gap:6px">${[1,2,3].map(i=>`<details style="padding:16px 20px;border-radius:${r}px;background:rgba(255,255,255,0.03);border:1px solid ${c.accent}1f"><summary style="font-size:14px;color:${c.text};font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between">${p['q'+i]}<span style="color:${c.accent}">+</span></summary><div style="font-size:13px;color:${c.muted};line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid ${c.text}10">${p['a'+i]}</div></details>`).join('')}</div></section>`;
    case 'form-contact':return `<section style="margin:30px 40px;${cs}"><h2 style="font-family:'${f.h}',serif;font-size:28px;font-weight:400;margin:0 0 24px;color:${c.text}">${p.title}</h2><div style="max-width:560px;display:flex;flex-direction:column;gap:12px"><input placeholder="${p.namePlaceholder}" style="display:block;width:100%;padding:14px 16px;background:${c.text}08;border:1px solid ${c.text}18;border-radius:${Math.max(r-6,6)}px;color:${c.text};font-size:14px;outline:none;font-family:inherit"><input placeholder="${p.emailPlaceholder}" style="display:block;width:100%;padding:14px 16px;background:${c.text}08;border:1px solid ${c.text}18;border-radius:${Math.max(r-6,6)}px;color:${c.text};font-size:14px;outline:none;font-family:inherit"><textarea placeholder="${p.msgPlaceholder}" rows="4" style="display:block;width:100%;padding:14px 16px;background:${c.text}08;border:1px solid ${c.text}18;border-radius:${Math.max(r-6,6)}px;color:${c.text};font-size:14px;outline:none;font-family:inherit;resize:vertical"></textarea><button style="${buttonStyle(S.btnStyle,c)};width:100%">${p.btnText}</button></div></section>`;
    case 'notification':{const ntc={info:{bg:'#1e3a5f22',bd:'#2a5a9f66',ic:'info-circle'},success:{bg:'#1a3a2a22',bd:'#2a6a4a66',ic:'circle-check'},warning:{bg:'#3a2a1022',bd:'#6a4a1066',ic:'alert-triangle'},error:{bg:'#3a1a1a22',bd:'#6a2a2a66',ic:'alert-circle'}}[p.type]||{bg:'#1e3a5f22',bd:'#2a5a9f66',ic:'info-circle'};return `<div style="margin:10px 40px;padding:16px 20px;border-radius:${r}px;background:${ntc.bg};border:1px solid ${ntc.bd};display:flex;align-items:flex-start;gap:14px;${cs}"><i class="ti ti-${ntc.ic}" style="font-size:18px;color:${c.accent};flex-shrink:0;margin-top:2px"></i><div><div style="font-size:14px;color:${c.text};font-weight:500;margin-bottom:3px">${p.title}</div><div style="font-size:13px;color:${c.muted}">${p.message}</div></div></div>`;}
    case 'badge':return `<div style="padding:10px 40px;${cs}"><span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:50px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;background:${c.accent}22;color:${c.accent};border:1px solid ${c.accent}44">${p.text}</span></div>`;
    case 'countdown':return `<div style="margin:20px 40px;text-align:center;${cs}"><div style="font-size:11px;color:${c.muted};letter-spacing:3px;text-transform:uppercase;margin-bottom:16px">${p.title}</div><div style="display:inline-flex;gap:16px;align-items:center">${['D','H','M','S'].map((u,i)=>(i?`<div style="font-family:'${f.h}',serif;font-size:40px;color:${c.text}44">:</div>`:'')+(u==='D'?''+`<div style="text-align:center"><div style="font-family:'${f.h}',serif;font-size:52px;color:${c.accent};line-height:1;font-weight:400">--</div><div style="font-size:10px;color:${c.muted};letter-spacing:2px;text-transform:uppercase;margin-top:4px">${p['label'+(i+1)]}</div></div>`:`<div style="text-align:center"><div style="font-family:'${f.h}',serif;font-size:52px;color:${c.accent};line-height:1;font-weight:400">--</div><div style="font-size:10px;color:${c.muted};letter-spacing:2px;text-transform:uppercase;margin-top:4px">${p['label'+(i+1)]}</div></div>`)).join('')}</div></div>`;
    case 'hero-split':return `<div style="display:grid;grid-template-columns:1fr 1fr;min-height:500px;${cs}" data-grid-cols="2"><div style="padding:70px 50px;display:flex;flex-direction:column;justify-content:center"><span style="display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:${c.accent};margin-bottom:18px;padding-bottom:6px;border-bottom:1px solid ${c.accent}40">${p.overline}</span><h1 style="font-family:'${f.h}',serif;font-size:clamp(28px,5vw,54px);line-height:1.08;font-weight:400;margin:0 0 18px;color:${c.text}">${p.title}</h1><p style="font-size:15px;color:${c.muted};line-height:1.7;margin:0 0 26px">${p.desc}</p><button style="${buttonStyle(S.btnStyle,c)};align-self:flex-start">${p.btn}</button></div><div style="background:linear-gradient(135deg,${c.accent2}44,${c.accent}22);display:flex;align-items:center;justify-content:center"><div style="font-family:'${f.h}',serif;font-size:80px;color:${c.accent}33;font-weight:400;letter-spacing:-4px">BOC</div></div></div>`;
    case 'features-grid':return `<section style="padding:60px 40px;${cs}"><h2 style="font-family:'${f.h}',serif;font-size:clamp(28px,4vw,42px);font-weight:400;margin:0 0 40px;color:${c.text};text-align:center">${p.title}</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px" data-grid-cols="3">${[1,2,3,4,5,6].map(i=>`<div style="padding:26px 22px;border-radius:${r}px;background:rgba(255,255,255,0.03);border:1px solid ${c.accent}18"><div style="width:42px;height:42px;border-radius:${Math.max(r-6,6)}px;background:${c.accent}18;display:flex;align-items:center;justify-content:center;margin-bottom:14px"><i class="ti ti-${p['i'+i]}" style="font-size:20px;color:${c.accent}"></i></div><h3 style="font-family:'${f.h}',serif;font-size:17px;font-weight:400;margin:0 0 6px;color:${c.text}">${p['t'+i]}</h3><p style="font-size:13px;color:${c.muted};margin:0;line-height:1.6">${p['d'+i]}</p></div>`).join('')}</div></section>`;
    case 'stats-banner':return `<section style="padding:50px 40px;border-top:1px solid ${c.text}10;border-bottom:1px solid ${c.text}10;${cs}"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center;max-width:960px;margin:0 auto" data-grid-cols="4">${[1,2,3,4].map(i=>`<div><div style="font-family:'${f.h}',serif;font-size:36px;color:${c.accent};font-weight:400;margin-bottom:6px">${p['s'+i]}</div><div style="font-size:12px;color:${c.muted};letter-spacing:1.5px;text-transform:uppercase">${p['l'+i]}</div></div>`).join('')}</div></section>`;
    case 'icon':{
      const ic=p.icon||'star';
      const sz=parseInt(p.size||48);
      const col=p.color==='accent'?c.accent:p.color==='text'?c.text:p.color||c.accent;
      return `<div style="padding:14px 40px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;${cs}">
        <div style="width:${sz+16}px;height:${sz+16}px;border-radius:${r}px;background:${col}18;border:1px solid ${col}44;display:flex;align-items:center;justify-content:center">
          <i class="ti ti-${ic}" style="font-size:${sz}px;color:${col}"></i>
        </div>
        ${p.label?`<span style="font-size:12px;color:${c.muted};letter-spacing:1px;text-transform:uppercase">${p.label}</span>`:''}
      </div>`;
    }
    case 'member-card':return `<div style="margin:14px 40px;padding:28px;border-radius:${r}px;background:rgba(255,255,255,0.04);border:1px solid ${c.accent}1f;display:flex;gap:20px;align-items:flex-start;${cs}">
      <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,${c.accent},${c.accent2});display:flex;align-items:center;justify-content:center;font-family:'${f.h}',serif;font-size:22px;color:${c.bg};flex-shrink:0;font-weight:600">${p.initials||'A'}</div>
      <div style="flex:1"><h3 style="font-family:'${f.h}',serif;font-size:20px;font-weight:400;margin:0 0 3px;color:${c.text}">${p.name}</h3><div style="font-size:11px;color:${c.accent};letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">${p.role}</div><p style="font-size:13px;color:${c.muted};margin:0;line-height:1.6">${p.bio}</p></div>
    </div>`;
    case 'social-links':return `<div style="margin:14px 40px;padding:24px;border-radius:${r}px;background:rgba(255,255,255,0.03);border:1px solid ${c.accent}1f;${cs}">
      ${p.title?`<div style="font-size:11px;color:${c.muted};letter-spacing:2px;text-transform:uppercase;margin-bottom:16px">${p.title}</div>`:''}
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${p.instagram?`<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:${c.accent}15;border:1px solid ${c.accent}33;border-radius:50px"><i class="ti ti-brand-instagram" style="color:${c.accent};font-size:16px"></i><span style="font-size:12px;color:${c.text}">${p.instagram}</span></div>`:''}
        ${p.twitter?`<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:${c.accent}15;border:1px solid ${c.accent}33;border-radius:50px"><i class="ti ti-brand-x" style="color:${c.accent};font-size:16px"></i><span style="font-size:12px;color:${c.text}">${p.twitter}</span></div>`:''}
        ${p.linkedin?`<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:${c.accent}15;border:1px solid ${c.accent}33;border-radius:50px"><i class="ti ti-brand-linkedin" style="color:${c.accent};font-size:16px"></i><span style="font-size:12px;color:${c.text}">${p.linkedin}</span></div>`:''}
        ${p.github?`<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:${c.accent}15;border:1px solid ${c.accent}33;border-radius:50px"><i class="ti ti-brand-github" style="color:${c.accent};font-size:16px"></i><span style="font-size:12px;color:${c.text}">${p.github}</span></div>`:''}
      </div>
    </div>`;
    case 'step-indicator':{
      const steps=Object.keys(p).filter(k=>k.match(/^s\d+$/)).map(k=>p[k]);
      const active=parseInt(p.active||1)-1;
      return `<div style="margin:20px 40px;${cs}"><div style="display:flex;align-items:center">${steps.map((s,i)=>`${i>0?`<div style="flex:1;height:2px;background:${i<=active?c.accent:c.text+'18'}"></div>`:''}<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0"><div style="width:36px;height:36px;border-radius:50%;background:${i<active?c.accent:i===active?c.accent+'33':'transparent'};border:2px solid ${i<=active?c.accent:c.text+'30'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:${i<=active?i<active?c.bg:c.accent:c.muted}">${i<active?`<i class="ti ti-check" style="font-size:14px"></i>`:`${i+1}`}</div><span style="font-size:10px;color:${i===active?c.accent:c.muted};letter-spacing:0.5px;white-space:nowrap">${s}</span></div>`).join('')}</div></div>`;
    }
    case 'marquee':return `<div style="margin:10px 0;overflow:hidden;border-top:1px solid ${c.text}10;border-bottom:1px solid ${c.text}10;${cs}"><div style="display:flex;animation:mq ${p.speed||30}s linear infinite;white-space:nowrap"><style>@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}</style><span style="font-family:'${f.h}',serif;font-size:13px;color:${c.muted};letter-spacing:3px;text-transform:uppercase;padding:14px 0">${p.text} &nbsp;&nbsp;&nbsp;${p.text} &nbsp;&nbsp;&nbsp;</span></div></div>`;
    case 'rating':{
      const score=parseFloat(p.score||4.8);
      const max=parseInt(p.max||5);
      const stars=Array.from({length:max},(_,i)=>`<i class="ti ti-star${i<Math.floor(score)?'-filled':i<score?'-half-filled':''}" style="color:${c.accent};font-size:20px"></i>`).join('');
      return `<div style="margin:14px 40px;padding:24px;border-radius:${r}px;background:rgba(255,255,255,0.03);border:1px solid ${c.accent}1f;${cs}"><div style="font-size:11px;color:${c.muted};letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">${p.label}</div><div style="display:flex;align-items:center;gap:12px">${stars}<span style="font-family:'${f.h}',serif;font-size:32px;color:${c.accent};font-weight:400">${p.score}</span><span style="font-size:12px;color:${c.muted}">(${p.count} 리뷰)</span></div></div>`;
    }
    case 'tag-group':return `<div style="padding:14px 40px;${cs}"><div style="display:flex;flex-wrap:wrap;gap:8px">${p.tags.split('|').map(t=>`<span style="padding:5px 14px;border-radius:50px;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:${c.accent}15;color:${c.accent};border:1px solid ${c.accent}33">${t.trim()}</span>`).join('')}</div></div>`;
    case 'code-block':return `<div style="margin:14px 40px;border-radius:${r}px;overflow:hidden;background:#0a0a0f;border:1px solid ${c.accent}1f;${cs}"><div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#13141a;border-bottom:1px solid #1f2028"><span style="font-size:10px;color:${c.accent};letter-spacing:2px;text-transform:uppercase">${p.lang||'Code'}</span><div style="display:flex;gap:5px">${['#ff5f57','#febc2e','#28c840'].map(col=>`<span style="width:10px;height:10px;border-radius:50%;background:${col}"></span>`).join('')}</div></div><pre style="margin:0;padding:20px;font-family:'Courier New',monospace;font-size:12px;line-height:1.6;color:#e8e8ec;overflow-x:auto;white-space:pre">${p.code.replace(/</g,'&lt;')}</pre></div>`;
    case 'map-embed':return `<div style="margin:14px 40px;border-radius:${r}px;overflow:hidden;${cs}"><iframe src="${p.src}" style="width:100%;height:360px;border:none" title="${p.title||'Map'}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div>`;
    case 'divider-fancy':{
      const col=p.color==='accent'?c.accent:p.color||c.accent;
      const styles={dots:`<div style="display:flex;justify-content:center;gap:8px">${Array(7).fill(`<span style="width:5px;height:5px;border-radius:50%;background:${col}"></span>`).join('')}</div>`,gradient:`<div style="height:1px;background:linear-gradient(90deg,transparent,${col},transparent)"></div>`,double:`<div style="height:1px;background:${col}33;margin-bottom:6px"></div><div style="height:2px;background:${col}66"></div>`,ornament:`<div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:1px;background:${col}44"></div><i class="ti ti-diamond" style="color:${col};font-size:14px"></i><div style="flex:1;height:1px;background:${col}44"></div></div>`};
      return `<div style="margin:20px 40px;${cs}">${p.label?`<div style="font-size:10px;color:${c.muted};text-align:center;margin-bottom:10px;letter-spacing:2px;text-transform:uppercase">${p.label}</div>`:''}${styles[p.style||'gradient']||styles.gradient}</div>`;
    }

    case 'section-dark':return `<section style="padding:80px 40px;background:${c.accent2}22;border-top:1px solid ${c.accent}1f;border-bottom:1px solid ${c.accent}1f;${cs}"><div style="max-width:640px;margin:0 auto;text-align:center"><span style="display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:${c.accent};margin-bottom:18px;padding-bottom:6px;border-bottom:1px solid ${c.accent}40">${p.overline}</span><h2 style="font-family:'${f.h}',serif;font-size:clamp(28px,4vw,44px);line-height:1.15;font-weight:400;margin:0 0 18px;color:${c.text}">${p.title}</h2><p style="font-size:16px;color:${c.muted};line-height:1.75;margin:0 0 32px">${p.desc}</p><button style="${buttonStyle(S.btnStyle,c)}">${p.btn}</button></div></section>`;

    // ── 2026-08-23: 인테리어 포트폴리오 ──
    case 'pf-cover':return `<section style="position:relative;min-height:${parseInt(p.h)||520}px;border-radius:${r}px;overflow:hidden;display:flex;align-items:flex-end;${p.img1?`background:url('${p.img1}') center/cover no-repeat`:`background:linear-gradient(135deg,${c.accent2}55 0%,${c.n1}66 45%,${c.bg} 100%)`};${cs}"><div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,${c.bg}e6 92%)"></div><div style="position:relative;padding:56px 50px 44px;width:100%">${p.img1?'':`<div style=\"position:absolute;top:-330px;left:50px;font-size:11px;letter-spacing:2px;color:${c.muted}88\">이미지를 우측 패널(img1)에서 업로드하세요</div>`}<span style="font-size:11px;letter-spacing:4px;color:${c.accent};text-transform:uppercase">${p.overline}</span><h1 style="font-family:'${f.h}',serif;font-size:clamp(32px,5vw,58px);font-weight:400;margin:14px 0 10px;color:${c.text};line-height:1.12">${p.title}</h1><p style="font-size:14px;color:${c.muted};margin:0 0 24px;letter-spacing:0.3px">${p.subtitle}</p><div style="display:flex;gap:34px;flex-wrap:wrap;border-top:1px solid ${c.text}1c;padding-top:18px">${[['위치',p.loc],['면적',p.area],['공사 기간',p.period],['스타일',p.style]].map(([l,v])=>`<div><div style="font-size:9px;letter-spacing:2px;color:${c.muted};text-transform:uppercase;margin-bottom:5px">${l}</div><div style="font-family:'${f.h}',serif;font-size:16px;color:${c.text}">${v}</div></div>`).join('')}</div></div></section>`;
    case 'pf-before-after':return `<section style="padding:40px;${cs}"><h3 style="font-family:'${f.h}',serif;font-size:26px;font-weight:400;margin:0 0 20px;color:${c.text}">${p.title}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px" data-grid-cols="2">${[[p.img1,p.cap1,c.muted],[p.img2,p.cap2,c.accent]].map(([im,cap,col])=>`<figure style="margin:0;position:relative;border-radius:${r}px;overflow:hidden;border:1px solid ${c.accent}1f">${im?`<img src="${im}" alt="${cap}" style="width:100%;height:${parseInt(p.h)||320}px;object-fit:cover;display:block">`:`<div style="height:${parseInt(p.h)||320}px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,${c.n1}33,${c.bg});color:${c.muted}66;font-size:12px;letter-spacing:2px">이미지 업로드</div>`}<figcaption style="position:absolute;top:14px;left:14px;background:${c.bg}dd;color:${col};font-size:10px;letter-spacing:3px;padding:5px 12px;border-radius:3px;border:1px solid ${col}55">${cap}</figcaption></figure>`).join('')}</div><p style="font-size:13px;color:${c.muted};margin:14px 0 0;line-height:1.7">${p.desc}</p></section>`;
    case 'pf-gallery':{const n=Math.max(2,Math.min(8,parseInt(p.cols||'3')*2));const cols=Math.max(2,Math.min(4,parseInt(p.cols||'3')));return `<section style="padding:40px;${cs}"><h3 style="font-family:'${f.h}',serif;font-size:26px;font-weight:400;margin:0 0 20px;color:${c.text}">${p.title}</h3><div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:12px" data-grid-cols="${cols}">${Array.from({length:n},(_,ix)=>{const i=ix+1,im=p['img'+i],cap=p['cap'+i]||'';return `<figure style="margin:0;border-radius:${Math.max(r-6,4)}px;overflow:hidden;border:1px solid ${c.accent}18;background:${c.n1}22">${im?`<img src="${im}" alt="${cap}" style="width:100%;height:${parseInt(p.h)||210}px;object-fit:cover;display:block">`:`<div style="height:${parseInt(p.h)||210}px;display:flex;align-items:center;justify-content:center;color:${c.muted}55;font-size:11px;letter-spacing:2px">img${i}</div>`}${cap?`<figcaption style="padding:9px 12px;font-size:11px;color:${c.muted};letter-spacing:1px;border-top:1px solid ${c.accent}12">${cap}</figcaption>`:''}</figure>`;}).join('')}</div></section>`;}
    case 'pf-specs':return `<section style="padding:40px;${cs}"><div style="max-width:760px;margin:0 auto;padding:36px 40px;border:1px solid ${c.accent}28;border-radius:${r}px;background:rgba(255,255,255,0.03)"><h3 style="font-family:'${f.h}',serif;font-size:24px;font-weight:400;margin:0 0 24px;color:${c.text};text-align:center;letter-spacing:1px">${p.title}</h3>${[1,2,3,4,5,6].map(i=>`<div style="display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px ${i===6?'solid transparent':'dashed '+c.text+'14'}"><span style="font-size:11px;letter-spacing:2px;color:${c.accent};text-transform:uppercase;width:110px;flex-shrink:0">${p['l'+i]}</span><span style="flex:1;border-bottom:1px dotted ${c.text}1a;transform:translateY(-4px)"></span><span style="font-size:14px;color:${c.text}">${p['v'+i]}</span></div>`).join('')}</div></section>`;

    case 'pf-process':return `<section style="padding:46px 40px;${cs}"><h3 style="font-family:'${f.h}',serif;font-size:26px;font-weight:400;margin:0 0 30px;color:${c.text};text-align:center">${p.title}</h3><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative" data-grid-cols="5"><div style="position:absolute;top:19px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,${c.accent}55,${c.accent}55,transparent)"></div>${[1,2,3,4,5].map(i=>`<div style="text-align:center;position:relative;padding:0 8px"><div style="width:38px;height:38px;margin:0 auto 12px;border-radius:50%;background:${c.bg};border:1px solid ${c.accent}66;display:flex;align-items:center;justify-content:center;font-family:'${f.h}',serif;font-size:14px;color:${c.accent};position:relative;z-index:1">${'0'+i}</div><div style="font-size:13px;color:${c.text};margin-bottom:5px;letter-spacing:0.5px">${p['t'+i]}</div><div style="font-size:11px;color:${c.muted};line-height:1.6">${p['d'+i]}</div></div>`).join('')}</div></section>`;

    case 'pf-review':{const sc=Math.max(0,Math.min(5,parseInt(p.score||'5')));return `<section style="padding:40px;${cs}"><div style="max-width:680px;margin:0 auto;text-align:center;padding:40px 36px;border-radius:${r}px;border:1px solid ${c.accent}22;background:rgba(255,255,255,0.03)"><div style="font-size:16px;letter-spacing:6px;color:${c.accent};margin-bottom:18px">${'★'.repeat(sc)}<span style="color:${c.text}22">${'★'.repeat(5-sc)}</span></div><p style="font-family:'${f.h}',serif;font-size:19px;line-height:1.75;color:${c.text};margin:0 0 22px;font-weight:400">“${p.quote}”</p><div style="font-size:12px;color:${c.text};letter-spacing:1px;margin-bottom:3px">${p.name}</div><div style="font-size:11px;color:${c.muted};letter-spacing:0.5px">${p.loc}</div></div></section>`;}
