<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ECOREAN</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #02060E;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  cursor: pointer;
}

/* Subtle drifting grid */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0, 234, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 234, 255, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: grid-drift 40s linear infinite;
  pointer-events: none;
}

@keyframes grid-drift {
  from { background-position: 0 0; }
  to   { background-position: 60px 60px; }
}

/* Vignette */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 30%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
}

.stage {
  position: fixed; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  z-index: 2;
  transition: opacity 0.6s ease;
}

.stage.leaving { opacity: 0; }

/* Gold hairlines */
.line {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(232, 201, 155, 0.35) 20%,
    rgba(245, 220, 176, 1) 50%,
    rgba(232, 201, 155, 0.35) 80%,
    transparent 100%);
  box-shadow: 0 0 10px rgba(232, 201, 155, 0.55);
  animation: line-grow 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
}

@keyframes line-grow {
  to { width: min(560px, 82vw); }
}

.brand {
  font-family: 'Cinzel', serif;
  font-size: clamp(34px, 9vw, 72px);
  font-weight: 400;
  letter-spacing: 0.5em;
  padding-left: 0.5em; /* visual centering with letter-spacing */
  color: #F5DCB0;
  text-shadow:
    0 0 14px rgba(245, 220, 176, 0.85),
    0 0 36px rgba(232, 201, 155, 0.5),
    0 0 80px rgba(232, 201, 155, 0.3);
  opacity: 0;
  transform: scale(0.94);
  animation:
    brand-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards,
    brand-pulse 3s ease-in-out 1.5s infinite;
  white-space: nowrap;
}

@keyframes brand-in {
  to { opacity: 1; transform: scale(1); }
}

@keyframes brand-pulse {
  0%, 100% { text-shadow: 0 0 14px rgba(245,220,176,0.85), 0 0 36px rgba(232,201,155,0.5), 0 0 80px rgba(232,201,155,0.3); }
  50%      { text-shadow: 0 0 20px rgba(245,220,176,1), 0 0 52px rgba(232,201,155,0.7), 0 0 110px rgba(232,201,155,0.45); }
}

.sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.55em;
  text-transform: uppercase;
  color: rgba(0, 234, 255, 0.8);
  text-shadow: 0 0 8px rgba(0, 234, 255, 0.45);
  opacity: 0;
  animation: sub-in 0.8s ease 0.9s forwards;
  text-align: center;
  line-height: 2;
}

@keyframes sub-in { to { opacity: 1; } }

/* Progress hairline */
.progress {
  width: min(300px, 60vw);
  height: 1px;
  background: rgba(232, 201, 155, 0.15);
  overflow: hidden;
  opacity: 0;
  animation: sub-in 0.6s ease 1.1s forwards;
}

.progress > i {
  display: block;
  width: 30%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 234, 255, 0.9), #F5DCB0);
  box-shadow: 0 0 8px rgba(0, 234, 255, 0.6);
  animation: progress-sweep 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

@keyframes progress-sweep {
  0%   { transform: translateX(-110%); }
  100% { transform: translateX(440%); }
}

.hint {
  position: fixed;
  bottom: max(34px, env(safe-area-inset-bottom, 0px) + 24px);
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(232, 201, 155, 0.45);
  opacity: 0;
  animation: sub-in 0.8s ease 1.6s forwards;
  white-space: nowrap;
  z-index: 2;
}

/* Corner brackets */
.bk {
  position: fixed;
  width: 26px; height: 26px;
  border: 1px solid rgba(245, 220, 176, 0.5);
  filter: drop-shadow(0 0 4px rgba(245, 220, 176, 0.35));
  opacity: 0;
  animation: sub-in 0.8s ease 0.2s forwards;
  z-index: 2;
}
.bk.tl { top: 22px; left: 22px; border-right: none; border-bottom: none; }
.bk.tr { top: 22px; right: 22px; border-left: none; border-bottom: none; }
.bk.bl { bottom: 22px; left: 22px; border-right: none; border-top: none; }
.bk.br { bottom: 22px; right: 22px; border-left: none; border-top: none; }
</style>
</head>
<body>

<div class="bk tl"></div><div class="bk tr"></div><div class="bk bl"></div><div class="bk br"></div>

<div class="stage" id="stage">
  <div class="line"></div>
  <div class="brand">ECOREAN</div>
  <div class="sub">ACCESS PORTAL<br>INITIALIZING</div>
  <div class="progress"><i></i></div>
  <div class="line"></div>
</div>

<div class="hint">TAP TO CONTINUE</div>

<script>
(function () {
  var DEST = '/login';   // 2026-08-26 대표 지시: 암호 포털 제거 → 로그인 직행 (포털은 온톨로지 게이트로 이전)
  var MIN_SPLASH_MS = 2400;   // brand moment
  var MAX_WAIT_MS = 9000;     // don't hold visitors hostage on slow networks
  var t0 = Date.now();
  var navigated = false;

  function go() {
    if (navigated) return;
    navigated = true;
    document.getElementById('stage').classList.add('leaving');
    setTimeout(function () { location.replace(DEST); }, 350);
  }

  // Warm the browser cache with the (large) portal page while the
  // splash plays, then navigate when both splash + fetch are done.
  var warmed = fetch(DEST, { cache: 'default' }).then(
    function () { return true; },
    function () { return false; }
  );

  var minWait = new Promise(function (res) { setTimeout(res, MIN_SPLASH_MS); });
  var maxWait = new Promise(function (res) { setTimeout(res, MAX_WAIT_MS); });

  Promise.race([Promise.all([warmed, minWait]), maxWait]).then(go);

  // Tap/click/key skips straight through
  ['pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, go, { once: true });
  });
})();
</script>
</body>
</html>
