<!DOCTYPE html>

 ECOREAN MiniCAD 3D 뷰 — Copyright (c) 2026 ECOREAN. All Rights Reserved.
 2026-09-01: MiniCAD 평면도를 그대로 입체로 (1단계: 실시간 3D 뷰 · 별도 탭)
   - MiniCAD 창의 [🧊 3D] 버튼이 이 탭을 열고, 이후 도면을 고칠 때마다 BroadcastChannel 로 흘려보낸다
   - three.js 는 vendor/three 에 동봉(외부 CDN 없음). 계산부는 build3d.js (노드 테스트 tests/minicad-3d.cjs)
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MiniCAD 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A7%8A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{ --bg:#0E0F1A; --panel:#1A1B2E; --line:#3D4466; --ink:#F5F1EB; --mute:#B8B0A0; --gold:#C9A961; --lime:#D4FF3D; --orange:#E2725B; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter Tight','Inter','Noto Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #view{position:fixed;inset:0}
  #view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  .bar{position:fixed;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;background:rgba(26,27,46,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:5;overflow-x:auto;white-space:nowrap}
  .bar .title{font-weight:700;color:var(--gold);margin-right:6px;font-size:14px}
  .bar .title small{color:var(--mute);font-weight:400;margin-left:6px}
  .btn{appearance:none;border:1px solid var(--line);background:#242640;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;line-height:1;font-family:inherit}
  .btn:hover{border-color:var(--gold)}
  .btn.on{background:var(--gold);color:#1A1B2E;border-color:var(--gold);font-weight:700}
  .btn.warn{border-color:var(--orange);color:var(--orange)}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
  .grow{flex:1}
  #status{font-size:11.5px;color:var(--mute)}
  #status.live::before{content:'●';color:var(--lime);margin-right:5px}
  #status.off::before{content:'●';color:#666;margin-right:5px}
  #tip{position:fixed;pointer-events:none;background:rgba(26,27,46,.95);border:1px solid var(--gold);color:var(--ink);padding:5px 9px;border-radius:7px;font-size:12px;display:none;z-index:6;white-space:nowrap}
  #tip small{color:var(--mute)}
  #hint{position:fixed;left:12px;bottom:12px;font-size:11.5px;color:var(--mute);background:rgba(26,27,46,.8);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:5;max-width:min(92vw,520px);line-height:1.5}
  #empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:15px;line-height:1.8;z-index:4;padding:20px}
  #empty b{color:var(--gold)}
  #walkpad{position:fixed;right:14px;bottom:14px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;z-index:5}
  #walkpad button{border:1px solid var(--line);background:rgba(36,38,64,.9);color:var(--ink);border-radius:10px;font-size:20px;touch-action:none}
  #walkpad button:active{background:var(--gold);color:#1A1B2E}
  @media (max-width:640px){ .bar .title small{display:none} #hint{display:none} }
</style>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <span class="title">🧊 MiniCAD 3D<small id="proj"></small></span>
  <button class="btn on" id="b-orbit" title="위에서 돌려보기 — 드래그 회전 · 휠 확대 · 우클릭/두 손가락 이동">🛰 조감</button>
  <button class="btn" id="b-walk" title="사람 눈높이(1.6m)로 걷기 — 드래그 둘러보기 · W A S D / 방향키 이동">🚶 걷기</button>
  <span class="sep"></span>
  <span id="floors" style="display:flex;gap:4px"></span>
  <button class="btn on" id="b-light" title="조명 기구를 켜고 끈다 (발광 + 광원)">💡 조명</button>
  <button class="btn" id="b-ceil" title="천장을 보인다/숨긴다 (조감은 숨김, 걷기는 보임이 기본)">⬛ 천장</button>
  <button class="btn on" id="b-label" title="공간 이름표">🏷 이름</button>
  <button class="btn on" id="b-shadow" title="그림자(느리면 끄기)">🌤 그림자</button>
  <span class="sep"></span>
  <button class="btn" id="b-fit" title="도면 전체가 보이게">⤢ 전체</button>
  <button class="btn" id="b-shot" title="지금 화면을 PNG 로 저장">📷 사진</button>
  <button class="btn" id="b-glb" title="Blender 등으로 가져갈 수 있는 .glb 파일 (2단계 렌더용)">⬇ GLB</button>
  <button class="btn" id="b-json" title="3D 기본체 목록(JSON) — 외부 렌더 파이프라인용">⬇ JSON</button>
  <span class="grow"></span>
  <span id="status" class="off">MiniCAD 연결 대기</span>
  <button class="btn" id="b-reload" title="MiniCAD 에서 도면을 다시 받는다">↻</button>
</div>
<div id="tip"></div>
<div id="hint">조감: 드래그 회전 · 휠 확대 · 우클릭 이동 · 클릭하면 이름 &nbsp;|&nbsp; 걷기: 드래그 둘러보기 · W A S D 이동 · Q/E 위아래</div>
<div id="empty">아직 받은 도면이 없습니다.<br>MiniCAD 창에서 <b>🧊 3D</b> 버튼을 누르거나 명령창에 <b>3d</b> 를 입력하세요.<br><small>이 탭을 열어 두면 평면을 고칠 때마다 바로 반영됩니다.</small></div>
<div id="walkpad">
  <button data-k="q">⇧</button><button data-k="w">▲</button><button data-k="e">⇩</button>
  <button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button>
</div>
<script src="../js/library.js?v=3d2"></script>
<script src="build3d.js?v=3d2"></script>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js"}}</script>
<script type="module" src="view3d.js?v=3d2"></script>
</body>
</html>
