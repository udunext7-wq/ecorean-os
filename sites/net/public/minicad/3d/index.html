<!DOCTYPE html>
<!--
 ECOREAN MiniCAD 3D 뷰 — Copyright (c) 2026 ECOREAN. All Rights Reserved.
 2026-09-01: 평면도를 그대로 입체로 (실시간 3D 뷰). BroadcastChannel 로 MiniCAD 와 양방향.
 2026-09-03 v2: 3D 직접 편집(끌어 이동·회전·삭제·속성 패널 → 평면 역반영), 층별 증분 재조립,
   필요할 때만 렌더(유휴 시 GPU 0), 시점 프리셋, 주/야, 방 더블클릭 줌. MiniCAD 안 분할 패널로도 열린다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MiniCAD 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A7%8A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{ --bg:#0E0F1A; --panel:#1A1B2E; --line:#3D4466; --ink:#F5F1EB; --mute:#B8B0A0; --gold:#C9A961; --lime:#D4FF3D; --orange:#E2725B; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter Tight','Inter','Noto Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #view{position:fixed;inset:0}
  #view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  .bar{position:fixed;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:5px;padding:0 8px;background:rgba(26,27,46,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:5;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .bar .title{font-weight:700;color:var(--gold);margin-right:4px;font-size:14px}
  .bar .title small{color:var(--mute);font-weight:400;margin-left:6px}
  .btn{appearance:none;border:1px solid var(--line);background:#242640;color:var(--ink);border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer;line-height:1;font-family:inherit;flex:none}
  .btn:hover{border-color:var(--gold)}
  .btn.on{background:var(--gold);color:#1A1B2E;border-color:var(--gold);font-weight:700}
  .btn.sm{padding:6px 7px;font-size:12px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
  .grow{flex:1}
  #status{font-size:11.5px;color:var(--mute);flex:none}
  #status.live::before{content:'●';color:var(--lime);margin-right:5px}
  #status.off::before{content:'●';color:#666;margin-right:5px}
  #tip{position:fixed;pointer-events:none;background:rgba(26,27,46,.95);border:1px solid var(--gold);color:var(--ink);padding:5px 9px;border-radius:7px;font-size:12px;display:none;z-index:6;white-space:nowrap}
  #tip small{color:var(--mute)}
  #hint{position:fixed;left:12px;bottom:12px;font-size:11.5px;color:var(--mute);background:rgba(26,27,46,.8);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:5;max-width:min(92vw,560px);line-height:1.5}
  #empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:15px;line-height:1.8;z-index:4;padding:20px}
  #empty b{color:var(--gold)}
  #walkpad{position:fixed;right:14px;bottom:14px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;z-index:5}
  #walkpad button{border:1px solid var(--line);background:rgba(36,38,64,.9);color:var(--ink);border-radius:10px;font-size:20px;touch-action:none}
  #walkpad button:active{background:var(--gold);color:#1A1B2E}
  /* 2026-09-03: 선택 객체 속성 패널 — 3D 직접 편집 */
  #props{position:fixed;right:12px;top:56px;width:238px;max-height:calc(100vh - 120px);overflow-y:auto;display:none;z-index:5;
    background:rgba(26,27,46,.95);border:1px solid var(--line);border-radius:11px;padding:12px 13px;backdrop-filter:blur(8px)}
  #props h4{margin:0 0 3px;font-size:13.5px;color:var(--gold)}
  #props .p-sub{font-size:11px;color:var(--mute);margin-bottom:9px}
  #props .p-row{display:flex;align-items:center;gap:6px;margin:6px 0}
  #props label{font-size:11.5px;color:var(--mute);flex:0 0 62px}
  #props input,#props select{flex:1;min-width:0;background:#242640;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit}
  #props .p-btns{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  #props .p-btns .btn{flex:1;text-align:center;font-size:12px}
  #props .btn.danger{border-color:var(--orange);color:var(--orange)}
  #props .p-note{font-size:10.5px;color:var(--mute);margin-top:8px;line-height:1.45}
  #props .p-lock{color:var(--orange);font-size:11.5px;margin-top:6px}
  /* 2026-09-03: 스케치업식 도구 바·수치입력(VCB)·페인트 팔레트 */
  #tools{position:fixed;left:10px;top:56px;display:flex;flex-direction:column;gap:5px;z-index:5}
  #tools .btn{width:42px;height:40px;font-size:16px;padding:0;text-align:center}
  #paintpal{position:fixed;left:60px;top:56px;width:210px;max-height:calc(100vh - 130px);overflow-y:auto;display:none;z-index:5;
    background:rgba(26,27,46,.95);border:1px solid var(--line);border-radius:11px;padding:10px;backdrop-filter:blur(8px)}
  #paintpal .pp-cat{font-size:11px;color:var(--gold);font-weight:700;margin:7px 0 4px}
  #paintpal .pp-cat:first-child{margin-top:0}
  #paintpal .pp-grid{display:flex;flex-direction:column;gap:2px}
  #paintpal .pp-it{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;color:var(--ink);
    border-radius:7px;padding:4px 6px;font-size:11.5px;cursor:pointer;text-align:left;font-family:inherit}
  #paintpal .pp-it:hover{border-color:var(--line)}
  #paintpal .pp-it.on{background:#2E3150;border-color:var(--gold)}
  #paintpal .pp-chip{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.4);flex:none}
  #vcb{position:fixed;right:12px;bottom:12px;display:none;align-items:center;gap:7px;z-index:6;
    background:rgba(26,27,46,.95);border:1px solid var(--gold);border-radius:9px;padding:7px 11px}
  #vcb .v-l{font-size:11.5px;color:var(--mute)}
  #vcb .v-v{width:84px;background:#242640;border:1px solid var(--line);color:var(--lime);border-radius:6px;padding:4px 7px;
    font-size:13px;font-family:'JetBrains Mono',monospace;text-align:right}
  #vcb .v-u{font-size:11.5px;color:var(--mute)}
  @media (max-width:640px){ .bar .title small{display:none} #hint{display:none} #props{width:200px} }
</style>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <span class="title">🧊 3D<small id="proj"></small></span>
  <button class="btn on" id="b-orbit" title="위에서 돌려보기 — 드래그 회전 · 휠 확대 · 우클릭 이동 · 객체는 그냥 끌면 이동 (1)">🛰 조감</button>
  <button class="btn" id="b-walk" title="사람 눈높이(1.6m)로 걷기 — 드래그 둘러보기 · W A S D 이동 (2)">🚶 걷기</button>
  <span class="sep"></span>
  <span id="floors" style="display:flex;gap:4px"></span>
  <button class="btn sm" id="v-iso" title="아이소 전경 (3)">⌂</button>
  <button class="btn sm" id="v-top" title="바로 위에서 (4)">⬓</button>
  <button class="btn sm" id="v-front" title="정면 (5)">⬒</button>
  <button class="btn sm" id="v-side" title="측면 (6)">◨</button>
  <span class="sep"></span>
  <button class="btn on" id="b-light" title="조명 기구 켜기/끄기 (L)">💡</button>
  <button class="btn" id="b-night" title="낮/밤 무드 — 밤에는 조명이 주인공">🌗</button>
  <button class="btn" id="b-ceil" title="천장 보기/숨기기 (C)">⬛</button>
  <button class="btn on" id="b-label" title="공간 이름표">🏷</button>
  <button class="btn on" id="b-shadow" title="그림자 — 대형 도면은 자동으로 꺼짐">🌤</button>
  <span class="sep"></span>
  <button class="btn sm" id="b-shot" title="화면을 PNG 로 저장">📷</button>
  <button class="btn sm" id="b-glb" title="Blender 용 .glb (2단계 렌더)">⬇GLB</button>
  <button class="btn sm" id="b-json" title="3D 기본체 목록 JSON">⬇J</button>
  <span class="grow"></span>
  <span id="status" class="off">MiniCAD 연결 대기</span>
  <button class="btn sm" id="b-reload" title="MiniCAD 에서 도면을 다시 받는다">↻</button>
</div>
<div id="props"></div>
<div id="tools">
  <button class="btn on" data-t="select" title="선택 (Space) — 클릭=속성 · 끌면 이동">➤</button>
  <button class="btn" data-t="move" title="이동 (M) — 클릭해 집고, 옮겨서 다시 클릭 · ←→ 축 고정 · 숫자=mm">✥</button>
  <button class="btn" data-t="rotate" title="회전 (Q) — 클릭 후 좌우로, 클릭=확정 · 숫자=° · Shift=자유각">↻</button>
  <button class="btn" data-t="pushpull" title="밀기끌기 (P) — 벽·천장을 클릭해 위아래로 · 숫자=mm">⇕</button>
  <button class="btn" data-t="paint" title="페인트 (B) — 재질 고르고 벽/바닥/천장 클릭 (견적에도 반영)">🪣</button>
  <button class="btn" data-t="erase" title="지우개 (E) — 클릭=삭제">🧽</button>
  <button class="btn" data-t="tape" title="줄자 (T) — 두 점 거리 측정">📏</button>
</div>
<div id="paintpal"></div>
<div id="vcb"><span class="v-l">이동</span><input class="v-v" inputmode="decimal" aria-label="수치 입력"><span class="v-u">mm</span></div>
<div id="tip"></div>
<div id="hint"><b>스케치업식:</b> Space 선택 · M 이동 · Q 회전 · P 밀기끌기 · B 페인트 · E 지우개 · T 줄자 | 동작 중 <b>숫자 입력=정확한 값</b> · ←→ 축 고정 · Esc 취소 | Ctrl+Z 실행취소(평면과 한 몸) | 더블클릭=줌 · 휠버튼=궤도 · 우클릭=팬</div>
<div id="empty">아직 받은 도면이 없습니다.<br>MiniCAD 창에서 <b>🧊 3D</b> 버튼을 누르거나 명령창에 <b>3d</b> 를 입력하세요.<br><small>열어 두면 평면을 고칠 때마다 바로 반영되고, 여기서 고치면 평면에 반영됩니다.</small></div>
<div id="walkpad">
  <button data-k="q">⇧</button><button data-k="w">▲</button><button data-k="e">⇩</button>
  <button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button>
</div>
<script src="../js/data.js?v=3d4"></script>
<script src="../js/library.js?v=3d4"></script>
<script src="build3d.js?v=3d4"></script>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js"}}</script>
<script type="module" src="view3d.js?v=3d4"></script>
</body>
</html>
